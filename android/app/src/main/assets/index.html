<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SKRiMPAD x LIVE x</title>

    .brand { font-size: 12px; letter-spacing: .22em; color: var(--mut); text-transform: uppercase; }
    .hbtn { appearance: none; border: 1.4px solid var(--mut); background: transparent; color: var(--ink);
      font: 800 10px/1 'Oswald','Arial Narrow',sans-serif; letter-spacing: .1em; text-transform: uppercase;
      padding: 8px 11px; border-radius: 6px; cursor: pointer; }
    .hbtn:hover { border-color: var(--acc); color: var(--acc); }
    .hbtn.on { background: var(--acc); color: var(--bg); border-color: var(--acc); }
    #rec.on { background: #e0484f; border-color: #e0484f; color: #fff; }
    #play.on { background: var(--acc); border-color: var(--acc); color: var(--bg); }
    #transport { border: 1px solid #222c38; border-radius: 10px; padding: 8px 10px; }
    #transport .sep { width: 1px; height: 20px; background: #222c38; }
    #bpm { width: 54px; background: var(--pan); border: 1px solid #2a3441; color: var(--ink);
      font: 800 12px 'Oswald'; padding: 6px; border-radius: 5px; text-align: center; }
    label.mini { font-size: 8px; letter-spacing: .12em; color: var(--mut); text-transform: uppercase; }
    #beat { display: flex; gap: 4px; }
    #beat i { width: 8px; height: 8px; border-radius: 50%; background: #263040; display: inline-block; }
    #beat i.on { background: var(--acc); }
    #sync { border: 1.5px solid var(--acc); color: var(--acc); }
    #sync.flash { background: var(--acc); color: var(--bg); }
    #main { display: flex; gap: 14px; align-items: flex-start; flex: 1; }
    #lib { width: 210px; flex: none; border: 1px solid #222c38; border-radius: 10px; padding: 10px; }
    #lib h3 { margin: 0 0 8px; font-size: 10px; letter-spacing: .18em; color: var(--acc); text-transform: uppercase; }
    #drop { border: 1.4px dashed #2a3441; border-radius: 8px; padding: 14px 8px; text-align: center;
      font-size: 10px; color: var(--mut); cursor: pointer; }
    #drop.hot { border-color: var(--acc); color: var(--acc); }
    #libList { list-style: none; margin: 8px 0 0; padding: 0; max-height: 40vh; overflow: auto; }
    #libList li { font-size: 10px; padding: 6px 7px; margin-bottom: 4px; background: var(--pan);
      border: 1px solid #222c38; border-radius: 5px; cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #libhint { font-size: 9px; color: var(--mut); margin-top: 8px; line-height: 1.5; }
    #stage { display: flex; flex-direction: column; align-items: center; gap: 18px; flex: 1; }
    .board { width: 100%; max-width: 620px; }
    .board.dropok [data-drop] { outline: 1px solid rgba(75,214,200,.4); }
    .board-h { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--acc); padding: 3px 2px 5px; opacity: .85; }
    .board-b svg { max-width: 100%; height: auto; }
    #empty { color: var(--mut); font-size: 12px; margin: 30px auto; }
    #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--pan);
      border: 1px solid #2a3441; color: var(--ink); font-size: 11px; padding: 9px 15px; border-radius: 8px;
      opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; line-height: 1.4; }
    #toast.show { opacity: 1; }
  </style>
</head>

      <span class="brand">SKRiMPADxLIVEx</span>
      <button class="hbtn" data-dev="smk25">+ SMK-25</button>
      <button class="hbtn" data-dev="k61">+ 61-KEY</button>
      <button class="hbtn" id="clear">CLEAR</button>
      <span style="flex:1"></span>
      <button class="hbtn" id="bt" style="border-color:var(--acc);color:var(--acc)">📶 BT</button>
    </div>

    <div class="row" id="transport">
      <button class="hbtn" id="rec">● REC</button>
      <button class="hbtn" id="play">▶ PLAY</button>
      <button class="hbtn" id="stop">■ STOP</button>
      <button class="hbtn" id="export">⭳ EXPORT</button>
      <span class="sep"></span>
      <label class="mini">BPM</label><input id="bpm" type="number" min="40" max="300" value="100" />
      <label class="mini">BARS</label>
      <select id="bars" class="bpm" style="background:var(--pan);color:var(--ink);border:1px solid #2a3441;border-radius:5px;padding:6px">
        <option>1</option><option selected>2</option><option>4</option><option>8</option>
      </select>
      <button class="hbtn" id="metro">🕩 METRO</button>
      <span class="sep"></span>
      <button id="sync" class="hbtn">⟳ SYNC</button>
      <span class="sep"></span>
      <label class="mini">VOL</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" />
      <span style="flex:1"></span>
      <span id="beat"></span>
    </div>

    <div id="main">
      <div id="lib">
        <h3>蔵 Library</h3>
        <div id="drop">⬇ Drop audio / .zip<br>or tap to browse</div>
        <input id="file" type="file" accept="audio/*,.wav,.mp3,.flac,.ogg,.aiff,.aif,.m4a,.zip" multiple hidden />
        <ul id="libList"></ul>
        <div id="libhint">Drag a sound onto any <b>pad</b> or <b>key</b> to trigger it. Or drop a file straight on a pad.</div>
      </div>
      <div id="stage"></div>
    </div>
    <div id="empty">Add a demo board above, plug in a controller, or tap 📶 BT — then play. Hit ● REC to loop.</div>
  </div>
  <div id="toast"></div>
