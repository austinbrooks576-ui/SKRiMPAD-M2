/* ============================ ULTIMATE ====================================
   There is no chrome in this app. No title bars, no tab strips, no window
   furniture, no menu. Everything you can see is either the music or a control
   that is touching the music. That is not minimalism for its own sake — every
   pixel of chrome is a pixel not showing you your song, and on a phone that
   trade is brutal.

   The whole visual language is three ideas:
     · ONE LIGHT SOURCE, above. Every raised thing is lit on its top edge and
       casts downward. Consistency is what makes flat rectangles read as objects.
     · COLOUR MEANS IDENTITY. Each cell owns a hue for its whole life, at every
       altitude. You learn "the kick is the red one" once and it is true in the
       constellation, on the deck, and inside the waveform.
     · LIGHT MEANS ENERGY. Nothing blinks or spins for decoration; if something
       is glowing it is because audio is coming out of it right now.
   ------------------------------------------------------------------------ */
:root{
  color-scheme:dark;
  --void:#06070B;          /* the space everything floats in */
  --ink:#EEF3FA;
  --dim:#7E8798;
  --line:#222A36;
  --glass:rgba(20,26,36,.72);
  --acc:#4BE3C8;

  /* Fluid ramp — one continuous curve, no breakpoints, so there is no width at
     which the app snaps or looks broken. */
  --fs-xs:clamp(8.5px,.22vw + 7.8px,10.5px);
  --fs-sm:clamp(10px,.3vw + 9px,12.5px);
  --fs-md:clamp(12px,.42vw + 10.6px,15px);
  --fs-lg:clamp(16px,.9vw + 13px,24px);
  --fs-xl:clamp(22px,2.4vw + 14px,54px);
  --sp:clamp(6px,.5vw + 4.5px,12px);
  --hit:clamp(30px,2vw + 24px,38px);

  --e1:0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.34);
  --e2:0 2px 6px rgba(0,0,0,.55), 0 14px 40px rgba(0,0,0,.45);
  --lip:inset 0 1px 0 rgba(255,255,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);
  font-family:'Oswald','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%;
  letter-spacing:.06em;}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit;}

/* The surface everything lives on. Layers stack here and the atlas moves them
   in Z; nothing is ever added or removed, only flown past. */
#sky{position:fixed;inset:0;overflow:hidden;touch-action:none;}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform-origin:50% 50%;will-change:transform,opacity;}
/* --dock is the room the console needs where it sits by default. Every
   altitude shortens itself by that much, so the console has somewhere to be
   that is not on top of the work. It drops to 0 the moment the console is
   dragged somewhere else: at that point the position is a deliberate choice,
   and the app should not keep reserving space for a place it no longer is. */
.pane{width:min(94vw,1180px);height:min(calc(88svh - var(--dock,0px)),860px);position:relative;
  margin-bottom:var(--dock,0px);}
/* The size transition is for when the console is DRAGGED, and only then. At
   boot --dock starts unset, so the pane began full height and animated down to
   its docked size over 280ms — and for those 280ms the bottom row of pads
   genuinely was underneath the pill. Layout that animates on launch is not a
   nicety anyway; it is a wrong layout, briefly. */
body.ready .pane{transition:margin-bottom .28s cubic-bezier(.2,.7,.3,1),
                            height .28s cubic-bezier(.2,.7,.3,1);}

/* A slow drifting field so the void reads as depth rather than as a dead
   background. Pure CSS, no canvas, no per-frame cost. */
#sky::before{content:'';position:absolute;inset:-30%;pointer-events:none;
  background:
    radial-gradient(38vmax 38vmax at 22% 18%, rgba(75,227,200,.09), transparent 60%),
    radial-gradient(30vmax 30vmax at 82% 74%, rgba(160,90,255,.09), transparent 62%),
    radial-gradient(26vmax 26vmax at 62% 22%, rgba(255,90,140,.06), transparent 60%);
  animation:drift 44s ease-in-out infinite alternate;}
@keyframes drift{to{transform:translate3d(2.5%,-2%,0) scale(1.07);}}

/* ---------- ALTITUDE RAIL -------------------------------------------------
   The only persistent UI in the entire app. It is a depth gauge, not a menu:
   it tells you where you are and lets you jump, and it is five dots. */
#rail{position:fixed;left:max(10px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:4px;z-index:40;}
/* The dot is 8px because that is how big it should LOOK. The button is 26px
   because that is how big it has to be to hit — WCAG 2.2 asks for 24, and the
   rail is how you move between altitudes, so missing it is not a cosmetic
   failure. The gap shrinks to keep the visual rhythm of the original. */
.rdot{width:var(--hit);min-height:26px;height:26px;border:0;background:transparent;cursor:pointer;
  display:flex;align-items:center;gap:7px;padding:0;opacity:.42;transition:opacity .18s;}
.rdot i{width:8px;height:8px;box-shadow:0 0 0 1px rgba(255,255,255,.24);border-radius:50%;background:var(--ink);flex:none;transition:all .2s;}
.rdot span{font-size:var(--fs-xs);white-space:nowrap;opacity:0;transform:translateX(-4px);
  transition:all .2s;}
.rdot.on{opacity:1;}
.rdot.on i{background:var(--acc);box-shadow:0 0 0 4px rgba(75,227,200,.16),0 0 14px var(--acc);width:9px;height:9px;}
#rail:hover .rdot span,.rdot.on span{opacity:.85;transform:none;}

/* ---------- TRANSPORT -----------------------------------------------------
   Floats bottom-centre at every altitude, because "play" must never be more
   than one reach away no matter how deep you have flown. */
/* ---------- THE CONSOLE ----------------------------------------------------
   The transport pill and the wave monitor are ONE object, and it moves.

   They belong together because they are the same thing from two directions —
   what you told the app to do, and what the app is actually doing about it —
   and because a monitor that floats loose across the deck reads as damage
   rather than as a display. Bound to the pill it has an edge, a size and a
   place, and it goes wherever you put the pill.

   Movable because a fixed overlay is always in the wrong place for someone:
   it lands on the bottom row of pads on a short screen, over the constellation
   at CONSTELLATION altitude, and under your palm if you play left-handed.
   Rather than guess, let it be dragged and remember where it was left. */
/* An explicit width, so the monitor and the pill are the same object rather
   than two things that happen to be near each other. Without it the console
   was shrink-to-fit and the well came out wider than the pill it sits on. */
#console{position:fixed;z-index:40;width:min(92vw,600px);
  display:flex;flex-direction:column;align-items:stretch;gap:6px;touch-action:none;}
#console.dragging{opacity:.9;}
#console.dragging #bar{border-color:var(--acc);}
#bar{display:flex;align-items:center;justify-content:center;gap:var(--sp);padding:8px 12px;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--e2),var(--lip);}
/* The grip is the only part of the pill that is not a control, so it is the
   only part safe to drag from — dragging off a button would make every mistimed
   press move the console instead of doing what you asked. */
#grip{width:16px;height:var(--hit);flex:none;cursor:grab;display:grid;place-items:center;
  border-radius:8px;touch-action:none;}
#grip:active{cursor:grabbing;}
#grip i{display:block;width:3px;height:3px;border-radius:50%;background:var(--dim);
  box-shadow:0 -6px var(--dim),0 6px var(--dim),5px 0 var(--dim),5px -6px var(--dim),5px 6px var(--dim);}
#grip:hover i{background:var(--acc);
  box-shadow:0 -6px var(--acc),0 6px var(--acc),5px 0 var(--acc),5px -6px var(--acc),5px 6px var(--acc);}
.tb{width:var(--hit);height:var(--hit);border-radius:50%;border:1px solid var(--line);
  background:transparent;display:grid;place-items:center;cursor:pointer;transition:all .15s;flex:none;}
.tb:hover{border-color:var(--acc);}
.tb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
.tb.on{background:var(--acc);color:#04140F;border-color:var(--acc);box-shadow:0 0 18px rgba(75,227,200,.5);}
.tb.rec.on{background:#FF3B5C;border-color:#FF3B5C;box-shadow:0 0 18px rgba(255,59,92,.5);color:#fff;}
/* min-height, not height: the field must clear the 24px touch floor without
   the number jumping size when the fluid font scale moves. */
/* SWING sits beside BPM because they are the same kind of decision — how the
   grid feels — and because the scheduler has applied swing correctly since the
   first commit with nothing anywhere able to set it. */
#bpm,#swing{width:56px;min-height:26px;background:transparent;border:0;text-align:center;
  font-size:var(--fs-md);font-variant-numeric:tabular-nums;outline:none;}
#swing{width:46px;}
#bpm:focus,#swing:focus{color:var(--acc);}
.blab{font-size:var(--fs-xs);color:var(--dim);}

/* ---------- CELLS ---------------------------------------------------------
   The single repeated object of the whole app. It is a pad on the DECK, a node
   in the CONSTELLATION, and the subject of every altitude below. */
.grid{position:absolute;inset:0;display:grid;gap:clamp(5px,.7vw,11px);
  grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);}
.cell{position:relative;border-radius:clamp(10px,1.3vw,18px);cursor:pointer;
  border:1px solid rgba(255,255,255,.07);overflow:hidden;
  /* --l1/--l2 are computed per cell in buildDeck rather than fixed, so every
     pad carries the same LUMINANCE regardless of hue. A fixed 31% lightness is
     a very different brightness in yellow than in blue: the yellow-green pads
     visually shouted over the blue ones, and their labels fell to 3.67:1 —
     under the 4.5:1 the text needs to be readable. */
  background:linear-gradient(158deg,hsl(var(--h) 72% var(--l1,31%)),hsl(var(--h) 64% var(--l2,14%)));
  box-shadow:var(--e1),var(--lip);transition:transform .12s cubic-bezier(.2,.7,.3,1),box-shadow .12s;}
.cell:active{transform:scale(.972);}
.cell.mute{filter:saturate(.15) brightness(.62);}
/* Solo needs to read at a glance from across a room, and it has to say two
   things at once: this pad is the one you are hearing, and every other pad has
   gone quiet because of it. So the soloed pad gets a ring and the rest get
   dimmed — one state, told from both sides. Dimmed is deliberately lighter than
   muted: those pads are not switched off, they are waiting. */
.cell.solo{outline:2px solid var(--acc);outline-offset:-2px;
  box-shadow:var(--e1),var(--lip),0 0 22px rgba(75,227,200,.35);}
.cell.dimmed{filter:saturate(.35) brightness(.72);}
/* --e is written on every pad on nearly every frame while the music plays, and
   exactly one thing reads it: the pad's own ::after ring. As an ordinary custom
   property it still INHERITS, so each write invalidated the pad's whole subtree
   — a name, a ribbon and sixteen ribbon segments — asking the style engine to
   re-resolve seventeen elements that never look at it. Across sixteen pads that
   is 272 elements, sixty times a second, to light one ring.

   Registering it as non-inheriting is the entire fix: the write then reaches
   the pad and its pseudo-element and stops. An engine too old for @property
   ignores this and behaves exactly as it did before — correct, merely slower —
   so there is nothing that needs a fallback. */
@property --e { syntax:'<number>'; inherits:false; initial-value:0; }
/* Energy ring — driven by the meter, so brightness IS loudness. */
.cell::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px hsl(var(--h) 90% 62% / calc(var(--e) * .9)),
             0 0 calc(var(--e) * 26px) hsl(var(--h) 90% 58% / calc(var(--e) * .55));}
.cname{position:absolute;left:9px;top:8px;font-size:var(--fs-sm);font-weight:600;
  /* --lt is computed too. The label was hsl(h 95% 86%), which is a very
     different BRIGHTNESS per hue for exactly the same reason the pad is — so
     pinning only the background left the blue and violet labels failing
     instead of the yellow ones. Both sides of the ratio have to be held. */
  color:hsl(var(--h) 42% var(--lt,86%));text-shadow:0 1px 3px rgba(0,0,0,.65);letter-spacing:.1em;}
/* Step ribbon along the bottom of every pad: the pattern is visible without
   descending, so the DECK already tells you what the CELL contains. */
.ribbon{position:absolute;left:8px;right:8px;bottom:8px;height:5px;display:grid;
  grid-template-columns:repeat(16,1fr);gap:1px;}
.ribbon b{border-radius:1px;background:rgba(255,255,255,.09);}
.ribbon b.on{background:hsl(var(--h) 90% 62%);}
.ribbon b.at{background:#fff;box-shadow:0 0 7px #fff;}

/* ---------- CONSTELLATION -------------------------------------------------- */
#nebula{position:absolute;inset:0;width:100%;height:100%;}
/* The scene pills and the song actions used to be two independently positioned
   rows at 11% and 4.5% from the bottom. That holds until the pills wrap — which
   they do at 390px, where four of them become two rows — and then the second
   row of pills lands exactly on top of the buttons. Two absolutely positioned
   things whose heights depend on the viewport cannot be kept apart by choosing
   percentages; they have to be in one flow that lays itself out. */
.consbot{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:9px;max-width:96%;}
.scenepick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
/* Song-level actions live at the song-level altitude. Clearing a scene, copying
   one, and exporting are all things you do to the WHOLE arrangement, and
   CONSTELLATION is the only place the whole arrangement is on screen. Putting
   them in the transport pill would have meant a ninth control in a row that is
   already tight on a 390px phone. */
.sceneops{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.sop{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
  color:var(--dim);font-size:var(--fs-xs);letter-spacing:.12em;cursor:pointer;min-height:26px;
  transition:color .15s,border-color .15s;}
.sop:hover{color:var(--acc);border-color:var(--acc);}
.sop[disabled]{opacity:.5;cursor:default;}
.spill{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
  font-size:var(--fs-sm);cursor:pointer;min-height:var(--hit);}
.spill.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 16px rgba(75,227,200,.25);}

/* ---------- CELL / VOICE / GRAIN ------------------------------------------- */
/* A sheet scrolls when its contents genuinely do not fit — twelve knobs on a
   1024x400 landscape window overflowed by 18px, off the bottom of the pane with
   no way to reach them.

   justify-content: SAFE center, not plain center: ordinary centring on an
   overflowing flex column pushes the first row off the TOP, where there is no
   scrollbar direction to recover it. Safe centring falls back to start the
   moment the content is too tall, so everything stays reachable. */
.sheet{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:safe center;gap:calc(var(--sp)*1.7);
  padding:clamp(10px,2vw,26px);overflow-y:auto;overscroll-behavior:contain;}
.title{font-size:var(--fs-xl);font-weight:600;line-height:1;letter-spacing:.04em;}
.sub{font-size:var(--fs-sm);color:var(--dim);}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:clamp(3px,.5vw,7px);
  height:clamp(64px,18vh,132px);flex:none;}
.st{border-radius:6px;border:1px solid rgba(255,255,255,.08);cursor:pointer;position:relative;
  background:rgba(255,255,255,.03);transition:background .1s,box-shadow .1s;min-height:var(--hit);}
.st.on{background:hsl(var(--h) 88% 55%);box-shadow:0 0 16px hsl(var(--h) 88% 55% / .5);}
.st.beat{border-color:rgba(255,255,255,.18);}
.st.at{outline:2px solid #fff;outline-offset:-2px;}
.knobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:var(--sp);}
.kb{display:flex;flex-direction:column;align-items:center;gap:3px;}
.kb svg{width:clamp(44px,6vw,62px);height:auto;cursor:grab;touch-action:none;display:block;}
.kb .kv{font-size:var(--fs-sm);font-variant-numeric:tabular-nums;}
.kb .kl{font-size:var(--fs-xs);color:var(--dim);letter-spacing:.1em;}
/* flex-basis 0 for the same reason as the monitor canvas — an intrinsic canvas
   height inside a column flex feeds back into layout and creeps. */
#scope{width:100%;flex:1 1 0;min-height:120px;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.35);box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}

/* ---------- LIBRARY --------------------------------------------------------
   The library is not a panel and not a modal. It is a shelf that slides in over
   whatever altitude you are on, so you can drop a sound onto a cell WITHOUT
   leaving the place you were working. A modal would force you to close it to
   see the thing you were aiming at, which is exactly why sample assignment
   feels like a chore in every other DAW. */
/* NO backdrop-filter here, deliberately. The panel is 97% opaque — you cannot
   see through it, so the blur was producing no visible result whatsoever, while
   costing about twenty frames a second for as long as the shelf was open. That
   was true with ZERO sounds in it: 60fps closed, 41 open and empty, 38 with 500
   rows. The rows were never the problem; blurring a tall region every frame
   was. Closed shelf with 500 sounds still in the library: 61fps. */
#shelf{position:fixed;top:0;right:0;bottom:0;width:min(320px,84vw);z-index:50;
  background:rgba(9,12,17,.97);border-left:1px solid var(--line);
  transform:translateX(101%);transition:transform .26s cubic-bezier(.2,.7,.3,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.55);}
#shelf.open{transform:none;}
#shelf header{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;flex:none;}
#shelf header .t{font-size:var(--fs-lg);flex:1;letter-spacing:.1em;}
#drop{margin:0 14px 10px;padding:18px 10px;border:1px dashed var(--line);border-radius:12px;
  text-align:center;font-size:var(--fs-sm);color:var(--dim);cursor:pointer;flex:none;
  line-height:1.7;transition:all .16s;}
#drop:hover,#drop.hot{border-color:var(--acc);color:var(--acc);background:rgba(75,227,200,.07);}
#list{flex:1;overflow-y:auto;padding:0 10px 14px;display:flex;flex-direction:column;gap:4px;}
/* content-visibility lets the browser skip layout for rows scrolled out of
   view: rebuilding a 500-row list costs 9.4ms with it and 24.9ms without.
   contain-intrinsic-size supplies the height of a skipped row so the scrollbar
   stays honest rather than jumping as rows come into view. That is most of what
   virtualisation buys, in two declarations, with no scroll bookkeeping to get
   wrong.

   It is NOT what fixed the frame rate — see the shelf rule below. Adding this
   first and finding 500 rows still at 38fps is what forced the real measurement. */
.snd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;
  border:1px solid transparent;background:rgba(255,255,255,.035);cursor:grab;
  font-size:var(--fs-sm);min-height:var(--hit);
  content-visibility:auto;contain-intrinsic-size:auto var(--hit);}
.snd:hover{border-color:var(--acc);background:rgba(75,227,200,.09);}
.snd .k{font-size:var(--fs-xs);color:var(--acc);letter-spacing:.1em;flex:none;min-width:48px;}
.snd .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.snd .d{font-size:var(--fs-xs);color:var(--dim);font-variant-numeric:tabular-nums;flex:none;}
/* The remove button stays out of the way until you are on the row, so a list of
   500 is not 500 little crosses shouting at you. It is still reachable by
   keyboard at all times — hiding it from focus would be trading one
   unreachable feature for another. */
.snd .sx{flex:none;width:24px;height:24px;border:0;background:transparent;color:var(--dim);
  border-radius:6px;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s,color .15s;}
.snd:hover .sx,.snd .sx:focus-visible{opacity:1;}
.snd .sx:hover{color:#FF6B84;}
.snd .sx svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;pointer-events:none;}
.snd.armed{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 20px rgba(75,227,200,.3);}
/* The sounds button lives ON the console. It used to float on its own at the
   bottom right, which meant two independent overlays that collided with each
   other on a narrow phone and both collided with the deck. One floating object
   that carries everything is easier to place, easier to move out of the way,
   and impossible to trap the other one under. */
/* A cell that owns a sample says so, quietly and permanently. */
.cell.hassample::before{content:'';position:absolute;right:9px;top:10px;width:6px;height:6px;
  border-radius:50%;background:hsl(var(--h) 96% 76%);box-shadow:0 0 9px hsl(var(--h) 96% 76%);z-index:2;}
/* Every cell lights up while a sound is armed, because every cell is now a
   target — the UI should say so rather than leave you guessing. */
.cell.arm{outline:2px solid var(--acc);outline-offset:-2px;}

/* ---------- WAVELENGTH MONITOR --------------------------------------------
   The key system has no UI at all, which is the right call and leaves the
   player with nothing that confirms the instrument heard them. This is that
   confirmation, and it is the only visible part: a live trace of what is
   actually leaving the speaker, so pushing the mod wheel makes the wave
   breathe and bending stretches its cycles under your finger.

   It is fixed rather than laid out, so it costs nothing in the flow and can
   never push anything around, and pointer-events are off so it is scenery you
   cannot get stuck on. It fades itself out when there is no signal — invisible
   until there is something to see, which is the whole brief. */
/* The monitor is a WELL now, not a strip. Before, it was a full-width trace
   fixed across the bottom of the screen, so at DECK altitude it ran straight
   through the bottom row of pads and read as a crack in the glass rather than
   as a display. Sound belongs inside something. Giving it a border, a floor
   and a fixed size makes it an instrument panel — and bounding it inside the
   console means it can never overlap anything again, because it is no longer
   free to be anywhere. */
#mon{width:100%;height:clamp(30px,5.2vh,54px);border-radius:12px;overflow:hidden;
  position:relative;opacity:0;transition:opacity .45s ease;
  background:linear-gradient(180deg,rgba(3,5,9,.86),rgba(6,9,15,.78));
  border:1px solid var(--line);box-shadow:var(--well),var(--e1);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
#mon.live{opacity:1;}
/* A centre line, so a silent monitor still looks like an instrument at rest
   rather than an empty box someone forgot to fill. */
#mon::before{content:'';position:absolute;left:8px;right:8px;top:50%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);}
/* flex-basis 0 AND min-width 0, both deliberately. A canvas carries an
   intrinsic size from its width attribute, and that size feeds back into flex
   layout: the box grows, we measure the bigger box, we set a bigger width
   attribute, which grows the box again. Left alone it ran away to 37910px in
   a 1280px window. min-width:0 is what actually breaks the loop — without it
   the automatic minimum size keeps the canvas at its intrinsic width no matter
   what the flex basis says. */
/* The soft ends belong to the CANVAS, not to #mon. mask-clip defaults to
   border-box, so masking the container also clipped away the readout sitting
   just outside it — the text was present and correct and simply never painted. */
/* min-width:0 is load-bearing. A canvas carries an intrinsic size from its
   width attribute, that size feeds layout, we measure the bigger box and set a
   bigger attribute — left alone it ran away to 37910px in a 1280px window. */
#mon canvas{display:block;width:100%;min-width:0;height:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);}
/* The readout gets its OWN LINE above the well rather than sitting on top of
   the trace. Laid over the waveform it was legible but wrong: two things
   competing for the same pixels, which is exactly the kind of conflict this
   pass is meant to remove. It only ever prints a control that is off its
   resting position, and :empty collapses the row entirely, so an untouched
   keyboard costs no space at all. */
#hands{align-self:flex-end;padding:0 4px;font-size:var(--fs-xs);letter-spacing:.11em;
  color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;
  pointer-events:none;text-shadow:0 1px 5px rgba(0,0,0,.95);
  opacity:0;transition:opacity .25s;}
#hands:not(:empty){opacity:1;}
#hands:empty{display:none;}
#hands b{color:var(--acc);font-weight:600;}

/* ---------- STATUS ---------------------------------------------------------
   The MIDI readout is also the way IN to the MIDI window. It already says what
   the app thinks is plugged in, so it is where anyone would go to argue with
   that — and reusing it costs no new chrome on a phone where the transport row
   is already tight. */
#status{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));
  z-index:40;font-size:var(--fs-xs);color:var(--dim);text-align:right;max-width:44vw;line-height:1.5;
  border:0;background:transparent;cursor:pointer;padding:4px 2px;min-height:26px;
  font-family:inherit;letter-spacing:inherit;transition:color .16s;}
#status:hover{color:var(--ink);}
#status b{color:var(--acc);font-weight:600;}
/* The one piece of chrome in the app that is not touching the music. It is here
   because a catalogue of what everything does is worthless if you cannot find
   it, and there is nowhere else in a chrome-less app to put it. Top LEFT, where
   the rail is vertically centred and nothing else lives. */
#gear{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));
  z-index:40;width:var(--hit);height:var(--hit);min-width:26px;min-height:26px;border:0;
  background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center;
  opacity:.5;transition:opacity .18s,color .18s;}
#gear:hover,#gear:focus-visible{opacity:1;color:var(--acc);}
#gear svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}

/* ---------- WINDOWS --------------------------------------------------------
   Two things in this app genuinely are windows rather than altitudes: the MIDI
   connection and the manual. Both are ABOUT the app rather than part of the
   music, both are things you open, read and close, and neither belongs at a
   depth in the song. They are the only modal surfaces here, and they say so —
   a scrim, a border lit on its top edge, and one way out.

   The scrim is a plain colour, not a backdrop-filter. Blurring a full-screen
   region every frame cost about twenty frames a second when the shelf did it,
   and the panel behind is opaque enough that nobody would have seen the blur. */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(4,5,8,.62);
  opacity:0;pointer-events:none;transition:opacity .2s;}
.scrim.open{opacity:1;pointer-events:auto;}
.win{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);
  width:min(620px,94vw);max-height:min(86svh,760px);display:flex;flex-direction:column;
  background:rgba(11,14,20,.985);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--e2),var(--lip);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s cubic-bezier(.2,.7,.3,1);}
.win.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
.win header{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;flex:none;}
.win header .t{font-size:var(--fs-lg);flex:1;letter-spacing:.12em;}
.win .body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 14px 16px;
  display:flex;flex-direction:column;gap:var(--sp);}
.wsec{font-size:var(--fs-xs);color:var(--dim);letter-spacing:.18em;padding-top:6px;}
.wbtn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.035);
  color:var(--ink);font-size:var(--fs-sm);letter-spacing:.1em;cursor:pointer;min-height:var(--hit);
  transition:border-color .15s,color .15s,background .15s;}
.wbtn:hover{border-color:var(--acc);color:var(--acc);background:rgba(75,227,200,.08);}
.wbtn.danger:hover{border-color:#FF6B84;color:#FF6B84;background:rgba(255,107,132,.08);}

/* ---------- MIDI WINDOW ----------------------------------------------------
   Everything here is a READOUT, not a mapping page. There is still nothing to
   configure — see core/keys.js for why — with exactly one exception: which of
   the two things a controller IS. That is the only question the app can get
   wrong in a way you cannot play around, so it is the only one you can answer.

   The rest of the window exists to answer "is it actually hearing me?", which
   is the question every MIDI problem really is. */
.port{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);}
.port .pn{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--fs-sm);}
.port .pr{font-size:var(--fs-xs);letter-spacing:.14em;padding:3px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim);flex:none;}
.port .pr.keys{color:var(--acc);border-color:rgba(75,227,200,.5);}
.port .pr.pads{color:#FFC06B;border-color:rgba(255,192,107,.5);}
.port .pr.live{box-shadow:0 0 12px rgba(75,227,200,.35);}
.port .pb{font-size:var(--fs-xs);letter-spacing:.1em;padding:5px 9px;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;
  min-height:26px;flex:none;transition:color .15s,border-color .15s;}
.port .pb:hover{color:var(--acc);border-color:var(--acc);}
.none{font-size:var(--fs-sm);color:var(--dim);line-height:1.8;padding:4px 2px;}
.none b{color:var(--ink);font-weight:600;}
.none .dim{font-size:var(--fs-xs);opacity:.6;font-variant-numeric:tabular-nums;letter-spacing:.08em;}

/* THE KEY DISPLAY.
   Same light model as the rest of the app: every key is lit on its top edge and
   casts downward, so the bed reads as a row of physical objects rather than a
   diagram. A pressed key loses its highlight and gains the cell's hue, because
   colour means identity here — the keyboard is playing whichever cell you are
   looking at, and it says so in that cell's colour. */
#keybed{position:relative;height:clamp(74px,13vh,104px);margin-top:2px;
  border-radius:10px;background:#05060A;border:1px solid var(--line);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.75);padding:6px 6px 7px;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
#keybed .kw,#keybed .kk{position:absolute;top:6px;border-radius:0 0 4px 4px;cursor:pointer;}
#keybed .kw{bottom:7px;background:linear-gradient(180deg,#DDE4EE,#98A2B4 62%,#7D879A);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 2px rgba(0,0,0,.5);}
#keybed .kk{height:60%;background:linear-gradient(180deg,#2B3240,#12161E 58%,#080B10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 2px 4px rgba(0,0,0,.7);z-index:2;
  border-radius:0 0 3px 3px;}
#keybed .kw.on{background:linear-gradient(180deg,hsl(var(--h) 92% 78%),hsl(var(--h) 90% 56%));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 16px hsl(var(--h) 90% 56% / .65);}
#keybed .kk.on{background:linear-gradient(180deg,hsl(var(--h) 92% 62%),hsl(var(--h) 88% 38%));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 14px hsl(var(--h) 90% 52% / .6);}
/* Only the Cs are named. Naming all 49 turns an instrument into a chart. */
#keybed .kw b{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:8px;
  font-weight:400;color:rgba(10,12,18,.5);letter-spacing:0;pointer-events:none;}
/* The hardware's own controls, as levels. This is the part that proves the
   wheels and the pressure sensor are getting through — the thing a MIDI monitor
   is actually for, minus the hex. */
/* The voice chips. Colour is the pad's own hue, because that is how every
   other part of this app says which pad it is talking about. */
#voicepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:4px;}
.vchip{font-size:var(--fs-xs);letter-spacing:.08em;padding:6px 4px;border-radius:8px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);
  cursor:pointer;min-height:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color .13s,border-color .13s,background .13s;}
.vchip:hover{color:hsl(var(--h) 90% 76%);border-color:hsl(var(--h) 80% 50%);}
.vchip.on{color:hsl(var(--h) 95% 80%);border-color:hsl(var(--h) 90% 60%);
  background:hsl(var(--h) 80% 50% / .16);box-shadow:0 0 12px hsl(var(--h) 90% 55% / .3);}
.exprs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;}
/* Each meter is a bordered cell of its own. Laid out as bare rows in a grid
   they ran together — the value of one sat right beside the label of the next,
   and "+0.00st MOD" reads as one field rather than the end of one and the start
   of another. */
.ex{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--dim);
  letter-spacing:.12em;padding:6px 9px;border-radius:9px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);}
.ex .exl{flex:none;min-width:46px;}
.ex .exb{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.07);
  position:relative;overflow:hidden;}

  box-shadow:0 0 8px rgba(75,227,200,.55);left:0;width:0;}
.ex .exv{flex:none;min-width:38px;text-align:right;font-variant-numeric:tabular-nums;}
#lastmsg{font-size:var(--fs-xs);color:var(--dim);font-variant-numeric:tabular-nums;
  letter-spacing:.1em;min-height:1.4em;}

/* ---------- HELP -----------------------------------------------------------
   Rendered from the same table the app checks itself against, so a control that

.hgrp{border-top:1px solid var(--line);padding-top:9px;}
.hgrp h4{font-size:var(--fs-sm);letter-spacing:.2em;color:var(--acc);font-weight:400;margin-bottom:5px;}

  padding:9px 11px;}

#hint{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);
  z-index:40;font-size:var(--fs-xs);color:var(--dim);letter-spacing:.16em;pointer-events:none;
  transition:opacity .3s;}
/* There was exactly ONE focus style in this entire file, on the tempo field.
   Everything else could be reached by keyboard and gave no sign of where you

<script type="module">
import { createAtlas, bindGestures, ALTITUDES } from './core/atlas.js';
import { loadSong, saveSong, createHistory, liveCells, liveScene, STEPS, CELLS, SCENES } from './core/model.js';
import { createEngine } from './core/engine.js';
import { createMidiIO } from './core/midi-io.js';
import { createLibrary } from './core/library.js';
import { createKeys } from './core/keys.js';
import { createScope } from './core/wave.js';
import { bounceScene, saveBlob } from './core/bounce.js';
import { createFog, makeStars } from './core/fog.js';

const $ = (s) => document.querySelector(s);
// setPointerCapture throws whenever the pointer it names is not currently
// active — a pointerdown that arrives without a live pointer, a synthetic
// event, a pointer the browser already released. Uncaught, that exception
// aborts the rest of the handler, so the gesture never starts and the control
// looks dead for no reason anyone could diagnose. Capture is an optimisation
// here, not a requirement: the handlers all work without it.
function capture(el, id) { try { el.setPointerCapture(id); } catch (e) {} }
// Did this app just arrive, or is someone coming back to their work? The
// answer changes what the one line of on-screen guidance should say.
const FIRST_RUN = !localStorage.getItem('skrimpad_ultimate_song');
const song = loadSong();
// The engine looks samples up SYNCHRONOUSLY — it is called from the scheduler
// with an exact future start time, and an await there would land the note late.
const warm = new Map();                       // sampleId -> decoded AudioBuffer
const eng = createEngine({
  sampleFor: (id) => warm.get(id) || null,
  // No output device, or a WebView with audio switched off. Everything else in
  // the app still works — you can program, arrange and import — so say what
  // happened instead of leaving someone tapping a grid that makes no sound and
  // drawing their own conclusions about whether it is broken.
  onFail: () => {
    const s = $('#status');
    if (s) s.innerHTML = '<b>no audio output</b><br>the app still works — you just cannot hear it';
  },
});
const lib = createLibrary({
  ctx: () => eng.init(),
  onChange: renderList,
  // A sound that could not be saved has to SAY so. Silently dropping it looks
  // identical to a file the app could not decode, and the fix is completely
  // different: one is "this file is wrong", the other is "your device is full".
  onError: (kind, name) => {
    toast(kind === 'storage'
      ? 'out of space — could not save ' + String(name).slice(0, 20)
      : 'could not import ' + String(name).slice(0, 20));
  },
});
const hist = createHistory();
hist.push(song);

// ---- ATLAS ----------------------------------------------------------------
const atlas = createAtlas({ onRender: onAltitude });
document.querySelectorAll('.layer').forEach((el) => {
  atlas.register(+el.dataset.alt, el, null);
});
bindGestures($('#sky'), atlas);

// The rail is the only persistent UI. Five dots, each a place.
const rail = $('#rail');
ALTITUDES.forEach((n, i) => {
  const b = document.createElement('button');
  b.className = 'rdot'; b.innerHTML = '<i></i><span>' + n + '</span>';
  b.addEventListener('click', () => atlas.goTo(i));
  rail.appendChild(b);
});
function onAltitude(depth) {
  const lvl = Math.round(depth);
  [...rail.children].forEach((b, i) => b.classList.toggle('on', i === lvl));
  const h = $('#hint');
  h.style.opacity = depth > 0.02 && depth < 0.98 ? '0' : '';
  // onRender fires on every frame of a flight, not once on arrival — so a
  // single trip to CELL used to rebuild its step grid about thirty times.
  // Besides the waste, rebuilding mid-gesture destroys the element you are
  // dragging on, so a paint stroke or a knob turn could be cut in half by the
  // tail end of the animation that brought you there. Redraw only when the
  // thing being shown actually changes.
  const focus = atlas.focusAt(2) ?? 0;
  if (lvl === sheetLvl && focus === sheetIdx) return;
  sheetLvl = lvl; sheetIdx = focus;
  if (lvl === 2) drawCellSheet();
  if (lvl === 3) drawVoiceSheet();
  if (lvl === 4) drawGrainSheet();
}
let sheetLvl = -1, sheetIdx = -1;
// One paint-drag state for the whole app, with ONE listener that lives forever.
// It used to be a fresh {once:true} listener per rebuild: the first pointerup
// consumed every one of them, so the SECOND drag had nothing left to clear its
// flag and the grid stuck in paint mode — every step you hovered afterwards
// flipped, with no way out but leaving the altitude.
let painting = 0;
window.addEventListener('pointerup', () => { painting = 0; });
window.addEventListener('pointercancel', () => { painting = 0; });
// Anything that edits the model behind the sheets has to say so, or the
// redraw-only-on-change rule above will happily show a stale grid.
function invalidateSheets() { sheetLvl = -1; sheetIdx = -1; }

// ---- DECK (altitude 1) ------------------------------------------------------
// What lightness does this hue need to hit a given relative luminance?
//
// HSL lightness is not brightness. hsl(60 72% 31%) — a yellow — is far brighter
// to the eye than hsl(240 72% 31%), and the WCAG luminance formula agrees:
// green carries 0.7152 of the weight, blue only 0.0722. Using one lightness for
// all sixteen hues therefore produced a grid where a third of the pads glared
// and their labels were unreadable, while the rest sat back.
//
// There is no closed form for the inverse, so this bisects — sixteen steps,
// once per cell, at build time only.
function lightnessFor(hue, sat, targetLum) {
  const chan = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  const lumOf = (l) => {
    const c = (1 - Math.abs(2 * l - 1)) * sat;
    const h = ((hue % 360) + 360) % 360 / 60;
    const x = c * (1 - Math.abs((h % 2) - 1));
    const m = l - c / 2;
    const t = h < 1 ? [c, x, 0] : h < 2 ? [x, c, 0] : h < 3 ? [0, c, x]
            : h < 4 ? [0, x, c] : h < 5 ? [x, 0, c] : [c, 0, x];
    return 0.2126 * chan(t[0] + m) + 0.7152 * chan(t[1] + m) + 0.0722 * chan(t[2] + m);
  };
  let lo = 0, hi = 1;
  for (let i = 0; i < 20; i++) {
    const mid = (lo + hi) / 2;
    if (lumOf(mid) < targetLum) lo = mid; else hi = mid;
  }
  return +((lo + hi) / 2 * 100).toFixed(2);
}
const deck = $('#deck');
// The cell a controller plays when you are not focused on one in particular.
// THE SELECTED PAD. One number with one meaning: the pad the keyboard plays,
// the pad the wave monitor takes its colour from, and the pad the MIDI window
// names. It used to be `atlas.focusAt(1) ?? lastCell`, so the answer depended on
// where you happened to be looking and could not be set deliberately at all —
// which is why the keyboard so often played something you had not chosen.
let keyCell = 0;
let lastCell = 0;                 // the last pad touched; the same thing now
function selectCell(i, why) {
  if (!(i >= 0 && i < CELLS) || i === keyCell) return;
  keyCell = lastCell = i;
  syncVoicePick();
  // Announce it only when the change came from hardware. Flying to a pad is
  // already enormous feedback of its own; a toast on top of that would fire on
  // practically every gesture in the app.
  if (why === 'pad' || why === 'knob') {
    const c = liveCells(song)[i];
    if (c) toast('keys \u2192 ' + c.name);
  }
}
function buildDeck() {
  deck.innerHTML = '';
  liveCells(song).forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'cell'; el.style.setProperty('--h', c.hue); el.style.setProperty('--e', 0);
    // A pad was a bare div: no role, no name, no way to reach it without a
    // pointer. Sixteen of them, and they are the primary instrument. A screen
    // reader announced nothing at all and a keyboard could not touch them.
    el.setAttribute('role', 'button');
    el.tabIndex = 0;
    // Equal luminance, not equal lightness — see the gradient rule above.
    el.style.setProperty('--l1', lightnessFor(c.hue, 0.72, 0.100) + '%');
    el.style.setProperty('--l2', lightnessFor(c.hue, 0.64, 0.030) + '%');
    // 0.68 against the 0.100 top stop is (0.68+0.05)/(0.100+0.05) = 4.87:1,
    // clear of the 4.5:1 floor with a little room for rounding.
    // 42% saturation, not 95%. Both reach the same luminance and therefore the
    // same contrast ratio, but at 95% the brighter hues come out as neon text,
    // which is not what a pad label should be. Lower saturation lands on a
    // gently tinted near-white — the look the design already had, now with the
    // ratio actually guaranteed rather than assumed.
    el.style.setProperty('--lt', lightnessFor(c.hue, 0.42, 0.68) + '%');
    el.dataset.i = i;
    el.innerHTML = '<div class="cname"></div><div class="ribbon"></div>';
    if (c.voice.sampleId) el.classList.add('hassample');
    el.querySelector('.cname').textContent = c.name;
    syncCellLabel(el, c, i);
    const rib = el.querySelector('.ribbon');
    for (let s = 0; s < STEPS; s++) rib.appendChild(document.createElement('b'));
    // Tap plays. Hold descends. One object, two verbs, no mode switch — which
    // is the whole reason there is no "edit mode" anywhere in this app.
    let held = 0;
    el.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      if (armed) { assignSample(i, armed); return; }   // sound-first assignment
      // Whatever you touched last is what the keys will sound, so a controller
      // follows your attention without anything having to be selected.
      selectCell(i, 'touch');
      eng.resume(); eng.play(c.voice, 0, 112, i);
      recordHit(i, 112);
      flash(i);
      held = setTimeout(() => { held = 0; atlas.setFocus(2, i); atlas.goTo(2, i); }, 380);
    });
    const up = () => { if (held) { clearTimeout(held); held = 0; } };
    el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up);
    el.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        // stopPropagation as well as preventDefault: the window handler treats
        // Space as play/stop, so without this a pad would fire AND the
        // transport would toggle from the same press.
        ev.preventDefault(); ev.stopPropagation();
        selectCell(i, 'key'); eng.resume(); eng.play(c.voice, 0, 112, i); recordHit(i, 112); flash(i);
      } else if (ev.key === 'm' || ev.key === 'M') {
        ev.preventDefault(); ev.stopPropagation(); toggleMute(i);
      } else if (ev.key === 's' || ev.key === 'S') {
        ev.preventDefault(); ev.stopPropagation(); toggleSolo(i);
      }
    });
    el.addEventListener('contextmenu', (ev) => {
      ev.preventDefault();
      // Shift is the modifier every mixer uses for solo-vs-mute.
      ev.shiftKey ? toggleSolo(i) : toggleMute(i);
    });
    deck.appendChild(el);
  });
  cacheRibbons();
  refreshCellStates();
}
// The label has to carry what the pad IS and what state it is in, because the
// colour and the ribbon say both of those things to everyone else.
function syncCellLabel(el, c, i) {
  const on = c.steps.filter((v) => v > 0).length;
  el.setAttribute('aria-label',
    c.name + ', pad ' + (i + 1) + ' of ' + CELLS + ', ' +
    (on ? on + ' of ' + STEPS + ' steps' : 'empty') +
    (c.mute ? ', muted' : '') + (c.solo ? ', soloed' : ''));
  el.setAttribute('aria-pressed', c.mute ? 'true' : 'false');
}
function flash(i) {
  const el = deck.children[i]; if (!el) return;
  el.style.setProperty('--e', 1);
}
// SOLO existed in the model and the engine honoured it — anySolo has been in the
// scheduler since the first commit — and nothing anywhere could set it. On a
// sixteen-pad grid solo is how you hear the one thing you are working on, which
// makes it arguably more useful than mute, and it has been unreachable the whole
// time. Same shape of bug as the redo bound to no key and the record button that
// only lit up.
function toggleSolo(i) {
  const c = liveCells(song)[i];
  c.solo = !c.solo;
  // Soloing something that is muted is a contradiction the engine would resolve
  // as silence, which looks broken. Solo wins and clears the mute.
  if (c.solo) c.mute = false;
  refreshCellStates();
  hist.push(song); saveSong(song);
}
// Solo is a statement about the whole deck, not one pad: the moment anything is
// soloed, every other pad is implicitly silent and has to look it.
function refreshCellStates() {
  const cells = liveCells(song);
  const anySolo = cells.some((c) => c.solo);
  cells.forEach((c, i) => {
    const el = deck.children[i]; if (!el) return;
    el.classList.toggle('mute', c.mute);
    el.classList.toggle('solo', !!c.solo);
    el.classList.toggle('dimmed', anySolo && !c.solo && !c.mute);
    syncCellLabel(el, c, i);
  });
}

function toggleMute(i) {
  const c = liveCells(song)[i]; c.mute = !c.mute;
  if (c.mute) c.solo = false;
  // aria-pressed carried the mute state and was never refreshed, so a screen
  // reader was told the opposite of the truth for as long as the pad stayed
  // muted — worse than saying nothing.
  refreshCellStates();
  hist.push(song); saveSong(song);
}

// ---- CELL (altitude 2) ------------------------------------------------------
function drawCellSheet() {
  const i = atlas.focusAt(2) ?? 0;
  const c = liveCells(song)[i]; if (!c) return;
  const sheet = $('#cellsheet');
  sheet.style.setProperty('--h', c.hue);
  sheet.innerHTML =
    '<div><div class="title">' + esc(c.name) + '</div>' +
    '<div class="sub">TAP A STEP TO PLACE IT · DRAG ACROSS TO PAINT · FLY DOWN FOR THE VOICE</div></div>' +
    '<div class="steps" id="steps"></div>';
  const st = sheet.querySelector('#steps');
  for (let s = 0; s < STEPS; s++) {
    const b = document.createElement('div');
    b.className = 'st' + (c.steps[s] ? ' on' : '') + (s % 4 === 0 ? ' beat' : '');
    b.dataset.s = s;
    const set = (on) => {
      c.steps[s] = on ? 100 : 0;
      b.classList.toggle('on', !!on);
      syncRibbon(i); hist.push(song); saveSong(song);
    };
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault(); painting = c.steps[s] ? -1 : 1; set(painting > 0);
      eng.resume(); if (painting > 0) eng.play(c.voice, 0, 100, i);
    });
    b.addEventListener('pointerenter', () => { if (painting) set(painting > 0); });
    st.appendChild(b);
  }
}
// The ribbon segments, cached per pad. They are rebuilt only when the deck is,

const ribbonSegs = [];

    ribbonSegs.push(Array.prototype.slice.call(deck.children[i].querySelectorAll('.ribbon b')));
  }

}
function syncRibbon(i) {

  for (let s = 0; s < STEPS; s++) bs[s].classList.toggle('on', !!c.steps[s]);

// ---- VOICE (altitude 3) — real knobs, log tapers, live ----------------------
// Every range here MUST equal what the engine actually clamps to. They did not:
// the knobs stopped at attack 1.2 / decay 2 / release 3 while the engine
// honoured 2 / 3 / 4, so the new PAD and ATMOS presets sat outside their own
// knobs — the dial showed a lie until you touched it and then jumped. A knob
// whose travel is shorter than its parameter's is worse than no knob at all.
const PARAMS = [
  ['cutoff', 'CUTOFF', 0, 1], ['res', 'RESO', 0, 1],
  ['attack', 'ATTACK', 0.001, 2], ['decay', 'DECAY', 0.01, 3],
  ['sustain', 'SUSTAIN', 0, 1], ['release', 'RELEASE', 0.01, 4],
  ['drive', 'DRIVE', 0, 1], ['space', 'SPACE', 0, 1],
  // SPREAD earns a knob now that it does something: it is the whole difference
  // between one sawtooth and a supersaw, which is most of the LEAD's character.

  ['pan', 'PAN', -1, 1], ['gain', 'LEVEL', 0, 1.4],

function drawVoiceSheet() {
  const i = atlas.focusAt(2) ?? 0;

    '<div><div class="title">' + esc(c.name) + ' <span style="color:var(--dim);font-size:var(--fs-md)">VOICE</span></div>' +
    '<div class="sub">EVERY KNOB IS LIVE — TURN IT WHILE IT PLAYS</div></div>' +

const SWEEP = 280, START = 180 + (360 - SWEEP) / 2;

}

    '<svg viewBox="0 0 48 48" role="slider" tabindex="0" aria-label="' + label +
      '" aria-valuemin="' + lo + '" aria-valuemax="' + hi + '">' +
      '<path d="' + arcPath(C, C, AR, START, START + SWEEP) + '" fill="none" stroke="#0A0D12" stroke-width="3.4" stroke-linecap="round"/>' +
      '<path class="arc" d="" fill="none" stroke="hsl(' + cell.hue + ' 88% 58%)" stroke-width="2.8" stroke-linecap="round"/>' +
      '<circle cx="' + C + '" cy="' + (C + 1.6) + '" r="' + (R - 1) + '" fill="#000" opacity=".45"/>' +
      '<circle cx="' + C + '" cy="' + C + '" r="' + R + '" fill="#2A313E"/>' +
      '<circle cx="' + C + '" cy="' + C + '" r="' + (R - 1) + '" fill="#1A1F29" stroke="#000" stroke-opacity=".5"/>' +
      '<ellipse cx="' + (C - 4) + '" cy="' + (C - 5) + '" rx="6.5" ry="4" fill="#fff" opacity=".10" transform="rotate(-28 ' + (C - 4) + ' ' + (C - 5) + ')"/>' +
      '<g class="rot"><line x1="' + C + '" y1="' + (C - 4.5) + '" x2="' + C + '" y2="' + (C - R + 2.6) + '" stroke="#EEF3FA" stroke-width="2.1" stroke-linecap="round"/></g>' +
      '<circle cx="' + C + '" cy="' + C + '" r="2.8" fill="#101419"/>' +
    '</svg><div class="kv"></div><div class="kl">' + label + '</div>';

  const rot = wrap.querySelector('.rot'), out = wrap.querySelector('.kv');
  const norm = () => (cell.voice[key] - lo) / (hi - lo);

    const t = Math.max(0, Math.min(1, norm()));
    const a = START + t * SWEEP;
    rot.setAttribute('transform', 'rotate(' + (a + 90).toFixed(2) + ' ' + C + ' ' + C + ')');
    arc.setAttribute('d', t > 0.002 ? arcPath(C, C, AR, START, a) : '');
    const v = cell.voice[key];
    out.textContent = Math.abs(v) >= 10 ? v.toFixed(0) : (Math.abs(v) >= 1 ? v.toFixed(1) : v.toFixed(2));

    // they are adjusting; the label plus the number does.

  // all — focusable, announced as a slider, and completely inoperable. That is
  // worse than leaving it out of the tab order: it promises an interaction and
  // then does nothing, with no way to tell that from a broken app.
  svg.addEventListener('keydown', (e) => {
    const span = hi - lo;
    // Coarse and fine, because these ranges differ by orders of magnitude —
    // 1% of RESO is a nudge, 1% of RELEASE is 40ms.
    const step = e.shiftKey ? span / 200 : span / 50;
    let v = cell.voice[key], handled = true;
    switch (e.key) {
      case 'ArrowUp': case 'ArrowRight': v += step; break;
      case 'ArrowDown': case 'ArrowLeft': v -= step; break;
      case 'PageUp': v += span / 8; break;
      case 'PageDown': v -= span / 8; break;
      case 'Home': v = lo; break;
      case 'End': v = hi; break;

    if (!handled) return;

    // them to itself or turning it would fly you somewhere else.

  svg.addEventListener('pointerdown', (e) => {
    e.preventDefault(); capture(svg, e.pointerId);
    drag = { y: e.clientY, t: norm() };

  svg.addEventListener('pointermove', (e) => {

    // edge. Shift = a fifth of the speed, which is where cutoff actually lives.
    const span = e.shiftKey ? 900 : 190;
    drag.t = Math.max(0, Math.min(1, drag.t + (drag.y - e.clientY) / span));

// ---- GRAIN (altitude 4) — the actual signal --------------------------------

$('#sbounce').addEventListener('click', async (e) => {

// ---- LIVE RENDER LOOP ------------------------------------------------------
// One loop for the whole app. Each altitude draws only when it is visible, so
// flying to CONSTELLATION costs nothing while you are down in GRAIN.
// The last value written to each pad, so a value that has not changed is not
// written again. This is not micro-optimisation: a custom property set on a
// pad invalidates that pad's whole subtree, and each pad contains a sixteen
// segment ribbon — so sixteen unconditional writes per frame were asking the
// engine to restyle 272 elements sixty times a second, whether or not anything
// had actually moved. On a phone-class CPU the deck sat at 18fps because of it.
// Meters decay geometrically to zero and then stay there, so in practice almost
// every write was writing the same number over the top of itself.
const lastE = new Float32Array(CELLS).fill(-1);

// afford. Measured rather than guessed from the user agent: the same phone is
// fast on a cold app and slow with a browser full of tabs behind it, and a
// device string cannot tell you which one you are on right now.

    // nothing about how fast this machine is.
    // ASYMMETRIC on purpose. This number exists to protect the audio, and the
    // cost of the two mistakes is nowhere near equal: believing the machine is
    // fast when it has just got slow means a stall the scheduler was not ready
    // for, which is an audible crackle. Believing it is slow when it has got
    // fast again means a slightly wider look-ahead for a second, which nobody
    // can hear at all. So it rises in about two frames and falls over twenty.
    //
    // A symmetric average took nearly two seconds to notice at ten frames a
    // second — long enough for the first notes after switching into a heavy
    // view to go out late, which is exactly when it happened.
    if (dt < 400) frameMs += (dt - frameMs) * (dt > frameMs ? 0.5 : 0.05);

  // widen before a stall costs a note rather than after.

  // meters decay every frame so a hit reads as a strike, not a switch
  eng.decayMeters();
  if (lvl <= 1) {
    for (let i = 0; i < cells.length; i++) {
      const el = deck.children[i]; if (!el) continue;
      const e = eng.meters[i];
      // A twentieth of the range: below that the glow difference is not
      // visible on any screen, so the write buys nothing.
      if (Math.abs(e - lastE[i]) < 0.005) continue;

  // committed the notes. Everything already scheduled stays scheduled; this
  // only decides when it is allowed to LOOK like it has happened.

  // to the things that are not — the transport, the pads, and the scheduler

  // the frame clock. Everything else in that window is event-driven and costs
  // nothing while it is closed.

// ---- THE WAVELENGTH MONITOR ------------------------------------------------
// Drawn every frame, shown only when there is something to show. Two rules keep
// it from becoming clutter:
//   1. it disappears entirely when the signal dies, after a short grace period

  const peak = monScope($('#monwave'), { hue: c ? c.hue : 168 });

  // A short tail rather than an instant cut: notes have gaps, and a strip that
  // blinks out between them is more distracting than one that simply stays.

// ---- CONSTELLATION, THE ARRANGEMENT VIEW -----------------------------------
// This is not decoration. It is the only altitude where you can see the WHOLE
// song, and it earns that by making every visual property mean something you
// can act on:
//
//   ANGLE   which cell (fixed, so a body never moves out from under your finger)
//   RADIUS  how BUSY that cell is — dense parts pull toward the centre, sparse
//           ones drift out. So the silhouette of the field IS the arrangement:
//           a tight bright core reads as a full section, a wide sparse ring
//           reads as a breakdown, and you can tell them apart at a glance in a
//           song you have never opened.
//   SIZE    density again, plus live energy
//   RING    which scene. All four are drawn at once, so the whole song is on
//           screen and you switch by tapping a ring rather than hunting a menu.
//
// And it is EDITABLE, which is what turns a picture into a tool:
//   drag a body inward   -> the pattern fills in    (more steps)
//   drag it outward      -> the pattern thins out   (fewer steps)
//   tap                  -> audition it
//   double tap           -> mute / unmute
//
// Composing by density, with your whole song visible, is something no panel
// layout can offer — it needs one view that holds everything at once.
//
// THE SECOND VIEW: THE COLUMN.
// The field above is a PLAN view — looking down on the song, where time is a
// hand sweeping round and you edit by density. It is very good at "how full is
// this section" and completely blind to "what happens on the and of three".
//
// So the same data gets an ELEVATION: the bar stood on end and seen from the
// side, time running top to bottom, sixteen shells stacked down the column.
// Within a shell the cells are arranged like an atom — four nested orbits, four
// cells to an orbit — and a hit is a nucleus sitting on its orbit. A cell keeps
// the same orbit and the same angle in every shell, so its hits down the bar
// join into one strand, and following that strand IS reading its rhythm.
//

// land on that step, so the silhouette of the column is the density profile of
// the bar. A funnel that swells at the bottom is a fill; a straight pipe is a
// loop; a waist in the middle is where the bar breathes.
//

//   tap a nucleus       -> remove that hit
//   tap an empty orbit  -> put one there
//   drag                -> keep doing whichever of those you started with
// FOUR READINGS OF ONE THING.
// Nothing about the song changes between them. What changes is which question
// the picture is good at answering:
//
//   FIELD    this scene's cells, arranged by how busy each one is
//   COLUMN   this scene's time, step by step down a shaft
//   OORT     ALL FOUR SCENES at once, as a sphere you can turn in your hand
//   NEBULA   the field, seen through the gas — which colours carry the mix
//
// One button that cycles and NAMES WHERE YOU ARE. Four chips would be clearer
// on a desktop and would put eight buttons into a row that already wraps to two
// on a 390px phone. The price of cycling is that the control must say what it
// is currently showing, or it is a mystery button; so it does.
// GLOW SPRITES.
// Every body in every view was drawing its halo as a fresh createRadialGradient
// plus a fill over a circle several times its own radius. That is a gradient
// object allocated and a large area shaded, per body, per frame — sixteen times
// in the field, up to forty in the column, up to sixty-four in the Oort cloud.
// Radial shading is one of the more expensive things a 2D canvas does, and on a

  // shoulder, and nothing at the rim so the square edge of the sprite can
  // never show.
  rg.addColorStop(0, 'hsl(' + hue + ' 94% 66%)');
  rg.addColorStop(0.35, 'hsl(' + hue + ' 92% 58% / .55)');
  rg.addColorStop(0.7, 'hsl(' + hue + ' 90% 54% / .13)');
  rg.addColorStop(1, 'hsl(' + hue + ' 90% 54% / 0)');

const NEB = { hit: null, drag: null, col: null, mode: 'field', seek: -1,
              yaw: 0.55, pitch: 0.32, oort: null };
const VIEWS = ['field', 'column', 'oort', 'nebula'];
const VIEW_TIP = {
  field: 'The plan view — compose by density',
  column: 'The bar on end, one shell per step',
  oort: 'All four scenes at once — drag to turn it',
  nebula: 'The field seen through the gas — colour is what is carrying the mix',
};
const COL_MODE = 'skrimpad_ultimate_view';
try {

} catch (e) {}

function setView(mode) {
