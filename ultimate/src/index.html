    const rad = (0.44 - density * 0.27) * Math.min(W, H);
    return {
      i, c, density, ang,
      x: cx + Math.cos(ang) * rad,
      y: cy + Math.sin(ang) * rad * 0.78,
      r: (6 + density * 15 + (eng.meters[i] || 0) * 22),
    };
  });
}
// `overlay` means someone has already sized and painted the canvas and wants
// the field drawn on top of it. One function either way, because the NEBULA
// view is not a picture that resembles the field — it IS the field, and two
// implementations of it would be two things to keep in step.
function drawNebula(cells, overlay) {
  const rect = neb.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (!overlay) {
    if (neb.width !== (rect.width * dpr | 0)) { neb.width = rect.width * dpr; neb.height = rect.height * dpr; }
  }
  const W = neb.width, H = neb.height, cx = W / 2, cy = H / 2;
  if (!overlay) nctx.clearRect(0, 0, W, H);

  // Scene rings — the whole song at once. The live one is lit; the others are
  // there so you always know how much song exists beyond what you are playing.
  for (let sc = SCENES - 1; sc >= 0; sc--) {
    const rr = (0.17 + sc * 0.085) * Math.min(W, H);
    const live = sc === song.scene;
    nctx.beginPath();
    nctx.ellipse(cx, cy, rr, rr * 0.78, 0, 0, 7);
    nctx.strokeStyle = live ? 'rgba(75,227,200,.30)' : 'rgba(255,255,255,.055)';
    nctx.lineWidth = (live ? 1.6 : 1) * dpr;
    nctx.stroke();
  }

  // Playhead: a hand sweeping the field in time. It tells you WHERE you are in
  // the bar without a number, and it is the thing that makes the constellation
  // feel like it is running rather than sitting still.
  if (eng.playing) {
    const a = (eng.step / 16) * Math.PI * 2 - Math.PI / 2;
    const rr = 0.47 * Math.min(W, H);
    const g = nctx.createLinearGradient(cx, cy, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.78);
    g.addColorStop(0, 'rgba(75,227,200,.35)'); g.addColorStop(1, 'rgba(75,227,200,0)');
    nctx.strokeStyle = g; nctx.lineWidth = 2.4 * dpr;
    nctx.beginPath(); nctx.moveTo(cx, cy);
    nctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.78); nctx.stroke();
  }

  const bodies = nebLayout(cells, W, H);
  NEB.hit = bodies;
  bodies.forEach((b) => {
    const e = eng.meters[b.i] || 0;
    const size = b.r * dpr;
    const col = 'hsl(' + b.c.hue + ' 92% ' + (52 + e * 30) + '%';
    // halo — a baked sprite, not a gradient built and shaded every frame
    drawGlow(b.c.hue, b.x, b.y, size * 2.8, b.c.mute ? 0.16 : 0.85);
    // core
    nctx.fillStyle = col + ' / ' + (b.c.mute ? .3 : 1) + ')';
    nctx.beginPath(); nctx.arc(b.x, b.y, size * 0.42, 0, 7); nctx.fill();
    // A muted body keeps its place but is struck through, so silence is a
    // visible decision rather than an absence you have to notice.
    if (b.c.mute) {
      nctx.strokeStyle = 'rgba(255,255,255,.5)'; nctx.lineWidth = 1.4 * dpr;
      nctx.beginPath();
      nctx.moveTo(b.x - size * 0.6, b.y - size * 0.6);
      nctx.lineTo(b.x + size * 0.6, b.y + size * 0.6); nctx.stroke();
    }
    // Name the ones worth naming. Labelling all 16 at all times is noise; the
    // busy ones are the ones you are working on.
    if (b.density > 0.06 || e > 0.15) {
      nctx.font = (10 * dpr) + 'px Oswald, sans-serif';
      nctx.fillStyle = 'hsl(' + b.c.hue + ' 90% 82% / ' + (b.c.mute ? .35 : .9) + ')';
      nctx.textAlign = 'center';
      nctx.fillText(b.c.name, b.x, b.y + size * 0.42 + 15 * dpr);
    }
  });
}

// ---- THE COLUMN ------------------------------------------------------------
// One layout function for both the renderer and the hit test, and it returns a
// node for EVERY cell at EVERY step — not just the ones that are on. An empty
// orbit has to be as targetable as a full one, or the view can only delete.
//
// Four shells of four. Sixteen cells evenly spaced round a single ellipse would
// look tidier and be unusable: seen edge-on, neighbouring angles land about ten
// pixels apart near the sides, which is not a finger target. Nesting them puts
// the four crowded angles on four different radii instead.
// How much room the scene pills and song actions are taking at the bottom of
// this altitude. Measured, not guessed at as a percentage: it is four buttons
// and four pills, and how many rows those become depends entirely on how wide
// the screen is. Observed rather than read per frame, because reading
// offsetHeight inside the render loop forces a layout every single frame.
let consBot = 90;
if (window.ResizeObserver) {
  new ResizeObserver(() => { consBot = $('#consbot').offsetHeight || 90; })
    .observe($('#consbot'));
}

function colLayout(cells, W, H) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cx = W / 2;
  // The column stops above the controls instead of running behind them. A
  // playhead you cannot see because a button is sitting on it is not a playhead.
  const padTop = 34 * dpr, padBot = (consBot + 26) * dpr;
  const rowH = (H - padTop - padBot) / STEPS;
  const Rmax = Math.min(W * 0.36, rowH * 3.4);
  // How busy each step is, which is what gives the column its shape.
  const load = [];
  let peak = 1;
  for (let s = 0; s < STEPS; s++) {
    let k = 0;
    for (let i = 0; i < cells.length; i++) if (cells[i].steps[s] > 0) k++;
    load.push(k); if (k > peak) peak = k;
  }
  const nodes = [];
  const rows = [];
  for (let s = 0; s < STEPS; s++) {
    // A shell never collapses to nothing. The funnel is worth seeing, but not at
    // the price of a step you cannot put a hit back into.
    const scale = 0.72 + 0.28 * (load[s] / peak);
    const y0 = padTop + (s + 0.5) * rowH;
    rows.push({ s, y: y0, scale, R: Rmax * scale, load: load[s] });
    for (let i = 0; i < cells.length; i++) {
      const ang = (i / cells.length) * Math.PI * 2;
      const shell = 0.34 + 0.66 * ((i % 4) + 1) / 4;
      const R = Rmax * scale * shell;
      const vel = cells[i].steps[s];
      nodes.push({
        i, s, c: cells[i], vel, ang,
        x: cx + Math.cos(ang) * R,
        y: y0 + Math.sin(ang) * R * 0.26,
        // Depth: the far half of each orbit is drawn first and dimmer, which is
        // the only cue that says "ring" rather than "row of dots".
        depth: Math.sin(ang),
        r: (4.4 + (vel / 127) * 4.6) * dpr,
      });
    }
  }
  return { nodes, rows, cx, rowH, Rmax, dpr, padTop };
}

function drawColumn(cells) {
  const rect = neb.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (neb.width !== (rect.width * dpr | 0)) { neb.width = rect.width * dpr; neb.height = rect.height * dpr; }
  const W = neb.width, H = neb.height;
  nctx.clearRect(0, 0, W, H);
  const L = colLayout(cells, W, H);
  NEB.col = L;

  // The spine. Every orbit is centred on it, so it reads as the thing the whole
  // bar is threaded onto rather than as a decorative line.
  // It ends where the last shell is, not at the bottom of the canvas — running
  // it past the final step drew a line straight down through the buttons.
  const spineEnd = L.rows[L.rows.length - 1].y + L.rowH * 0.5;
  const spine = nctx.createLinearGradient(0, L.padTop, 0, spineEnd);
  spine.addColorStop(0, 'rgba(75,227,200,.02)');
  spine.addColorStop(.5, 'rgba(75,227,200,.16)');
  spine.addColorStop(1, 'rgba(75,227,200,.02)');
  nctx.strokeStyle = spine; nctx.lineWidth = 1.2 * dpr;
  nctx.beginPath(); nctx.moveTo(L.cx, L.padTop); nctx.lineTo(L.cx, spineEnd); nctx.stroke();

  // Shell outlines: the silhouette. Brighter where the bar is busy, so the
  // funnel is legible before you have read a single nucleus.
  // Shown whether or not it is running. Stopped, this is where PLAY will pick
  // up from — a playhead you can move and then not see would be a control with
  // no feedback at all.
  const at = ((eng.step % STEPS) + STEPS) % STEPS;
  L.rows.forEach((row) => {
    const beat = row.s % 4 === 0;
    const lit = row.s === at;
    nctx.beginPath();
    nctx.ellipse(L.cx, row.y, row.R, row.R * 0.26, 0, 0, 7);
    nctx.strokeStyle = lit ? 'rgba(75,227,200,.55)'
      : 'rgba(255,255,255,' + (0.03 + (row.load ? 0.05 : 0) + (beat ? 0.035 : 0)).toFixed(3) + ')';
    nctx.lineWidth = (lit ? 1.8 : 1) * dpr;
    nctx.stroke();
    // Step numbers, on the beats only. Sixteen numbers down the side is a
    // spreadsheet; four is a bar.
    if (beat) {
      nctx.font = (9 * dpr) + 'px Oswald, sans-serif';
      nctx.fillStyle = lit ? 'rgba(75,227,200,.9)' : 'rgba(255,255,255,.26)';
      nctx.textAlign = 'right';
      // Beside the column, not pinned to the far edge of the pane. On a wide
      // screen that put the beat count a foot away from the thing it counts.
      nctx.fillText(String(row.s / 4 + 1),
        Math.max(14 * dpr, L.cx - L.Rmax - 12 * dpr), row.y + 3 * dpr);
    }
  });

  // Strands. One cell's hits joined down the column — this is the part that
  // turns a stack of dots into a rhythm you can read, and the reason a cell
  // keeps the same orbit and angle in every shell.
  const byCell = new Map();
  L.nodes.forEach((n) => {
    if (n.vel <= 0 || n.c.mute) return;
    if (!byCell.has(n.i)) byCell.set(n.i, []);
    byCell.get(n.i).push(n);
  });
  byCell.forEach((list, i) => {
    if (list.length < 2) return;
    nctx.beginPath();
    nctx.moveTo(list[0].x, list[0].y);
    for (let k = 1; k < list.length; k++) nctx.lineTo(list[k].x, list[k].y);
    nctx.strokeStyle = 'hsl(' + cells[i].hue + ' 85% 60% / .22)';
    nctx.lineWidth = 1.1 * dpr;
    nctx.stroke();
  });

  // Nuclei, far side first so the near half overlaps it.
  const live = L.nodes.filter((n) => n.vel > 0).sort((a, b) => a.depth - b.depth);
  live.forEach((n) => {
    const front = 0.55 + 0.45 * ((n.depth + 1) / 2);
    const energy = n.s === at ? (eng.meters[n.i] || 0) : 0;
    const size = n.r * (1 + energy * 0.9);
    const l = 50 + energy * 26;
    const a = (n.c.mute ? 0.22 : 1) * front;
    const col = 'hsl(' + n.c.hue + ' 92% ' + l + '%';
    drawGlow(n.c.hue, n.x, n.y, size * 3, a * 0.6);
    nctx.fillStyle = col + ' / ' + a.toFixed(3) + ')';
    nctx.beginPath(); nctx.arc(n.x, n.y, size, 0, 7); nctx.fill();
  });

  // Name the shell that is sounding. Naming all sixteen at once is noise; the
  // one under the playhead is the one you are listening to.
  if (at >= 0) {
    const names = live.filter((n) => n.s === at && !n.c.mute).map((n) => n.c.name);
    if (names.length) {
      nctx.font = (10 * dpr) + 'px Oswald, sans-serif';
      nctx.fillStyle = 'rgba(75,227,200,.85)';
      nctx.textAlign = 'center';
      nctx.fillText(names.join(' · ').slice(0, 46), L.cx, L.padTop - 12 * dpr);
    }
  }
}

// ---- THE OORT CLOUD -------------------------------------------------------
// The field view draws the other three scenes as rings you can tap, which tells
// you they exist and nothing else. That is the one thing missing from an app
// whose whole argument is that the song should be visible at once: you can see
// how full THIS scene is, and not how full the song is.
//
// So: the song as a sphere. Every scene is a shell, every cell a cluster of
// bodies out on that shell, and the number of bodies in a cluster is the number
// of hits in that cell. The live scene is lit; the others are out there in the
// dark at their own distances, exactly as much material as they actually have.
// One look tells you the second half of the song is empty, which is the single
// most useful thing an arrangement view can tell you.
//
// It turns, because a sphere drawn flat is a disc. Dragging it is also what
// separates clusters that happen to line up from your angle — the same reason
// you turn a physical model in your hand.
const OORT_N = 26;                    // bodies in a full cluster
// Spherical Fibonacci: sixteen directions spaced as evenly as sixteen points on
// a sphere can be. Rings of latitude would bunch at the poles and leave the
// cells there permanently overlapping.
const OORT_DIR = (() => {
  const out = [], g = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < CELLS; i++) {
    const y = 1 - (i / (CELLS - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = g * i;
    out.push([Math.cos(th) * r, y, Math.sin(th) * r]);
  }
  return out;
})();
// Deterministic jitter, so a cluster is the same cloud every time you look at
// it. Bodies that reshuffle each frame are static, not a swarm.
const OORT_JIT = (() => {
  let s = 0x2F6E2B1;
  const out = [];
  for (let i = 0; i < CELLS * OORT_N; i++) {
    s = (s * 1664525 + 1013904223) >>> 0;
    const a = (s >>> 8) / 16777216;
    s = (s * 1664525 + 1013904223) >>> 0;
    const b = (s >>> 8) / 16777216;
    s = (s * 1664525 + 1013904223) >>> 0;
    const c = (s >>> 8) / 16777216;
    out.push([a - 0.5, b - 0.5, c - 0.5]);
  }
  return out;
})();

function oortLayout(W, H) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cx = W / 2, cy = (H - consBot * dpr) / 2 + 8 * dpr;
  const R0 = Math.min(cx, cy) * 0.92;
  const cy_ = Math.cos(NEB.yaw), sy_ = Math.sin(NEB.yaw);
  const cp = Math.cos(NEB.pitch), sp = Math.sin(NEB.pitch);
  // Yaw about the vertical, then pitch about the horizontal. Two rotations is
  // all a hand-turned object needs; a third (roll) has no meaning here and only
  // makes the thing feel like it is tumbling.
  const rot = (v) => {
    const x = v[0] * cy_ + v[2] * sy_;
    const z = -v[0] * sy_ + v[2] * cy_;
    const y = v[1] * cp - z * sp;
    const z2 = v[1] * sp + z * cp;
    return [x, y, z2];
  };
  const shells = [];
  for (let sc = 0; sc < SCENES; sc++) {
    const cells = song.scenes[sc].cells;
    const live = sc === song.scene;
    // The live scene is the inner shell. Distance reads as "further away", and
    // what you are playing is the thing you are standing in.
    const R = R0 * (0.46 + sc * 0.175);
    const nodes = [];
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      const hits = c.steps.reduce((a, v) => a + (v ? 1 : 0), 0);
      const d = OORT_DIR[i];
      const p = rot(d);
      nodes.push({
        sc, i, c, hits, live,
        x: cx + p[0] * R, y: cy + p[1] * R * 0.94, z: p[2],
        dir: d, R,
      });
    }
    shells.push({ sc, R, live, nodes,
      total: cells.reduce((a, c) => a + c.steps.reduce((b, v) => b + (v ? 1 : 0), 0), 0) });
  }
  return { shells, cx, cy, R0, dpr, rot };
}

function drawOort() {
  const rect = neb.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (neb.width !== (rect.width * dpr | 0)) { neb.width = rect.width * dpr; neb.height = rect.height * dpr; }
  const W = neb.width, H = neb.height;
  nctx.clearRect(0, 0, W, H);
  const L = oortLayout(W, H);
  NEB.oort = L;

  // The star field first, so everything else is in front of it.
  drawStars(W, H, 0.5);

  // The core: what is actually sounding, right now, at the centre of it all.
  let heat = 0;
  for (let i = 0; i < CELLS; i++) heat = Math.max(heat, eng.meters[i] || 0);
  const core = (5 + heat * 16) * dpr;
  const cg = nctx.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, core * 6);
  cg.addColorStop(0, 'rgba(220,255,250,' + (0.5 + heat * 0.5).toFixed(2) + ')');
  cg.addColorStop(0.35, 'rgba(75,227,200,' + (0.22 + heat * 0.3).toFixed(2) + ')');
  cg.addColorStop(1, 'rgba(75,227,200,0)');
  nctx.fillStyle = cg;
  nctx.beginPath(); nctx.arc(L.cx, L.cy, core * 6, 0, 7); nctx.fill();

  // Shell outlines, faintest first. They are what makes the distances read as
  // distances rather than as scattered dots.
  for (let s = L.shells.length - 1; s >= 0; s--) {
    const sh = L.shells[s];
    if (sh.live) continue;
    nctx.beginPath();
    nctx.ellipse(L.cx, L.cy, sh.R, sh.R * 0.94, 0, 0, 7);
    nctx.strokeStyle = 'rgba(255,255,255,.05)';
    nctx.lineWidth = dpr;
    nctx.stroke();
  }
  // The live shell gets a WIREFRAME instead of a circle: an equator and two
  // meridians, projected through the same rotation as everything else. A single
  // outline stays a disc no matter how the bodies inside it move, and with
  // nothing on screen that visibly turns, dragging feels like it is sliding
  // dots around rather than rotating an object.
  const liveShell = L.shells.find((s) => s.live);
  if (liveShell) {
    const rings = [
      (a) => [Math.cos(a), 0, Math.sin(a)],
      (a) => [Math.cos(a), Math.sin(a), 0],
      (a) => [0, Math.cos(a), Math.sin(a)],
    ];
    rings.forEach((f, ri) => {
      // Segment by segment, not one path, so the far half can be drawn dimmer
      // than the near half — which is the whole depth cue a wireframe has.
      for (let k = 0; k < 48; k++) {
        const a0 = k / 48 * Math.PI * 2, a1 = (k + 1) / 48 * Math.PI * 2;
        const p0 = L.rot(f(a0)), p1 = L.rot(f(a1));
        const near = (p0[2] + p1[2]) / 2;
        nctx.beginPath();
        nctx.moveTo(L.cx + p0[0] * liveShell.R, L.cy + p0[1] * liveShell.R * 0.94);
        nctx.lineTo(L.cx + p1[0] * liveShell.R, L.cy + p1[1] * liveShell.R * 0.94);
        nctx.strokeStyle = 'rgba(75,227,200,' + (0.05 + 0.19 * ((near + 1) / 2)).toFixed(3) + ')';
        nctx.lineWidth = (ri === 0 ? 1.5 : 1) * dpr;
        nctx.stroke();
      }
    });
  }

  // Every body from every shell, sorted back to front so the near hemisphere
  // occludes the far one. Depth is the only thing making this a sphere.
  const all = [];
  L.shells.forEach((sh) => sh.nodes.forEach((n) => { if (n.hits > 0 || n.live) all.push(n); }));
  all.sort((a, b) => a.z - b.z);

  const t = performance.now() / 1000;
  all.forEach((n) => {
    const front = 0.35 + 0.65 * ((n.z + 1) / 2);
    const energy = n.live ? (eng.meters[n.i] || 0) : 0;
    // A cluster's SIZE is its hit count. Empty cells in the live scene still
    // show a single faint body, so the shape of the shell stays readable and
    // an empty slot is visibly empty rather than absent.
    const count = n.hits ? Math.max(2, Math.round(OORT_N * (n.hits / STEPS))) : 1;
    const spread = (7 + n.hits * 1.5) * dpr * (n.live ? 1.15 : 0.8);
    const base = 'hsl(' + n.c.hue + ' 90% ' + (52 + energy * 28) + '%';
    // The other scenes are DIMMER, not invisible. At 0.42 they disappeared
    // entirely against the void, which defeats the only reason this view
    // exists — you looked at it and saw one scene, the same as everywhere else.
    const dim = n.live ? 1 : 0.68;
    const a = (n.c.mute ? 0.18 : 1) * front * dim;

    // The halo first: one soft glow for the whole cluster, so a busy cell reads
    // as a bright patch of sky from across the room.
    if (n.hits) drawGlow(n.c.hue, n.x, n.y, spread * 2.6, a * 0.5 * (0.35 + n.hits / STEPS));

    nctx.fillStyle = base + ' / ' + a.toFixed(3) + ')';
    for (let k = 0; k < count; k++) {
      const j = OORT_JIT[(n.i * OORT_N + k) % OORT_JIT.length];
      // A very slow drift, per body, so the swarm breathes without anything
      // moving far enough to walk out from under a finger.
      const w = t * 0.12 + k;
      const bx = n.x + (j[0] + Math.sin(w) * 0.06) * spread * 2;
      const by = n.y + (j[1] + Math.cos(w * 0.9) * 0.06) * spread * 2 * 0.8;
      const r = (1.25 + Math.abs(j[2]) * 2.4) * dpr * (0.7 + front * 0.6);
      nctx.beginPath(); nctx.arc(bx, by, r, 0, 7); nctx.fill();
    }

    // Name only the live shell's busy clusters. Sixteen names times four
    // scenes is not a picture of a song, it is a directory listing.
    if (n.live && (n.hits > 2 || energy > 0.15) && n.z > -0.2) {
      nctx.font = (9.5 * dpr) + 'px Oswald, sans-serif';
      nctx.fillStyle = 'hsl(' + n.c.hue + ' 90% 84% / ' + (front * (n.c.mute ? 0.3 : 0.85)).toFixed(2) + ')';
      nctx.textAlign = 'center';
      nctx.fillText(n.c.name, n.x, n.y + spread * 2 + 11 * dpr);
    }
  });

  // How much song is out there, in words, because "the fourth shell looks
  // sparse" is a guess and "SCENE 4 · empty" is not.
  nctx.font = (9.5 * dpr) + 'px Oswald, sans-serif';
  nctx.textAlign = 'left';
  L.shells.forEach((sh, k) => {
    nctx.fillStyle = sh.live ? 'rgba(75,227,200,.9)' : 'rgba(255,255,255,.30)';
    nctx.fillText(song.scenes[sh.sc].name + (sh.total ? ' · ' + sh.total : ' · empty'),
      12 * dpr, (18 + k * 13) * dpr);
  });
}

// Nearest cluster on the front hemisphere. The back half is behind the sphere,
// and letting it win a tap means grabbing something you cannot see.
function oortPick(ev) {
  if (!NEB.oort) return null;
  const rect = neb.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const x = (ev.clientX - rect.left) * dpr, y = (ev.clientY - rect.top) * dpr;
  let best = null, bd = 1e9;
  NEB.oort.shells.forEach((sh) => sh.nodes.forEach((n) => {
    if (n.z < -0.15) return;
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < bd) { bd = d; best = n; }
  }));
  return bd < 30 * dpr ? best : null;
}

// ---- THE NEBULA -----------------------------------------------------------
// The field view, with the gas it has always implied. Every property still
// means what it meant — this is not a skin over a different picture, it is the
// same picture with atmosphere — and the atmosphere carries one thing of its
// own: its COLOUR is the colour of what is actually loud.
//

// The star field is BAKED, not drawn per frame. It never moves — the whole

let starCv = null, starKey = '';

      const s = stars[i];

// The three hues carrying the most weight right now: how much of the pattern a

function loudHues(cells) {
  const w = cells.map((c, i) => ({
    hue: c.hue,
    w: (c.mute ? 0 : 1) * (c.steps.reduce((a, v) => a + (v ? 1 : 0), 0) / STEPS + (eng.meters[i] || 0) * 2.2),
  })).sort((a, b) => b.w - a.w);
  const top = w.filter((x) => x.w > 0).slice(0, 3).map((x) => x.hue);
  // A silent, empty scene still needs a sky. These are the app's own accent
  // and its two neighbours round the wheel — recognisably this app, at rest.
  return top.length ? top : [168, 262, 330];

function drawNebulaView(cells) {
  const rect = neb.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (neb.width !== (rect.width * dpr | 0)) { neb.width = rect.width * dpr; neb.height = rect.height * dpr; }
  const W = neb.width, H = neb.height;
  nctx.clearRect(0, 0, W, H);

  let heat = 0;
  for (let i = 0; i < cells.length; i++) heat = Math.max(heat, eng.meters[i] || 0);
  drawStars(W, H, 1);
  // Shed work when the machine is not keeping up, from measured frame time.
  // A cloud that drifts a little more slowly and is cached a little smaller is
  // not a worse picture in any way anyone would notice; a cloud at six frames a
  // second is a broken app. Two thresholds rather than a continuous curve, so
  // it settles instead of oscillating around a boundary.
  const tight = frameMs > 26;
  fogFor(song.scene * 7919 + 13).draw(nctx, W, H, {
    t: performance.now() / 1000,
    hues: loudHues(cells),
    energy: heat,
    now: performance.now(),
    interval: tight ? 260 : 110,
    // 1 when there is budget, and that is not an oversight. Caching at four
    // fifths and letting the blit stretch it back sounds cheaper — a third
    // fewer pixels to composite — and measured SLOWER, 45fps against 51: a 1:1
    // blit is a straight copy, while any other ratio makes every frame resample
    // again. The saving only pays once the machine is missing frames anyway,
    // which is what the 0.5 is for.
    scale: tight ? 0.5 : 1,
    // Held back from full, because the bodies have to stay the brightest thing
    // on screen. The gas is the room, not the subject.
    alpha: 1,

  // field, so it has to BE the field, not a lookalike with its own hit list.

}

// One table, so adding a view is adding a row rather than another branch in the
// render loop.
const VIEW_DRAW = {
  field: (cells) => drawNebula(cells),
  column: drawColumn,
  oort: () => drawOort(),
  nebula: drawNebulaView,
};

// WHAT THE COLUMN IS FOR, AND WHY IT IS NOT A STEP EDITOR.
// The first version made every cell at every step a tap target. That is 256
// targets in one pane — about 1800 square pixels each on a laptop, which even
// packed perfectly would be a 43px square, and an edge-on ring is nowhere near
// packed perfectly. Measured, the closest pair came out ELEVEN PIXELS apart. A
// surface where the neighbouring thing is eleven pixels away is not a control
// surface, it is a coin toss, and no amount of tuning radii fixes an area
// budget: the pane is only so big and sixteen times sixteen is a lot.
//
// So the column does the two things its geometry IS good at, both with large
// targets, and neither of which the field view can do at all:
//   a nucleus                -> audition that cell and select it; hold to fly in
//   anywhere else in a shell -> put the playhead on that step
// Editing stays where there is room for it — the step grid, one cell at a time.
function colPick(ev) {
  if (!NEB.col) return null;
  const rect = neb.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const x = (ev.clientX - rect.left) * dpr, y = (ev.clientY - rect.top) * dpr;
  let best = null, bd = 1e9;
  for (const n of NEB.col.nodes) {
    // Only nuclei that are actually drawn. An empty orbit is not a target, so
    // it cannot steal a tap from the one thing on screen that is.
    if (n.vel <= 0 || n.c.mute) continue;
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < bd) { bd = d; best = n; }
  }
  return bd < 22 * dpr ? best : null;
}
// Which shell the pointer is in: full width, one row tall. This is the easy
// target, and the nucleus is the precise one sitting inside it.
function colRow(ev) {
  if (!NEB.col) return -1;
  const rect = neb.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const y = (ev.clientY - rect.top) * dpr;
  let best = -1, bd = 1e9;
  for (const r of NEB.col.rows) {
    const d = Math.abs(r.y - y);
    if (d < bd) { bd = d; best = r.s; }
  }
  return bd < NEB.col.rowH ? best : -1;
}

// Pointer work for the constellation. Hit testing is done against the same
// layout the renderer just used, so what you touch is exactly what you saw.
function nebPick(ev) {
  if (!NEB.hit) return null;
  const rect = neb.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const x = (ev.clientX - rect.left) * dpr, y = (ev.clientY - rect.top) * dpr;
  let best = null, bd = 1e9;
  for (const b of NEB.hit) {
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < bd) { bd = d; best = b; }
  }
  // Generous radius: these are finger targets on a phone, not pixels.
  return bd < Math.max(34 * dpr, best ? best.r * dpr * 2.2 : 0) ? best : null;
}
let nebTap = 0, nebLast = 0;

// Putting the playhead somewhere. Scheduled steps are already on their way to
// the audio clock, so this changes where the loop goes next rather than cutting
// what is sounding — moving a playhead should never make a click.
function colSeek(s) {
  if (s < 0 || s === NEB.seek) return;
  NEB.seek = s;
  eng.seek(s);
}
neb.addEventListener('pointerdown', (ev) => {
  if (NEB.mode === 'oort') {
    ev.preventDefault(); capture(neb, ev.pointerId);
    // Every press starts a turn. Whether it was ALSO a tap is decided on
    // release, by whether the sphere actually moved — deciding up front means
    // guessing, and guessing wrong either eats taps or eats drags.
    NEB.drag = { oort: 1, x: ev.clientX, y: ev.clientY, moved: 0, node: oortPick(ev) };
    return;
  }
  if (NEB.mode === 'column') {
    ev.preventDefault(); capture(neb, ev.pointerId);
    const n = colPick(ev);
    if (n) {
      // A nucleus: hear it, select it, and start the timer that flies into it.
      // Same gesture as holding a pad on the deck, on purpose — one thing to
      // learn, true everywhere.
      selectCell(n.i, 'tap');
      eng.resume(); eng.play(n.c.voice, 0, n.vel || 100, n.i);
      NEB.drag = { col: 1, node: n,
        hold: setTimeout(() => {
          NEB.drag && (NEB.drag.flew = 1);
          atlas.setFocus(2, n.i); atlas.goTo(2, n.i);
        }, 380) };
      return;
    }
    NEB.drag = { col: 1, scrub: 1 };

    return;
  }
  const b = nebPick(ev); if (!b) return;
  ev.preventDefault(); capture(neb, ev.pointerId);
  const rect = neb.getBoundingClientRect();
  NEB.drag = { i: b.i, r0: Math.hypot(ev.clientX - rect.left - rect.width / 2,

});
neb.addEventListener('pointermove', (ev) => {
  if (!NEB.drag) return;

    const dx = ev.clientX - NEB.drag.x, dy = ev.clientY - NEB.drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) NEB.drag.moved = 1;
    NEB.yaw += dx * 0.008;
    // Pitch stops just short of the poles. Past ninety degrees the sphere
    // turns inside out and the near hemisphere becomes the far one under your
    // finger, which feels like the model broke.
    NEB.pitch = Math.max(-1.35, Math.min(1.35, NEB.pitch + dy * 0.008));
    NEB.drag.x = ev.clientX; NEB.drag.y = ev.clientY;

  }

  const r = Math.hypot(ev.clientX - rect.left - rect.width / 2, ev.clientY - rect.top - rect.height / 2);
  const d = NEB.drag.r0 - r;                       // inward is positive
  if (Math.abs(d) < 14) return;

  const cur = c.steps.reduce((a, v) => a + (v ? 1 : 0), 0);
  const want = Math.max(0, Math.min(STEPS, Math.round(cur + Math.sign(d))));

    NEB.drag = null;
    if (n) {
      // A cluster out on another shell is another scene. Tapping it goes
      // there — which is the point of being able to see all four at once.
      if (n.sc !== song.scene) { setScene(n.sc); }
      selectCell(n.i, 'tap');
      eng.resume(); eng.play(liveCells(song)[n.i].voice, 0, 112, n.i);
      flash(n.i);
    }

  }

    if (NEB.drag.hold) clearTimeout(NEB.drag.hold);

  }

// Fill toward, or thin away from, a target step count — on the musical grid, so
// dragging inward lands on beats before it lands on offbeats and the pattern
// stays playable at every density rather than turning to mush.
const GRID_ORDER = [0, 8, 4, 12, 2, 6, 10, 14, 1, 3, 5, 7, 9, 11, 13, 15];
function densify(i, want) {
  const c = liveCells(song)[i];
  const on = () => c.steps.reduce((a, v) => a + (v ? 1 : 0), 0);
  while (on() < want) {
    const slot = GRID_ORDER.find((k) => !c.steps[k]);
    if (slot === undefined) break;
    c.steps[slot] = 100;
  }
  while (on() > want) {
    const slot = [...GRID_ORDER].reverse().find((k) => c.steps[k]);
    if (slot === undefined) break;

// GRAIN's full-size scope. Same triggered draw as the strip — it used to plot

// jumped every frame and a perfectly steady note looked like it was thrashing.
let grainScope = null;
function drawScope() {
  const cv = document.getElementById('scope'); if (!cv || !eng.analyser) return;
  if (!grainScope) grainScope = createScope(eng.analyser);
  const i = atlas.focusAt(2) ?? 0;
  const c = liveCells(song)[i];
  grainScope(cv, { hue: c ? c.hue : 168 });
}

// ---- THE CONSOLE MOVES -----------------------------------------------------
// A floating overlay is always in the wrong place for someone: it lands on the
// bottom row of pads on a short screen, over the constellation up at altitude
// 0, and under your palm if you play left-handed. Rather than guess a position
// that works for everybody, let it be dragged and remember where it was left.
//
// It is dragged by a GRIP, not by the pill itself. Dragging off the body would
// mean every slightly-off press of PLAY moves the console instead of starting
// the song, and on a phone almost every press is slightly off.
const cons = $('#console'), grip = $('#grip');
const CONSOLE_POS = 'skrimpad_ultimate_console';
let cpos = null;                       // null = the default, centred at the bottom

function placeConsole() {
  const r = cons.getBoundingClientRect();
  const w = r.width || 320, h = r.height || 80;
  // Reserve room only while it is docked. Measured from the console itself
  // rather than hard-coded, so it stays correct as the monitor's fluid height
  // changes with the viewport.
  document.documentElement.style.setProperty('--dock', cpos ? '0px' : Math.round(h + 16) + 'px');
  if (!cpos) {
    // The default is expressed in CSS, not in numbers here, so the resting
    // position still respects the safe-area insets on a notched phone.
    cons.style.left = '50%'; cons.style.top = 'auto';
    cons.style.bottom = 'max(12px, env(safe-area-inset-bottom))';
    cons.style.transform = 'translateX(-50%)';
    return;
  }
  // Clamp on every placement, not just on drag. A phone rotating from landscape
  // to portrait would otherwise strand the console off-screen with no way to
  // reach it — the one bug that makes a movable panel worse than a fixed one.
  const x = Math.max(6, Math.min(window.innerWidth - w - 6, cpos.x));
  const y = Math.max(6, Math.min(window.innerHeight - h - 6, cpos.y));
  cons.style.left = x + 'px'; cons.style.top = y + 'px';
  cons.style.bottom = 'auto'; cons.style.transform = 'none';
}
try {
  const raw = JSON.parse(localStorage.getItem(CONSOLE_POS) || 'null');
  // Shape-checked, like every other read: a stored "null" parses fine and then
  // throws on the first property access.
  if (raw && typeof raw === 'object' && Number.isFinite(+raw.x) && Number.isFinite(+raw.y)) {
    cpos = { x: +raw.x, y: +raw.y };
  }
} catch (e) {}
placeConsole();
addEventListener('resize', placeConsole);
// --dock is measured FROM the console, so it is only correct once the console
// has actually been laid out. Calling placeConsole once at boot read a fallback
// height, reserved too little room, and let the bottom row of pads slide under
// the pill — intermittently, depending on how far the size transition had got
// when anything happened to look. A ResizeObserver ties the reservation to the
// real height for good, which also covers the readout row appearing and
// disappearing as a controller is played, and fonts arriving late.
if (window.ResizeObserver) new ResizeObserver(() => placeConsole()).observe(cons);

let drag = null;
grip.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const r = cons.getBoundingClientRect();
  drag = { dx: e.clientX - r.left, dy: e.clientY - r.top, moved: false };
  capture(grip, e.pointerId);
  cons.classList.add('dragging');
});
grip.addEventListener('pointermove', (e) => {
  if (!drag) return;
  drag.moved = true;
  cpos = { x: e.clientX - drag.dx, y: e.clientY - drag.dy };
  placeConsole();
});
function endDrag() {
  if (!drag) return;
  if (drag.moved && cpos) {
    // Store the CLAMPED position, not the raw pointer maths, so a drag that
    // ended past the edge does not come back next session still past it.
    const r = cons.getBoundingClientRect();
    cpos = { x: r.left, y: r.top };
    try { localStorage.setItem(CONSOLE_POS, JSON.stringify(cpos)); } catch (e) {}
  }
  drag = null; cons.classList.remove('dragging');
}
grip.addEventListener('pointerup', endDrag);
grip.addEventListener('pointercancel', endDrag);
// Double-tap the grip to put it back. A movable thing needs a way home, or the
// first person to fling it into a corner has broken their own app.
grip.addEventListener('dblclick', () => {
  cpos = null;
  try { localStorage.removeItem(CONSOLE_POS); } catch (e) {}
  placeConsole();
});

// ---- TRANSPORT -------------------------------------------------------------
const playBtn = $('#play');
playBtn.addEventListener('click', () => {
  eng.resume();
  if (eng.playing) { eng.stop(); playBtn.classList.remove('on'); clearPlayhead(); }
  else {
    eng.start(song, (s, at) => {
      recStep = s; recAt = at;
      // QUEUED, not painted. `at` is the audio time this step will sound at,
      // and the scheduler commits up to 600ms ahead when the machine is
      // struggling — so painting on the next animation frame would put the
      // playhead as much as five steps in front of what you can hear. The
      // render loop drains this against the audio clock instead, which means
      // the light and the sound arrive together no matter how far ahead the
      // notes were committed.
      stepQ.push(s, at);
      if (stepQ.length > 64) stepQ.splice(0, stepQ.length - 64);
    });
    playBtn.classList.add('on');
  }
});
// PANIC stopped the SEQUENCER and nothing else. A note a controller is holding
// — or one held by a stuck sustain pedal, which is the actual reason anyone
// reaches for this button — kept sounding through it. A silence button that
// leaves the loudest thing on screen ringing is worse than no button, because
// you stop looking for the real cause.
$('#panic').addEventListener('click', () => {
  eng.stop();
  clearPlayhead();
  keys.panic();
  // Anything held by a finger on the drawn keyboard goes too.
  touched.forEach((t) => t.h.off());
  touched.clear();
  playBtn.classList.remove('on');
  if (midiOpen) paintKeys();
});
$('#swing').addEventListener('input', (e) => {
  // Stored 0..0.6, shown 0..60%. The engine clamps to the same ceiling: past
  // about 60% the offbeat lands on the following downbeat and the groove
  // collapses rather than deepening.
  song.swing = Math.max(0, Math.min(60, +e.target.value || 0)) / 100;
  saveSong(song);
});
$('#bpm').addEventListener('input', (e) => {
  const v = Math.max(20, Math.min(300, +e.target.value || 100));
  song.bpm = v; saveSong(song);
});
// ---- RECORD ----------------------------------------------------------------
// This button used to toggle a CSS class and nothing else: it lit up, felt like
// it had done something, and had done nothing at all. A control that lies about
// having worked is worse than no control, because there is no way to tell it
// apart from a feature that is simply broken.
//
// What it does now is the missing half of the sequencer. Until this, the only
// way to build a pattern was to fly down to CELL and tap sixteen little boxes.
// With RECORD armed you play the pads while it runs and the hits land in the
// grid — which is how every drum machine ever made works, and is the version a
// person with no experience will reach for first.
let recording = false;
let recStep = 0, recAt = 0;                 // the last step the engine committed
// Committed steps waiting for the audio clock to reach them, as flat (step,
// time) pairs. Drained in the render loop.
const stepQ = [];
let shownStep = -1;

// Painting the playhead used to run on every step at every altitude: two
// querySelectorAll sweeps over a deck of 272 elements plus a document-wide one,
// nine times a second, including while looking at the constellation where none
// of those elements are on screen. Now it only touches what is actually
// visible, and only when the step it would draw has changed.
// Stopping drops both the pending steps and the lit segment. Leaving a step
// queued means the playhead jumps to a stale position the moment play resumes.
function clearPlayhead() {
  stepQ.length = 0;
  if (shownStep >= 0) {
    ribbonSegs.forEach((segs) => { if (segs && segs[shownStep]) segs[shownStep].classList.remove('at'); });
    const host = $('#steps');
    if (host && host.children[shownStep]) host.children[shownStep].classList.remove('at');
  }
  shownStep = -1;
}
function paintPlayhead(s) {
  const lvl = atlas.level;
  if (lvl <= 1) {
    for (let i = 0; i < ribbonSegs.length; i++) {
      const segs = ribbonSegs[i]; if (!segs) continue;
      if (shownStep >= 0 && segs[shownStep]) segs[shownStep].classList.remove('at');
      if (segs[s]) segs[s].classList.add('at');
    }
  }
  if (lvl === 2) {
    const host = $('#steps');
    if (host) {
      if (shownStep >= 0 && host.children[shownStep]) host.children[shownStep].classList.remove('at');
      if (host.children[s]) host.children[s].classList.add('at');

$('#rec').addEventListener('click', (e) => {
  recording = !recording;
  e.currentTarget.classList.toggle('on', recording);
  e.currentTarget.setAttribute('aria-pressed', recording ? 'true' : 'false');
  toast(recording
    ? (eng.playing ? 'recording — play the pads' : 'armed — press play')
    : 'recording off');
});

// Which step is a hit happening RIGHT NOW closest to?
//
// onStep hands over the exact audio time each step will sound, and the scheduler
// runs up to 120ms ahead — so recAt is usually in the future, not the past.
// Rounding the offset rather than flooring it is what makes this quantise to the
// NEAREST sixteenth: a hit a hair early belongs to the beat it was aiming at,
// not to the one before it, and every drummer plays a hair early.
function stepNow() {
  const ctx = eng.ctx;
  if (!ctx) return recStep;
  const spb = 60 / Math.max(20, song.bpm) / 4;
  const off = Math.round((ctx.currentTime - recAt) / spb);
  return (((recStep + off) % STEPS) + STEPS) % STEPS;
}

// Write a hit into the pattern. Velocity is kept, so playing softly records
// softly — the grid stores 1..127, and it always did; nothing else was using it.
function recordHit(i, vel) {
  if (!recording || !eng.playing) return;
  const c = liveCells(song)[i]; if (!c) return;
  c.steps[stepNow()] = Math.max(1, Math.min(127, vel | 0));
  syncRibbon(i);
  saveSong(song);
  if (atlas.level === 2 && atlas.focusAt(2) === i) invalidateSheets();
}
// One button that always gives you something to react to. A blank grid is the
// hardest thing to start from; this guarantees you never face one.
$('#dice').addEventListener('click', () => {
  const cells = liveCells(song);
  cells.forEach((c, i) => {
    const dens = i < 4 ? [0.25, 0.12, 0.5, 0.12][i] : (Math.random() < 0.45 ? 0.18 : 0);
    for (let s = 0; s < STEPS; s++) c.steps[s] = Math.random() < dens ? 90 + (Math.random() * 30 | 0) : 0;
    syncRibbon(i);
  });
  hist.push(song); saveSong(song);
  if (atlas.level === 2) drawCellSheet();
});

// ---- MIDI ------------------------------------------------------------------
// The hardened stack from LIVEx: it waits for the Android bridge, keeps sweeping
// on a backoff while nothing is attached, and re-scans the instant the app comes
// back to the foreground — which is exactly when someone returns from pairing.
// THE KEY SYSTEM IS INVISIBLE ON PURPOSE. There is no on-screen keyboard, no
// MIDI-learn dialog and no routing page, because the controller already has
// keys, wheels, a pressure sensor and a pedal, and the person holding it
// already knows how those feel. The instrument does the playing and all of the
// modulation; this app's only job is to be the voice at the end of the wire.
// Everything the hardware sends is honoured — see core/keys.js for the routing
// and, more importantly, for why none of it is configurable.
// ---- HARDWARE TRANSPORT ----------------------------------------------------
// PLAY, STOP and RECORD on a controller already work when the board speaks one
// of the two standards: MIDI realtime (start/continue/stop) or MMC over SysEx,
// which between them cover most of what has a transport section. Plenty of
// boards send neither. They send a CC, or a note from a pad, or a program
// change, and there is no table anywhere that says which — the same button on
// two units from the same maker can differ.
//
// So it is LEARNED, which is the only honest answer: press the app's button,
// then press the one on the controller, and whatever arrives is what that
// button is. Three bindings, remembered per install. Nothing to look up, and
// it works on hardware nobody has ever tested against.
// ---- DRUM PAD MAPPING ------------------------------------------------------
// Pads were hard-wired to (note - 36) % 16, which is the General MIDI drum
// window and is right for a good number of boards and wrong for all the rest.
// An MPD starts at 36 on bank A and somewhere else on B, C and D; a nanoPAD
// starts wherever its scene file says; a keyboard's pad strip often sits up
// where nothing expects it. There was no way to correct any of that.
//
// So the map is LEARNED, and learned the fast way: arm it, then hit your pads
// in the order you want them, and each one takes the next cell. Sixteen taps
// and the whole board is mapped — rather than sixteen separate bindings each
// needing a target picked first.
//
// While mapping, ANY note counts as a pad. That matters on a combined board
// where the pads share a channel with the keys and cannot be told apart by the
// usual rules: during a mapping sweep, whatever you hit is by definition a pad.
const PADMAP_KEY = 'skrimpad_ultimate_padmap';
let padMap = {};
try {
  const raw = JSON.parse(localStorage.getItem(PADMAP_KEY) || 'null');
  if (raw && typeof raw === 'object' && !Array.isArray(raw)) padMap = raw;
} catch (e) {}
let padLearn = null;                 // index of the next cell to bind, or null

function padCell(note) {
  const m = padMap[note];
  if (m != null) return m;
  // The General MIDI drum window, as the fallback it always was.
  return (((note - 36) % CELLS) + CELLS) % CELLS;
}
function padLearnHit(note) {
  // Re-hitting a pad already bound moves it rather than leaving it in two
  // places, which is what makes a mis-tap recoverable without starting over.
  for (const k of Object.keys(padMap)) if (padMap[k] === padLearn) delete padMap[k];
  padMap[note] = padLearn;
  padLearn++;
  if (padLearn >= CELLS) padLearn = null;
  try { localStorage.setItem(PADMAP_KEY, JSON.stringify(padMap)); } catch (e) {}
  renderPadMap();
  if (padLearn == null) toast('all ' + CELLS + ' pads mapped');
}

const TRANSPORT_KEY = 'skrimpad_ultimate_transport';
let bindings = {};
try {
  const raw = JSON.parse(localStorage.getItem(TRANSPORT_KEY) || 'null');
  if (raw && typeof raw === 'object' && !Array.isArray(raw)) bindings = raw;
} catch (e) {}
let learning = null;

// What identifies a message, for binding purposes: its kind and its first data
// byte. NOT the second — that is the value, and a button sends 127 when pressed
// and 0 when released, so keying on it would bind the press and miss the
// release, or bind one and fire on both.
function sigOf(e) {
  const cmd = e.cmd;
  if (cmd === 0xb0) return 'cc:' + e.d1;
  if (cmd === 0x90 || cmd === 0x80) return 'note:' + e.d1;
  if (cmd === 0xc0) return 'pgm:' + e.d1;
  return null;
}
// A press, not a release. Without this a CC button fires twice — once on the
// way down and once on the way up — which on PLAY means starting and instantly
// stopping.
function isPress(e) {
  if (e.cmd === 0xb0) return e.d2 >= 64;
  if (e.cmd === 0x90) return e.d2 > 0;
  if (e.cmd === 0x80) return false;
  return true;
}
function matchTransport(e) {
  const sig = sigOf(e);
  if (!sig) return null;
  for (const act of ['play', 'stop', 'rec']) if (bindings[act] === sig) return isPress(e) ? act : 'ignore';
  return null;
}
function fireTransport(act) {
  if (act === 'ignore') return;
  if (act === 'play' && !eng.playing) playBtn.click();
  else if (act === 'stop' && eng.playing) playBtn.click();
  else if (act === 'rec') $('#rec').click();
}
function bindTransport(e) {
  const sig = sigOf(e);
  if (!sig || !isPress(e)) return;
  // A signature can only mean one thing. Binding STOP to something already
  // bound to PLAY has to take it away from PLAY, or one button does both.
  for (const act of Object.keys(bindings)) if (bindings[act] === sig) delete bindings[act];
  bindings[learning] = sig;
  try { localStorage.setItem(TRANSPORT_KEY, JSON.stringify(bindings)); } catch (err) {}
  const was = learning;
  learning = null;
  renderTransportLearn();
  toast(was.toUpperCase() + ' \u2190 ' + sig);
}

// Declared up here, not down with the window that uses them: keepLooking()
// reports ports SYNCHRONOUSLY on its first sweep, which happens while this
// module is still evaluating. A `let` declared after that point is in its
// temporal dead zone when the callback reads it, and the app dies at boot with
// nothing on screen. Order of declaration is load-bearing here.
let midiOpen = false, lastPorts = [], lastMsg = '';

const keys = createKeys({
  engine: eng,
  // Keys sound the cell you are looking at. There is no separate "instrument"
  // to select, because you already selected one by flying to it — the thing
  // under your attention is the thing under your hands.
  // WHICH SOUND THE KEYS PLAY.
  //
  // One selection, changed four ways, no modes: fly to a pad, hit a pad on the
  // controller, turn the controller's preset knob, or tap a chip in the MIDI
  // window. They all set the same thing, so there is never a question of which
  // one is winning — and nothing has to be put into an "assign" state first.
  //
  // Flying still selects, so the old behaviour is intact for anyone who never
  // touches the hardware; it is simply no longer the ONLY way, which is what
  // made the keyboard feel like it was playing something you did not choose.
  voiceFor: () => {
    const c = liveCells(song)[keyCell] || liveCells(song)[0];
    return c && c.voice;
  },
  // A hardware pad fires its cell AND selects it. That is the "store a voice on
  // a pad and change to it" workflow on any board with pads and keys: hit the
  // pad to pick the sound, then play it on the keys.
  onPad: (note, vel) => {
    const idx = padCell(note);
    eng.resume(); eng.play(liveCells(song)[idx].voice, 0, vel, idx);
    recordHit(idx, vel);
    flash(idx);
    selectCell(idx, 'pad');
  },
  // The preset / mode knob. Wrapped into range rather than clamped, so a knob
  // that sweeps 0..127 walks the pads round and round instead of sticking at
  // the last one for most of its travel.
  onPick: (n) => selectCell(((n % CELLS) + CELLS) % CELLS, 'knob'),
  // The key display lights from the instrument's own note events rather than
  // from a poll, so a key is lit within the same frame the hardware sent it.
  onNote: (n, on) => { if (midiOpen) lightKey(n, on); },
});

// The hardened stack from LIVEx: it waits for the Android bridge, keeps sweeping
// on a backoff while nothing is attached, and re-scans the instant the app comes
// back to the foreground — which is exactly when someone returns from pairing.
const io = createMidiIO({
  // This callback is named onEvent, not onMessage. It was wired as onMessage,
  // which the module never calls — so every byte of MIDI arriving in this
  // edition was being dropped on the floor, silently, with a fully working
  // transport underneath it.
  onEvent: (e) => {
    if (e.transport) { fireTransport(e.transport); return; }
    noteLastMessage(e);
    // A LEARNED transport binding wins over everything, including being read as
    // a note. That is the point: if you told the app this button is STOP, it is
    // STOP, even though it is physically a pad sending note 44.
    if (learning) { bindTransport(e); return; }
    // A mapping sweep takes note-ons before anything else looks at them, so a
    // board whose pads share a channel with its keys can still be mapped.
    if (padLearn != null && e.cmd === 0x90 && e.d2 > 0) { padLearnHit(e.d1); return; }
    if (padLearn != null && (e.cmd === 0x80 || e.cmd === 0x90)) return;
    const act = matchTransport(e);
    if (act) { fireTransport(act); return; }
    keys.handle(e.raw, (e.port && e.port.name) || '');
  },
  onPorts: (ports) => {
    const s = $('#status');
    lastPorts = ports || [];
    if (midiOpen) { renderPorts(); renderWhyNot(); }
    if (!ports || !ports.length) {
      s.innerHTML = 'no controller yet<br>usb: plug in · bluetooth: pair in settings';
      return;
    }
    // Say what it decided the controller IS. That one word is the only piece of
    // the key system that ever appears on screen, and it is there so a wrong
    // guess is visible rather than mysterious.
    const names = ports.map((p) => p.name).join(', ');
    const n0 = ports[0] && ports[0].name;
    const r = keys.decided(n0) ? keys.roleOf(n0) : null;
    s.innerHTML = '<b>' + esc(names.slice(0, 40)) + '</b><br>' +
      (r === 'pads' ? 'pads — hit them' : r === 'keys' ? 'keys — play it' : 'connected — play it');
  },
});
io.start().catch(() => {});
io.keepLooking();
// REOPEN WHAT IS ALREADY PAIRED. autoReconnect() has existed in the MIDI stack
// since it was ported and NOTHING HAS EVER CALLED IT — so on desktop a
// controller you paired last week was never picked up again, and the only way
// back was pressing CONNECT BLUETOOTH every single session. That is most of
// what "the Bluetooth connection is not working" actually is.
//
// It is silent by design: no chooser, no prompt. It can only reopen devices
// this app was already granted, so there is nothing here for a user to approve
// a second time.
io.autoReconnect({ onStatus: (st) => { if (st && st.connected) io.rescan(); } }).catch(() => {});
// Losing the page mid-chord must not leave a note ringing forever.
window.addEventListener('blur', () => keys.panic());
document.addEventListener('visibilitychange', () => { if (document.hidden) keys.panic(); });

// ---- WINDOWS ---------------------------------------------------------------
// Two surfaces in this app are not part of the music: the MIDI connection and
// the manual. Both are things you open, read, and close, so neither belongs at
// an altitude — flying to a depth to read documentation would be absurd. They
// are the only modal things here and they behave like it: a scrim, escape,
// click-outside, and focus that goes back where it came from.
let openWin = null, winOpener = null;
function showWin(el) {
  if (openWin === el) return;
  if (openWin) openWin.classList.remove('open');
  winOpener = document.activeElement;
  openWin = el;
  // One flag, set in one place, from the thing that is actually true — which
  // window is open. Two call sites each remembering to clear it is how a
  // display keeps repainting for a panel nobody can see.
  midiOpen = el === $('#midiwin');
  el.classList.add('open');
  $('#scrim').classList.add('open');
  // Focus INTO the window, or the keyboard is still out on the page behind a
  // scrim it cannot see through — a dialog you can open and not reach.
  const first = el.querySelector('button, [href], input, select');
  if (first) first.focus();
}
function closeWin() {
  if (!openWin) return;
  openWin.classList.remove('open');
  if (openWin === $('#midiwin')) { midiOpen = false; learning = null; padLearn = null; }
  openWin = null;
  $('#scrim').classList.remove('open');
  // Put the keyboard back where it was. Dropping focus to <body> is how a
  // keyboard user loses their place every time they check something.
  if (winOpener && winOpener.isConnected) winOpener.focus();
  winOpener = null;
}
$('#scrim').addEventListener('click', closeWin);
$('#midix').addEventListener('click', closeWin);
$('#helpx').addEventListener('click', closeWin);

// ---- THE MIDI WINDOW -------------------------------------------------------
// The key system stays invisible while it is working — see core/keys.js. This
// window is for when it is NOT working, which is the only time anyone wants a
// MIDI page. It answers, in order, the three questions a silent controller
// raises: is it there, is it sending, and did the app understand what it is.
//
// The keyboard drawn here is a DISPLAY first. It shows the hardware playing so
// you can see the app hearing you. It is also touchable, because on a laptop
// with nothing plugged in it is the only way to hear what a cell sounds like
// across a range — and that is auditioning, not a configuration surface.
const KEY_LO = 36, KEY_HI = 84;                 // C2..C6 — pads live at 36..63
const BLACK = new Set([1, 3, 6, 8, 10]);
const keybed = $('#keybed');
const keyEls = new Map();
const touched = new Map();                      // pointerId -> {note, handle}

function buildKeybed() {
  if (keyEls.size) return;
  let whites = 0;
  for (let n = KEY_LO; n <= KEY_HI; n++) if (!BLACK.has(n % 12)) whites++;
  const ww = 100 / whites, bw = ww * 0.62;
  let w = 0, html = '';
  for (let n = KEY_LO; n <= KEY_HI; n++) {
    const black = BLACK.has(n % 12);
    if (black) {
      // A black key sits BETWEEN two whites, so its left edge is half its own
      // width back from the boundary — not at a slot of its own. Laying them
      // out on an even 12-per-octave grid is what makes a drawn keyboard look
      // subtly wrong in a way people notice without being able to name.
      html += '<div class="kk" data-n="' + n + '" style="left:' + (w * ww - bw / 2) + '%;width:' + bw + '%"></div>';
    } else {
      html += '<div class="kw" data-n="' + n + '" style="left:' + (w * ww) + '%;width:' + ww + '%">' +
        (n % 12 === 0 ? '<b>C' + (Math.floor(n / 12) - 1) + '</b>' : '') + '</div>';
      w++;
    }
  }
  keybed.innerHTML = html;
  keybed.querySelectorAll('[data-n]').forEach((e) => keyEls.set(+e.dataset.n, e));
}

function lightKey(note, on) {
  const e = keyEls.get(note);
  if (e) e.classList.toggle('on', !!on);
}
// Repaint from the instrument's own state rather than from a tally of events.
// A missed note-off would otherwise leave a key stuck lit forever.
function paintKeys() {
  const down = new Set(keys.notesDown());
  keyEls.forEach((e, n) => e.classList.toggle('on', down.has(n)));
}

// Which cell the keys will sound, and in what colour. Stated in the window
// because "my keyboard plays the wrong sound" is really "I did not know it
// follows what I am looking at".
function syncMidiCell() {
  const c = liveCells(song)[keyCell] || liveCells(song)[0];
  if (!c) return;
  keybed.style.setProperty('--h', c.hue);
  $('#midicell').textContent = c.name;
}

// The sixteen pads as chips, so the keyboard's voice can be set with a tap when
// there is no controller in reach — and so that whatever the hardware just
// picked is VISIBLE. A selection you cannot see is one you cannot trust.
function buildVoicePick() {
  const host = $('#voicepick');
  if (host.children.length === CELLS) return;
  host.innerHTML = liveCells(song).map((c, i) =>
    '<button class="vchip" data-v="' + i + '" style="--h:' + c.hue + '">' + esc(c.name) + '</button>').join('');
}
function syncVoicePick() {
  const host = $('#voicepick');
  if (!host) return;
  const cells = liveCells(song);
  for (let i = 0; i < host.children.length; i++) {
    const b = host.children[i];
    b.classList.toggle('on', i === keyCell);
    b.setAttribute('aria-pressed', i === keyCell ? 'true' : 'false');
    if (cells[i]) { b.textContent = cells[i].name; b.style.setProperty('--h', cells[i].hue); }
  }
  if (midiOpen) syncMidiCell();
}
$('#voicepick').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-v]');
  if (b) selectCell(+b.dataset.v, 'chip');
});

const EXPR = [
  ['BEND', (l) => Math.min(1, Math.abs(l.bend) / 12), (l) => (l.bend >= 0 ? '+' : '') + l.bend.toFixed(2) + 'st'],
  ['MOD', (l) => l.mod, (l) => Math.round(l.mod * 127)],
  ['PRESS', (l) => l.press, (l) => Math.round(l.press * 127)],
  ['TIMBRE', (l) => l.timbre, (l) => Math.round(l.timbre * 127)],
];
function buildExprs() {
  if ($('#exprs').children.length) return;
  $('#exprs').innerHTML = EXPR.map(([name]) =>
    '<div class="ex" data-x="' + name + '"><span class="exl">' + name + '</span>' +
    '<span class="exb"><i></i></span><span class="exv">0</span></div>').join('');
}
function paintExprs() {
  const l = keys.live;
  EXPR.forEach(([name, frac, text]) => {
    const row = $('#exprs [data-x="' + name + '"]');
    if (!row) return;
    row.querySelector('i').style.width = Math.max(0, Math.min(1, frac(l))) * 100 + '%';
    row.querySelector('.exv').textContent = text(l);
  });
}

// The last thing that came down the wire, in words. A hex dump would be more
// honest and less useful — the question being asked is "did my wheel move",
// and "MOD WHEEL 64" answers it while "B0 01 40" makes you look it up.
const CC_NAMES = { 1: 'MOD WHEEL', 2: 'BREATH', 7: 'VOLUME', 11: 'EXPRESSION',
  64: 'SUSTAIN', 74: 'TIMBRE', 120: 'ALL SOUND OFF', 121: 'RESET', 123: 'ALL NOTES OFF' };
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
function noteName(n) { return NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1); }
function noteLastMessage(e) {
  const cmd = e.cmd, d1 = e.d1, d2 = e.d2;
  let txt;
  if (e.transport) txt = 'TRANSPORT ' + e.transport.toUpperCase();
  else if (cmd === 0x90 && d2 > 0) txt = 'NOTE ON ' + noteName(d1) + ' vel ' + d2;
  else if (cmd === 0x80 || cmd === 0x90) txt = 'NOTE OFF ' + noteName(d1);
  else if (cmd === 0xb0) txt = (CC_NAMES[d1] || 'CC ' + d1) + ' ' + d2;
  else if (cmd === 0xe0) txt = 'PITCH BEND ' + (((d2 << 7) | d1) - 8192);
  else if (cmd === 0xd0) txt = 'PRESSURE ' + d1;
  else if (cmd === 0xa0) txt = 'PRESSURE ' + noteName(d1) + ' ' + d2;
  else txt = 'CH ' + ((e.chan || 0) + 1) + ' ' + cmd.toString(16);
  lastMsg = '<b>' + esc(txt) + '</b> · ch ' + ((e.chan || 0) + 1) +
    ((e.port && e.port.name) ? ' · ' + esc(String(e.port.name).slice(0, 22)) : '');
  if (midiOpen) $('#lastmsg').innerHTML = lastMsg;
}

// Three rows: what each of the app's transport actions is bound to, and a
// button to (re)learn it. A row that says "standard" is one the app already
// understands without being told — realtime or MMC — so most controllers show
// nothing to do here, which is the point.
function renderPadMap() {
  const host = $('#padmap');
  if (!host) return;
  const bound = Object.keys(padMap).length;
  const cells = liveCells(song);
  let msg;
  if (padLearn != null) {
    const c = cells[padLearn];
    msg = '<b>Hit the pad you want for ' + esc(c ? c.name : ('pad ' + (padLearn + 1))) + '</b>' +
      ' \u00b7 ' + (padLearn + 1) + ' of ' + CELLS;
  } else if (bound) {
    msg = bound + ' pad' + (bound === 1 ? '' : 's') + ' mapped.';
  } else {
    msg = 'Using the standard drum notes (36 up). If your pads land on the wrong ' +
      'sounds, map them \u2014 hit each pad in the order you want them.';
  }
  host.innerHTML = '<div class="none">' + msg + '</div>' +
    '<div class="port"><span class="pn">PAD LAYOUT</span>' +
      '<button class="pb" id="padlearn">' + (padLearn != null ? 'CANCEL' : 'MAP PADS') + '</button>' +
      (bound ? '<button class="pb" id="padclear">RESET</button>' : '') +
    '</div>';
}
// Forcing another look. Windows publishes a Bluetooth MIDI port whenever it
// feels like it, and a controller switched on after the app has started is a
// completely ordinary thing to do — there should be a way to say "try now"
// that is not "restart the application".
$('#whynot').addEventListener('click', (ev) => {
  if (!ev.target.closest('#rescan')) return;
  io.rescan();
  io.autoReconnect({ onStatus: () => {} }).catch(() => {});
  setTimeout(() => { renderPorts(); renderWhyNot(); }, 400);
  toast('looking for controllers');
});

$('#padmap').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'padlearn') {
    padLearn = padLearn == null ? 0 : null;
    if (padLearn === 0) toast('hit your pads in order');
  } else if (b.id === 'padclear') {
    padMap = {}; padLearn = null;
    try { localStorage.removeItem(PADMAP_KEY); } catch (e) {}
    toast('pad layout reset');
  }
  renderPadMap();
});

function renderTransportLearn() {
  const host = $('#tlearn');
  if (!host) return;
  host.innerHTML = ['play', 'stop', 'rec'].map((act) => {
    const bound = bindings[act];
    const armed = learning === act;
    return '<div class="port">' +
      '<span class="pn">' + act.toUpperCase() + '</span>' +
      '<span class="pr' + (bound ? ' keys' : '') + '">' +
        (armed ? 'PRESS IT NOW' : bound ? esc(bound) : 'standard') + '</span>' +
      '<button class="pb" data-learn="' + act + '">' + (armed ? 'CANCEL' : 'LEARN') + '</button>' +
      (bound ? '<button class="pb" data-forget="' + act + '">CLEAR</button>' : '') +
      '</div>';
  }).join('');
}
$('#tlearn').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.learn) {
    learning = learning === b.dataset.learn ? null : b.dataset.learn;
    if (learning) toast('press ' + learning.toUpperCase() + ' on the controller');
  } else if (b.dataset.forget) {
    delete bindings[b.dataset.forget];
    try { localStorage.setItem(TRANSPORT_KEY, JSON.stringify(bindings)); } catch (e) {}
  }
  renderTransportLearn();
});

// WHY IT IS NOT WORKING, in a sentence, from what the MIDI stack actually
// knows. Each branch is a different thing to go and do — which is the whole
// reason for having it, because "no controller yet" covered all of them.
function renderWhyNot() {
  const host = $('#whynot');
  if (!host) return;
  const d = io.diagnostics();
  const lines = [];
  if (d.mode === 'unsupported') {
    lines.push('<b>This build has no MIDI support at all.</b> Nothing plugged in can be seen. ' +
      'If this is the desktop app, it is a build problem rather than anything you have done.');
  } else if (d.mode === 'denied') {
    lines.push('<b>MIDI access was refused.</b> ' + esc(d.err));
  } else if (!d.inputs) {
    lines.push('<b>No MIDI port is visible.</b> On Windows a Bluetooth controller only appears ' +
      'once its vendor panel (the KORG BLE-MIDI panel, for instance) has actually CONNECTED it — ' +
      'pairing it in Windows settings is not enough on its own.');
  } else if (!d.live) {
    // The Windows trap the BLE code has always known about, said out loud in
    // the one place someone would go looking.
    lines.push('<b>' + d.inputs + ' port' + (d.inputs === 1 ? '' : 's') +
      ' visible, but not one byte has arrived.</b> That is the classic half-connected ' +
      'Bluetooth state: the driver has published the port and the controller is not actually ' +
      'joined to it. Press CONNECT in the vendor panel, or use CONNECT BLUETOOTH below to have ' +
      'this app open the link itself.');
  } else {
    lines.push('<b>Receiving.</b> ' + d.bytes + ' message' + (d.bytes === 1 ? '' : 's') + ' so far.');
  }
  if (!d.sysex && d.mode === 'webmidi') {
    lines.push('SysEx was refused, so transport buttons that use MMC will not arrive. ' +
      'Everything else works; LEARN below binds them by hand.');
  }
  // The names, always. "A port exists" and "the port is called KORG BLE-MIDI"
  // are very different amounts of help when someone is trying to work out
  // whether the thing they plugged in is the thing the app can see.
  if (d.names.length) lines.push('Ports: ' + esc(d.names.join(', ')));
  if (d.auto) lines.push('Paired devices: ' + esc(d.auto) + '.');

function renderPorts() {
  const box = $('#ports');

// Touching a drawn key auditions the focused cell at that pitch. It holds while
// you hold, like the hardware would, rather than firing a one-shot — otherwise
// a PAD or an ATMOS could never be heard the way it actually behaves.
keybed.addEventListener('pointerdown', (ev) => {
  const el = ev.target.closest('[data-n]'); if (!el) return;
  ev.preventDefault();
  capture(keybed, ev.pointerId);
  const n = +el.dataset.n;
  const c = liveCells(song)[atlas.focusAt(1) ?? lastCell] || liveCells(song)[0];
  if (!c) return;
  eng.resume();
  touched.set(ev.pointerId, { n, h: eng.hold(c.voice, n, 100, 0) });
  lightKey(n, true);
});
function releaseTouch(ev) {
  const t = touched.get(ev.pointerId); if (!t) return;
  touched.delete(ev.pointerId);
  t.h.off();

  paintKeys();
}

// ---- LIBRARY ---------------------------------------------------------------
// Assignment works in BOTH directions, because people think in both:
//   pick a sound, then tap the cell   (you know the sound you want)
//   tap the cell, then pick a sound   (you know the slot you want)
// Neither is a mode. Arming a sound just lights it; tapping a cell with nothing
// armed still plays the cell exactly as before.
let armed = null;
function renderList(items) {
  const host = $('#list'); if (!host) return;
  host.innerHTML = '';
  if (!items.length) {
    host.innerHTML = '<div style="color:var(--dim);font-size:var(--fs-sm);padding:10px 4px;line-height:1.6">' +
      'Nothing here yet.<br>Drop a WAV, MP3 or FLAC above — it stays on this device and survives a restart.</div>';
    return;
  }
  items.forEach((it) => {
    const el = document.createElement('div');
    el.className = 'snd' + (armed === it.id ? ' armed' : '');
    el.draggable = true;
    el.innerHTML = '<span class="k"></span><span class="n"></span><span class="d"></span>' +
      '<button class="sx" title="Remove this sound" aria-label="Remove"><svg viewBox="0 0 24 24">' +
      '<path d="M6 6l12 12M18 6L6 18"/></svg></button>';
    // textContent, never innerHTML: a file name is untrusted input and a pack
    // you were sent can be called anything at all.
    el.querySelector('.k').textContent = it.kind;
    el.querySelector('.n').textContent = it.name;
    el.querySelector('.d').textContent = it.dur.toFixed(2) + 's';
    el.addEventListener('click', async () => {
      armed = armed === it.id ? null : it.id;
      renderList(lib.items);
      // Audition on arm — you should hear what you picked before you place it.
      const buf = await lib.bufferFor(it.id);
      if (buf && armed) { warm.set(it.id, buf); previewBuffer(buf); }
      deck.querySelectorAll('.cell').forEach((c) => c.classList.toggle('arm', !!armed));
    });
    el.querySelector('.sx').addEventListener('click', async (e) => {
      e.stopPropagation();                       // do not also arm the sound
      // A sound in use has to let go of the cells holding it, or those pads keep
      // a sampleId pointing at nothing and fall silent with no explanation.
      liveCells(song).forEach((c, ci) => {
        if (c.voice.sampleId === it.id) { c.voice.sampleId = null; syncRibbon(ci); }
      });
      warm.delete(it.id);
      await lib.remove(it.id);
      lib.repin(liveCells(song).map((c) => c.voice.sampleId));
      buildDeck(); invalidateSheets(); saveSong(song);
      toast('removed ' + it.name.slice(0, 18));
    });
    el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/sx', it.id); armed = it.id; });
    host.appendChild(el);
  });
}
function previewBuffer(buf) {
  const ctx = eng.init(); eng.resume();
  const s2 = ctx.createBufferSource(); s2.buffer = buf;
  const g2 = ctx.createGain(); g2.gain.value = 0.9;
  s2.connect(g2); g2.connect(ctx.destination); s2.start();
}
async function assignSample(cellIdx, sampleId) {
  const c = liveCells(song)[cellIdx]; if (!c) return;
  const buf = await lib.bufferFor(sampleId);
  if (!buf) return;
  warm.set(sampleId, buf);
  c.voice.sampleId = sampleId;
  const meta = lib.find(sampleId);
  if (meta) c.name = meta.name.slice(0, 12).toUpperCase();
  // Re-pin from the model, so a sample no longer used by any cell becomes
  // evictable again instead of pinning RAM forever.
  lib.repin(liveCells(song).map((x) => x.voice.sampleId));
  buildDeck(); invalidateSheets(); liveCells(song).forEach((_, i) => syncRibbon(i));
  hist.push(song); saveSong(song);
  armed = null; renderList(lib.items);
}

// Drop anywhere on the window, not just on the shelf. Making someone open a

['dragover', 'drop'].forEach((n) => window.addEventListener(n, (e) => e.preventDefault()));
window.addEventListener('dragover', () => $('#drop').classList.add('hot'));
window.addEventListener('dragleave', () => $('#drop').classList.remove('hot'));

function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 74px);' +
      'transform:translateX(-50%);z-index:60;padding:9px 16px;border-radius:999px;' +

    document.body.appendChild(t);
  }

  clearTimeout(t.__h); t.__h = setTimeout(() => { t.style.opacity = '0'; }, 1900);

function esc(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
buildDeck(); buildScenePick();
// Metadata only at boot — nothing is decoded until it is played, so a 300-sound
// library costs the same at startup as an empty one.
lib.boot().then(() => {
  const ids = liveCells(song).map((c) => c.voice.sampleId).filter(Boolean);
  lib.repin(ids);
  // Warm only what the cells actually reference, so the first hit is instant.
  ids.forEach(async (id) => { const b = await lib.bufferFor(id); if (b) warm.set(id, b); });
});
liveCells(song).forEach((_, i) => syncRibbon(i));
$('#bpm').value = song.bpm;
$('#swing').value = Math.round(song.swing * 100);
atlas.setFocus(2, 0);
// On a first run the hint says PRESS PLAY, because that is the one action that
// proves the whole thing works — the grid arrives already holding a pattern and
// pressing play is how you find that out. Teaching navigation first assumes
// someone already believes there is something worth navigating to.
//
// Once they have pressed it, the hint becomes the navigation one and stays that
// way forever. A hint that keeps telling you something you have already done is
// just noise on the screen.
const HINT_FLY = 'PINCH OR SCROLL TO FLY';
if (!FIRST_RUN) $('#hint').textContent = HINT_FLY;
else playBtn.addEventListener('click', () => { $('#hint').textContent = HINT_FLY; }, { once: true });

atlas.paint();
frame();
// Everything is placed; from here a size change is a deliberate act and may
// animate.
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('ready')));
// Any first gesture unlocks audio — browsers require one, and it must not be a
// button the user has to find.
['pointerdown', 'keydown'].forEach((e) => window.addEventListener(e, () => eng.resume(), { once: true }));
window.addEventListener('keydown', (e) => {
  // Escape closes whatever is open, innermost first: a window, then the shelf.
  // It has to run before anything else claims the key.
  if (e.key === 'Escape') {
    if (openWin) { e.preventDefault(); closeWin(); return; }
    if ($('#shelf').classList.contains('open')) { e.preventDefault(); $('#shelfx').click(); return; }
  }
  // A modal window owns the keyboard while it is up. Without this, space still
  // starts the transport and S still solos a pad behind the scrim — actions
  // aimed at a screen the person is not looking at.
  if (openWin && !(e.ctrlKey || e.metaKey)) return;
  if (e.key === ' ' && !/input/i.test(e.target.tagName)) { e.preventDefault(); playBtn.click(); }
  // Undo AND redo. createHistory has always had a redo — it was simply bound to
  // no key, so every step you took back was a step you could never take
  // forward again. Both shortcuts that people actually press are wired:
  // ctrl/cmd+shift+Z, which is the Mac and modern convention, and ctrl+Y, which
  // is the Windows one.
  const mod = e.ctrlKey || e.metaKey;
  if (mod && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault();
    applySnapshot(e.shiftKey ? hist.redo() : hist.undo(song));
  } else if (mod && (e.key === 'y' || e.key === 'Y')) {
    e.preventDefault();
    applySnapshot(hist.redo());
  }
});
// One place that puts a snapshot back on screen. Undo and redo differ only in
// which snapshot they hand over; everything after that is identical, and having
// written it twice is how the two drift apart.
function applySnapshot(s) {
  if (!s) return;
  Object.assign(song, s);
  buildDeck(); buildScenePick(); invalidateSheets();
  liveCells(song).forEach((_, i) => syncRibbon(i));
  $('#bpm').value = song.bpm;
$('#swing').value = Math.round(song.swing * 100);
  saveSong(song);
}

// What changed, most recent first. The rule the user set: a new feature is not

function renderHelp() {
  const body = $('#helpbody');
  if (body.dataset.built) return;
  body.dataset.built = '1';
  const rows = (list) => list.map(([d, w]) =>
    '<div class="hrow"><span class="hd">' + esc(d) + '</span><span class="hw">' + esc(w) + '</span></div>').join('');
  // Two releases deep, not one. Someone who skipped an update should still find
  // out what changed in it; a what's-new that only ever shows the very latest
  // release quietly loses everything for anyone who was not watching.
  body.innerHTML =
    '<div class="hnew"><div class="hgrp"><h4>NEW IN ' + esc(WHATS_NEW[0]) + '</h4>' +
      rows(WHATS_NEW[1]) +
      '</div><div class="hgrp"><h4>' + esc(WHATS_NEW_2[0]) + '</h4>' +
      rows(WHATS_NEW_2[1]) +
      '</div><div class="hgrp"><h4>' + esc(WHATS_NEW_3[0]) + '</h4>' +
      rows(WHATS_NEW_3[1]) + '</div></div>' +
    HELP.map(([title, list]) =>
      '<div class="hgrp"><h4>' + esc(title) + '</h4>' + rows(list) + '</div>').join('') +
    '<div class="hgrp"><h4>DATA</h4>' +
      '<button class="wbtn danger" id="resetall">START OVER</button></div>';
  // Two taps, not a dialog. This throws away everything with no undo, and a
  // confirm() in a WebView is a system-styled box that stops the audio thread.
  let armed = 0;
  $('#resetall').addEventListener('click', async (e) => {
    const b = e.currentTarget;
    if (!armed) {
      armed = 1; b.textContent = 'TAP AGAIN TO ERASE EVERYTHING';
      setTimeout(() => { if (armed) { armed = 0; b.textContent = 'START OVER'; } }, 4000);
      return;
    }
    b.disabled = true; b.textContent = 'ERASING…';
    try { await lib.clear(); } catch (err) {}
    try { localStorage.clear(); } catch (err) {}
    location.reload();
  });
}
$('#gear').addEventListener('click', () => { renderHelp(); showWin($('#helpwin')); });

// A single handle for tests and for anyone poking at this in a console. Every
// entry is something the UI itself uses — nothing here exists only for tests.
window.__ult = {
  atlas, song, eng, io, lib, keys, params: PARAMS,
  assign: assignSample, densify, buildDeck, renderList,
  pushHistory: () => hist.push(song),
  // The constellation's hit list and its picker, so a test can prove that what
  // you touch is what you saw rather than assuming it.
  nebBodies: () => (NEB.hit || []).map((x) => ({ i: x.i, x: x.x, y: x.y, r: x.r })),
  nebPick,
  warmHas: (id) => warm.has(id),
  focusCell: (i) => selectCell(i, 'test'),
  get keyCell() { return keyCell; },
  selectCell,
  // The column's node list, same shape and same purpose as nebBodies: a test
  // can prove that the thing it taps is the thing that was drawn.
  colNodes: () => (NEB.col ? NEB.col.nodes.map((n) => ({ i: n.i, s: n.s, x: n.x, y: n.y, vel: n.vel })) : []),
  setView, colPick, setScene,
  // The learned pad layout, so a test can prove a mapped pad fires what it was
  // mapped to rather than the note it happens to send.
  padMap: () => Object.assign({}, padMap),
  // The Oort layout, same purpose as nebBodies and colNodes: what a test taps
  // must be what the renderer drew.
  oortNodes: () => (NEB.oort ? NEB.oort.shells.flatMap((sh) => sh.nodes.map((n) => ({
    sc: n.sc, i: n.i, hits: n.hits, live: n.live, x: n.x, y: n.y, z: n.z }))) : []),
  // Every selector the manual claims to document. The coverage test reads this
  // and compares it against the controls that actually exist — in both
  // directions, so an undocumented button and a documented ghost both fail.
  helpSelectors: () => HELP.reduce((a, [, list]) => a.concat(list.flatMap((e) => e[2] || [])), []),
  openHelp: () => { renderHelp(); showWin($('#helpwin')); },
  openMidi,
};
// Lets a voice be rendered offline and measured rather than listened to. Used
// by the kit tests to prove KICK and HAT are actually different sounds and not
// just different labels, which is exactly the bug this kit replaced.
window.__ultMakeEngine = createEngine;
// The same renderer the EXPORT WAV button calls. Exposed so a test can check
// what came out of it — a bounce is the one feature whose output nobody can
// see, so it is the one that most needs measuring rather than eyeballing.
window.__ultBounce = bounceScene;
</script>
