/* ============================ ULTIMATE ====================================
   There is no chrome in this app. No title bars, no tab strips, no window
   furniture, no menu. Everything you can see is either the music or a control
   that is touching the music. That is not minimalism for its own sake — every
   pixel of chrome is a pixel not showing you your song, and on a phone that
   trade is brutal.

   The whole visual language is three ideas:
     · ONE LIGHT SOURCE, above. Every raised thing is lit on its top edge and
       casts downward. Consistency is what makes flat rectangles read as objects.
     · COLOUR MEANS IDENTITY. Each cell owns a hue for its whole life, at every
       altitude. You learn "the kick is the red one" once and it is true in the
       constellation, on the deck, and inside the waveform.
     · LIGHT MEANS ENERGY. Nothing blinks or spins for decoration; if something
       is glowing it is because audio is coming out of it right now.
   ------------------------------------------------------------------------ */
:root{
  color-scheme:dark;
  --void:#06070B;          /* the space everything floats in */
  --ink:#EEF3FA;
  --dim:#7E8798;
  --line:#222A36;
  --glass:rgba(20,26,36,.72);
  --acc:#4BE3C8;

  /* Fluid ramp — one continuous curve, no breakpoints, so there is no width at
     which the app snaps or looks broken. */
  --fs-xs:clamp(8.5px,.22vw + 7.8px,10.5px);
  --fs-sm:clamp(10px,.3vw + 9px,12.5px);
  --fs-md:clamp(12px,.42vw + 10.6px,15px);
  --fs-lg:clamp(16px,.9vw + 13px,24px);
  --fs-xl:clamp(22px,2.4vw + 14px,54px);
  --sp:clamp(6px,.5vw + 4.5px,12px);
  --hit:clamp(30px,2vw + 24px,38px);

  --e1:0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.34);
  --e2:0 2px 6px rgba(0,0,0,.55), 0 14px 40px rgba(0,0,0,.45);
  --lip:inset 0 1px 0 rgba(255,255,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);
  font-family:'Oswald','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%;
  letter-spacing:.06em;}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit;}

/* The surface everything lives on. Layers stack here and the atlas moves them
   in Z; nothing is ever added or removed, only flown past. */
#sky{position:fixed;inset:0;overflow:hidden;touch-action:none;}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform-origin:50% 50%;will-change:transform,opacity;}
/* --dock is the room the console needs where it sits by default. Every
   altitude shortens itself by that much, so the console has somewhere to be
   that is not on top of the work. It drops to 0 the moment the console is
   dragged somewhere else: at that point the position is a deliberate choice,
   and the app should not keep reserving space for a place it no longer is. */
.pane{width:min(94vw,1180px);height:min(calc(88svh - var(--dock,0px)),860px);position:relative;
  margin-bottom:var(--dock,0px);
  transition:margin-bottom .28s cubic-bezier(.2,.7,.3,1),height .28s cubic-bezier(.2,.7,.3,1);}

/* A slow drifting field so the void reads as depth rather than as a dead
   background. Pure CSS, no canvas, no per-frame cost. */
#sky::before{content:'';position:absolute;inset:-30%;pointer-events:none;
  background:
    radial-gradient(38vmax 38vmax at 22% 18%, rgba(75,227,200,.09), transparent 60%),
    radial-gradient(30vmax 30vmax at 82% 74%, rgba(160,90,255,.09), transparent 62%),
    radial-gradient(26vmax 26vmax at 62% 22%, rgba(255,90,140,.06), transparent 60%);
  animation:drift 44s ease-in-out infinite alternate;}
@keyframes drift{to{transform:translate3d(2.5%,-2%,0) scale(1.07);}}

/* ---------- ALTITUDE RAIL -------------------------------------------------
   The only persistent UI in the entire app. It is a depth gauge, not a menu:
   it tells you where you are and lets you jump, and it is five dots. */
#rail{position:fixed;left:max(10px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:4px;z-index:40;}
/* The dot is 8px because that is how big it should LOOK. The button is 26px
   because that is how big it has to be to hit — WCAG 2.2 asks for 24, and the
   rail is how you move between altitudes, so missing it is not a cosmetic
   failure. The gap shrinks to keep the visual rhythm of the original. */
.rdot{width:var(--hit);min-height:26px;height:26px;border:0;background:transparent;cursor:pointer;
  display:flex;align-items:center;gap:7px;padding:0;opacity:.42;transition:opacity .18s;}
.rdot i{width:8px;height:8px;box-shadow:0 0 0 1px rgba(255,255,255,.24);border-radius:50%;background:var(--ink);flex:none;transition:all .2s;}
.rdot span{font-size:var(--fs-xs);white-space:nowrap;opacity:0;transform:translateX(-4px);
  transition:all .2s;}
.rdot.on{opacity:1;}
.rdot.on i{background:var(--acc);box-shadow:0 0 0 4px rgba(75,227,200,.16),0 0 14px var(--acc);width:9px;height:9px;}
#rail:hover .rdot span,.rdot.on span{opacity:.85;transform:none;}

/* ---------- TRANSPORT -----------------------------------------------------
   Floats bottom-centre at every altitude, because "play" must never be more
   than one reach away no matter how deep you have flown. */
/* ---------- THE CONSOLE ----------------------------------------------------
   The transport pill and the wave monitor are ONE object, and it moves.

   They belong together because they are the same thing from two directions —
   what you told the app to do, and what the app is actually doing about it —
   and because a monitor that floats loose across the deck reads as damage
   rather than as a display. Bound to the pill it has an edge, a size and a
   place, and it goes wherever you put the pill.

   Movable because a fixed overlay is always in the wrong place for someone:
   it lands on the bottom row of pads on a short screen, over the constellation
   at CONSTELLATION altitude, and under your palm if you play left-handed.
   Rather than guess, let it be dragged and remember where it was left. */
/* An explicit width, so the monitor and the pill are the same object rather
   than two things that happen to be near each other. Without it the console
   was shrink-to-fit and the well came out wider than the pill it sits on. */
#console{position:fixed;z-index:40;width:min(92vw,600px);
  display:flex;flex-direction:column;align-items:stretch;gap:6px;touch-action:none;}
#console.dragging{opacity:.9;}
#console.dragging #bar{border-color:var(--acc);}
#bar{display:flex;align-items:center;justify-content:center;gap:var(--sp);padding:8px 12px;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--e2),var(--lip);}
/* The grip is the only part of the pill that is not a control, so it is the
   only part safe to drag from — dragging off a button would make every mistimed
   press move the console instead of doing what you asked. */
#grip{width:16px;height:var(--hit);flex:none;cursor:grab;display:grid;place-items:center;
  border-radius:8px;touch-action:none;}
#grip:active{cursor:grabbing;}
#grip i{display:block;width:3px;height:3px;border-radius:50%;background:var(--dim);
  box-shadow:0 -6px var(--dim),0 6px var(--dim),5px 0 var(--dim),5px -6px var(--dim),5px 6px var(--dim);}
#grip:hover i{background:var(--acc);
  box-shadow:0 -6px var(--acc),0 6px var(--acc),5px 0 var(--acc),5px -6px var(--acc),5px 6px var(--acc);}
.tb{width:var(--hit);height:var(--hit);border-radius:50%;border:1px solid var(--line);
  background:transparent;display:grid;place-items:center;cursor:pointer;transition:all .15s;flex:none;}
.tb:hover{border-color:var(--acc);}
.tb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
.tb.on{background:var(--acc);color:#04140F;border-color:var(--acc);box-shadow:0 0 18px rgba(75,227,200,.5);}
.tb.rec.on{background:#FF3B5C;border-color:#FF3B5C;box-shadow:0 0 18px rgba(255,59,92,.5);color:#fff;}
/* min-height, not height: the field must clear the 24px touch floor without
   the number jumping size when the fluid font scale moves. */
#bpm{width:56px;min-height:26px;background:transparent;border:0;text-align:center;
  font-size:var(--fs-md);font-variant-numeric:tabular-nums;outline:none;}
#bpm:focus{color:var(--acc);}
.blab{font-size:var(--fs-xs);color:var(--dim);}

/* ---------- CELLS ---------------------------------------------------------
   The single repeated object of the whole app. It is a pad on the DECK, a node
   in the CONSTELLATION, and the subject of every altitude below. */
.grid{position:absolute;inset:0;display:grid;gap:clamp(5px,.7vw,11px);
  grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);}
.cell{position:relative;border-radius:clamp(10px,1.3vw,18px);cursor:pointer;
  border:1px solid rgba(255,255,255,.07);overflow:hidden;
  /* --l1/--l2 are computed per cell in buildDeck rather than fixed, so every
     pad carries the same LUMINANCE regardless of hue. A fixed 31% lightness is
     a very different brightness in yellow than in blue: the yellow-green pads
     visually shouted over the blue ones, and their labels fell to 3.67:1 —
     under the 4.5:1 the text needs to be readable. */
  background:linear-gradient(158deg,hsl(var(--h) 72% var(--l1,31%)),hsl(var(--h) 64% var(--l2,14%)));
  box-shadow:var(--e1),var(--lip);transition:transform .12s cubic-bezier(.2,.7,.3,1),box-shadow .12s;}
.cell:active{transform:scale(.972);}
.cell.mute{filter:saturate(.15) brightness(.62);}
/* Energy ring — driven by the meter, so brightness IS loudness. */
.cell::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px hsl(var(--h) 90% 62% / calc(var(--e) * .9)),
             0 0 calc(var(--e) * 26px) hsl(var(--h) 90% 58% / calc(var(--e) * .55));}
.cname{position:absolute;left:9px;top:8px;font-size:var(--fs-sm);font-weight:600;
  /* --lt is computed too. The label was hsl(h 95% 86%), which is a very
     different BRIGHTNESS per hue for exactly the same reason the pad is — so
     pinning only the background left the blue and violet labels failing
     instead of the yellow ones. Both sides of the ratio have to be held. */
  color:hsl(var(--h) 42% var(--lt,86%));text-shadow:0 1px 3px rgba(0,0,0,.65);letter-spacing:.1em;}
/* Step ribbon along the bottom of every pad: the pattern is visible without
   descending, so the DECK already tells you what the CELL contains. */
.ribbon{position:absolute;left:8px;right:8px;bottom:8px;height:5px;display:grid;
  grid-template-columns:repeat(16,1fr);gap:1px;}
.ribbon b{border-radius:1px;background:rgba(255,255,255,.09);}
.ribbon b.on{background:hsl(var(--h) 90% 62%);}
.ribbon b.at{background:#fff;box-shadow:0 0 7px #fff;}

/* ---------- CONSTELLATION -------------------------------------------------- */
#nebula{position:absolute;inset:0;width:100%;height:100%;}
.scenepick{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);display:flex;gap:8px;}
.spill{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
  font-size:var(--fs-sm);cursor:pointer;min-height:var(--hit);}
.spill.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 16px rgba(75,227,200,.25);}

/* ---------- CELL / VOICE / GRAIN ------------------------------------------- */
.sheet{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--sp)*1.7);
  padding:clamp(10px,2vw,26px);}
.title{font-size:var(--fs-xl);font-weight:600;line-height:1;letter-spacing:.04em;}
.sub{font-size:var(--fs-sm);color:var(--dim);}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:clamp(3px,.5vw,7px);
  height:clamp(64px,18vh,132px);flex:none;}
.st{border-radius:6px;border:1px solid rgba(255,255,255,.08);cursor:pointer;position:relative;
  background:rgba(255,255,255,.03);transition:background .1s,box-shadow .1s;min-height:var(--hit);}
.st.on{background:hsl(var(--h) 88% 55%);box-shadow:0 0 16px hsl(var(--h) 88% 55% / .5);}
.st.beat{border-color:rgba(255,255,255,.18);}
.st.at{outline:2px solid #fff;outline-offset:-2px;}
.knobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:var(--sp);}
.kb{display:flex;flex-direction:column;align-items:center;gap:3px;}
.kb svg{width:clamp(44px,6vw,62px);height:auto;cursor:grab;touch-action:none;display:block;}
.kb .kv{font-size:var(--fs-sm);font-variant-numeric:tabular-nums;}
.kb .kl{font-size:var(--fs-xs);color:var(--dim);letter-spacing:.1em;}
/* flex-basis 0 for the same reason as the monitor canvas — an intrinsic canvas
   height inside a column flex feeds back into layout and creeps. */
#scope{width:100%;flex:1 1 0;min-height:120px;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.35);box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}

/* ---------- LIBRARY --------------------------------------------------------
   The library is not a panel and not a modal. It is a shelf that slides in over
   whatever altitude you are on, so you can drop a sound onto a cell WITHOUT
   leaving the place you were working. A modal would force you to close it to
   see the thing you were aiming at, which is exactly why sample assignment
   feels like a chore in every other DAW. */
#shelf{position:fixed;top:0;right:0;bottom:0;width:min(320px,84vw);z-index:50;
  background:rgba(9,12,17,.94);border-left:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateX(101%);transition:transform .26s cubic-bezier(.2,.7,.3,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.55);}
#shelf.open{transform:none;}
#shelf header{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;flex:none;}
#shelf header .t{font-size:var(--fs-lg);flex:1;letter-spacing:.1em;}
#drop{margin:0 14px 10px;padding:18px 10px;border:1px dashed var(--line);border-radius:12px;
  text-align:center;font-size:var(--fs-sm);color:var(--dim);cursor:pointer;flex:none;
  line-height:1.7;transition:all .16s;}
#drop:hover,#drop.hot{border-color:var(--acc);color:var(--acc);background:rgba(75,227,200,.07);}
#list{flex:1;overflow-y:auto;padding:0 10px 14px;display:flex;flex-direction:column;gap:4px;}
.snd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;
  border:1px solid transparent;background:rgba(255,255,255,.035);cursor:grab;
  font-size:var(--fs-sm);min-height:var(--hit);}
.snd:hover{border-color:var(--acc);background:rgba(75,227,200,.09);}
.snd .k{font-size:var(--fs-xs);color:var(--acc);letter-spacing:.1em;flex:none;min-width:48px;}
.snd .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.snd .d{font-size:var(--fs-xs);color:var(--dim);font-variant-numeric:tabular-nums;flex:none;}
.snd.armed{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 20px rgba(75,227,200,.3);}
/* The sounds button lives ON the console. It used to float on its own at the
   bottom right, which meant two independent overlays that collided with each
   other on a narrow phone and both collided with the deck. One floating object
   that carries everything is easier to place, easier to move out of the way,
   and impossible to trap the other one under. */
/* A cell that owns a sample says so, quietly and permanently. */
.cell.hassample::before{content:'';position:absolute;right:9px;top:10px;width:6px;height:6px;
  border-radius:50%;background:hsl(var(--h) 96% 76%);box-shadow:0 0 9px hsl(var(--h) 96% 76%);z-index:2;}
/* Every cell lights up while a sound is armed, because every cell is now a
   target — the UI should say so rather than leave you guessing. */
.cell.arm{outline:2px solid var(--acc);outline-offset:-2px;}

/* ---------- WAVELENGTH MONITOR --------------------------------------------
   The key system has no UI at all, which is the right call and leaves the
   player with nothing that confirms the instrument heard them. This is that
   confirmation, and it is the only visible part: a live trace of what is
   actually leaving the speaker, so pushing the mod wheel makes the wave
   breathe and bending stretches its cycles under your finger.

   It is fixed rather than laid out, so it costs nothing in the flow and can
   never push anything around, and pointer-events are off so it is scenery you
   cannot get stuck on. It fades itself out when there is no signal — invisible
   until there is something to see, which is the whole brief. */
/* The monitor is a WELL now, not a strip. Before, it was a full-width trace
   fixed across the bottom of the screen, so at DECK altitude it ran straight
   through the bottom row of pads and read as a crack in the glass rather than
   as a display. Sound belongs inside something. Giving it a border, a floor
   and a fixed size makes it an instrument panel — and bounding it inside the
   console means it can never overlap anything again, because it is no longer
   free to be anywhere. */
#mon{width:100%;height:clamp(30px,5.2vh,54px);border-radius:12px;overflow:hidden;
  position:relative;opacity:0;transition:opacity .45s ease;
  background:linear-gradient(180deg,rgba(3,5,9,.86),rgba(6,9,15,.78));
  border:1px solid var(--line);box-shadow:var(--well),var(--e1);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
#mon.live{opacity:1;}
/* A centre line, so a silent monitor still looks like an instrument at rest
   rather than an empty box someone forgot to fill. */
#mon::before{content:'';position:absolute;left:8px;right:8px;top:50%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);}
/* flex-basis 0 AND min-width 0, both deliberately. A canvas carries an
   intrinsic size from its width attribute, and that size feeds back into flex
   layout: the box grows, we measure the bigger box, we set a bigger width
   attribute, which grows the box again. Left alone it ran away to 37910px in
   a 1280px window. min-width:0 is what actually breaks the loop — without it
   the automatic minimum size keeps the canvas at its intrinsic width no matter
   what the flex basis says. */
/* The soft ends belong to the CANVAS, not to #mon. mask-clip defaults to
   border-box, so masking the container also clipped away the readout sitting
   just outside it — the text was present and correct and simply never painted. */
/* min-width:0 is load-bearing. A canvas carries an intrinsic size from its
   width attribute, that size feeds layout, we measure the bigger box and set a
   bigger attribute — left alone it ran away to 37910px in a 1280px window. */
#mon canvas{display:block;width:100%;min-width:0;height:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);}
/* The readout gets its OWN LINE above the well rather than sitting on top of
   the trace. Laid over the waveform it was legible but wrong: two things
   competing for the same pixels, which is exactly the kind of conflict this
   pass is meant to remove. It only ever prints a control that is off its
   resting position, and :empty collapses the row entirely, so an untouched
   keyboard costs no space at all. */
#hands{align-self:flex-end;padding:0 4px;font-size:var(--fs-xs);letter-spacing:.11em;
  color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;
  pointer-events:none;text-shadow:0 1px 5px rgba(0,0,0,.95);
  opacity:0;transition:opacity .25s;}
#hands:not(:empty){opacity:1;}
#hands:empty{display:none;}
#hands b{color:var(--acc);font-weight:600;}

/* ---------- STATUS --------------------------------------------------------- */
#status{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));
  z-index:40;font-size:var(--fs-xs);color:var(--dim);text-align:right;max-width:44vw;line-height:1.5;}
#status b{color:var(--acc);font-weight:600;}
#hint{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);
  z-index:40;font-size:var(--fs-xs);color:var(--dim);letter-spacing:.16em;pointer-events:none;
  transition:opacity .3s;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>
<body>
<div id="sky">
  <div class="layer" data-alt="0"><div class="pane"><canvas id="nebula"></canvas><div class="scenepick" id="scenepick"></div></div></div>
  <div class="layer" data-alt="1"><div class="pane"><div class="grid" id="deck"></div></div></div>
  <div class="layer" data-alt="2"><div class="pane"><div class="sheet" id="cellsheet"></div></div></div>
  <div class="layer" data-alt="3"><div class="pane"><div class="sheet" id="voicesheet"></div></div></div>
  <div class="layer" data-alt="4"><div class="pane"><div class="sheet" id="grainsheet"></div></div></div>
</div>
<nav id="rail"></nav>
<div id="hint">PINCH OR SCROLL TO FLY</div>
<div id="status">connecting…</div>
<aside id="shelf">
  <header><span class="t">SOUNDS</span><button class="tb" id="shelfx" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div id="drop">DROP AUDIO HERE<br>OR TAP TO BROWSE</div>
  <input id="file" type="file" accept="audio/*" multiple hidden>
  <div id="list"></div>
</aside>
<div id="console">
<span id="hands"></span>
<div id="mon"><canvas id="monwave"></canvas></div>
<div id="bar">
  <div id="grip" title="Drag to move · double-tap to recentre"><i></i></div>
  <button class="tb" id="play" title="Play / stop"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
  <button class="tb rec" id="rec" title="Arm recording"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg></button>
  <span class="blab">BPM</span><input id="bpm" type="number" min="20" max="300" value="100">
  <button class="tb" id="dice" title="Surprise me"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3"/><circle cx="15" cy="15" r="1.3"/><circle cx="12" cy="12" r="1.3"/></svg></button>
  <button class="tb" id="libbtn" title="Sounds"><svg viewBox="0 0 24 24"><path d="M4 5h11l3 3v11H4z"/><path d="M9 12h6M9 15h6"/></svg></button>
  <button class="tb" id="panic" title="Silence everything"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</div>

<script>

    kind: "synth",

    {

      else toast("nothing there this app could decode");
    }
  });
  function toast(msg) {
    let t = document.getElementById("toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "toast";
      t.style.cssText = "position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 74px);transform:translateX(-50%);z-index:60;padding:9px 16px;border-radius:999px;background:rgba(9,12,17,.94);border:1px solid var(--line);font-size:var(--fs-sm);letter-spacing:.08em;pointer-events:none;transition:opacity .25s;box-shadow:var(--e2)";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = "1";
    clearTimeout(t.__h);
    t.__h = setTimeout(() => {
      t.style.opacity = "0";
    }, 1900);
  }
  function esc(v) {
    return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  buildDeck();
  buildScenePick();
  lib.boot().then(() => {
    const ids = liveCells(song).map((c) => c.voice.sampleId).filter(Boolean);
    lib.repin(ids);
    ids.forEach(async (id) => {
      const b = await lib.bufferFor(id);
      if (b) warm.set(id, b);
    });
  });
  liveCells(song).forEach((_, i) => syncRibbon(i));
  $("#bpm").value = song.bpm;
  atlas.setFocus(2, 0);
  atlas.paint();
  frame();
  ["pointerdown", "keydown"].forEach((e) => window.addEventListener(e, () => eng.resume(), { once: true }));
  window.addEventListener("keydown", (e) => {
    if (e.key === " " && !/input/i.test(e.target.tagName)) {
      e.preventDefault();
      playBtn.click();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "z") {
      const s = hist.undo(song);
      if (s) {
        Object.assign(song, s);
        buildDeck();
        buildScenePick();
        invalidateSheets();
        liveCells(song).forEach((_, i) => syncRibbon(i));
        saveSong(song);
      }
    }
  });
  window.__ult = {
    atlas,
    song,
    eng,
    io,
    lib,
    keys,
    params: PARAMS,
    assign: assignSample,
    densify,
    buildDeck,
    renderList,
    pushHistory: () => hist.push(song),
    warmHas: (id) => warm.has(id),
    focusCell: (i) => {
      lastCell = i;
    }
  };
  window.__ultMakeEngine = createEngine;
})();

</script>
</body>
</html>
