<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SKRiMPAD x LIVE x</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #0e1116; color: #cdd6e0;
      font-family: 'Oswald', 'Arial Narrow', sans-serif; }
    #app { display: flex; flex-direction: column; align-items: center; min-height: 100vh;
      padding: 20px; box-sizing: border-box; gap: 16px; }
    #chrome { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 960px;
      justify-content: space-between; flex-wrap: wrap; }
    .brand { font-size: 12px; letter-spacing: .22em; color: #5b6774; text-transform: uppercase; }
    #picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .hbtn { appearance: none; border: 1.4px solid #5b6774; background: transparent; color: #cdd6e0;
      font: 800 10px/1 'Oswald','Arial Narrow',sans-serif; letter-spacing: .1em; text-transform: uppercase;
      padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .hbtn:hover { border-color: #4bd6c8; color: #4bd6c8; }
    #bt { border-color: #4bd6c8; color: #4bd6c8; }
    #sync { appearance: none; border: 1.5px solid #4bd6c8; background: transparent; color: #4bd6c8;
      font: 800 12px/1 'Oswald','Arial Narrow',sans-serif; letter-spacing: .18em; text-transform: uppercase;
      padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: background .08s, color .08s, transform .08s; }
    #sync:active, #sync.flash { background: #4bd6c8; color: #0e1116; transform: scale(.97); }
    #sync .sub { display: block; font-size: 8px; letter-spacing: .1em; opacity: .7; margin-top: 3px; }
    /* one board per connected device, stacked */
    #stage { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
    .board { width: 100%; max-width: 640px; }
    .board-h { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #4bd6c8;
      padding: 3px 2px 5px; opacity: .85; }
    .board-b svg { max-width: 100%; height: auto; }
    #empty { color: #5b6774; font-size: 12px; letter-spacing: .1em; margin-top: 40px; }
    #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #141a22; border: 1px solid #2a3441; color: #cdd6e0; font-size: 11px;
      padding: 9px 15px; border-radius: 8px; opacity: 0; transition: opacity .2s;
      pointer-events: none; max-width: 90%; text-align: center; line-height: 1.4; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app">
    <div id="chrome">
      <span class="brand">SKRiMPADxLIVEx</span>
      <span id="picker">
        <button class="hbtn" data-dev="smk25">+ SMK-25</button>
        <button class="hbtn" data-dev="k61">+ 61-KEY</button>
        <button class="hbtn" id="clear">CLEAR</button>
      </span>
      <span style="display:flex; gap:10px;">
        <button class="hbtn" id="bt" title="Connect a Bluetooth-MIDI controller">📶 BT</button>
        <button id="sync" title="Snap beat &amp; note timing to the grid (momentary — one-shot, then releases)">
          ⟳ SYNC<span class="sub">align beat + note</span>
        </button>
      </span>
    </div>
    <div id="stage"></div>
    <div id="empty">No controllers connected — plug one in, tap 📶 BT, or add a demo board above.</div>
  </div>
  <div id="toast"></div>

  <script type="module">
    import { PATTERNS, makeProfile, CLASSES } from './core/profiles.js';
    import { createMidiIO } from './core/midi-io.js';
    import { createGamepad } from './core/gamepad.js';
    import { createDeviceManager } from './core/device-manager.js';

    const stage = document.getElementById('stage');
    const empty = document.getElementById('empty');
    const toastEl = document.getElementById('toast');
    let toastT = null;
    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add('show');
      if (toastT) clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 4200);
    }
    const refreshEmpty = () => { empty.style.display = manager.boards.size ? 'none' : ''; };

    // multi-device manager — one board per physical controller, all live at once
    const manager = createDeviceManager({
      stage, litColor: '#4bd6c8', renderOpts: { maxWidth: 560 },
      onAction: (board, a) => {
        window.__lastAction = { sig: board.sig, ...a };
        if (a.type === 'octnav') {
          const kb = (board.lastSvg && board.lastSvg.__keyboard) || {};
          const max = Math.max(0, (kb.whiteTotal || 0) - (kb.visibleWhites || 0));
          board.startWhite = Math.max(0, Math.min(board.startWhite + a.dir * 7, max));
          manager.renderBoard(board);
        }
        // transport / notes / cc hook into the (future) loop + sound engine here
      },
    });
    window.__manager = manager;

    // demo profiles (no hardware needed for preview)
    const demo = {
      smk25: () => { const p = PATTERNS.find(x => /smk/.test(String(x.test))).base('SMK25'); p.portName = 'SMK25'; return p; },
      k61: () => makeProfile({ id: 'k61', class: CLASSES.KEYBOARD, portName: 'GENERIC 61', keys: { count: 61, firstNote: 36 }, wheels: ['pitch', 'mod'] }),
    };
    document.querySelectorAll('[data-dev]').forEach(b => b.addEventListener('click', () => {
      manager.addDemoBoard(demo[b.dataset.dev]()); refreshEmpty();
    }));
    document.getElementById('clear').addEventListener('click', () => { manager.clear(); refreshEmpty(); });

    // test hook: route a simulated MIDI triple to a specific board's port
    window.__simMidi = (portId, status, d1, d2) =>
      manager.routeMidi({ port: { id: portId }, status, d1, d2, cmd: status & 0xf0, chan: status & 0x0f });

    // ---- LIVE INPUT: connect + display ALL devices ----
    const io = createMidiIO({
      onEvent: (ev) => manager.routeMidi(ev),
      onPorts: (inputs) => { manager.syncPorts(inputs).then(refreshEmpty); },
    });
    io.start().then(m => console.info('[SKRiMPADxLIVEx] MIDI mode:', m.mode)).catch(() => {});
    window.__io = io;
    createGamepad({ onButton: (i) => manager.routeGamepad(i) }).start();

    // Bluetooth: use the driver-bridged MIDI port if present; only GATT otherwise.
    document.getElementById('bt').addEventListener('click', async () => {
      try {
        const r = await io.connectBluetooth({ onStatus: (s) => toast(s.hint || ('BT: ' + s.mode)) });
        if (r.mode === 'port') toast(r.count + ' MIDI port(s) live. KORG on Windows: press CONNECT in the KORG BLE-MIDI panel.');
        else if (r.mode === 'gatt') toast('📶 Connected: ' + (r.device || 'BLE MIDI'));
      } catch (e) { toast('📶 ' + (e && e.message || 'no device selected')); }
    });

    // One-shot SYNC: correct timing once, then take its hands off. Momentary, not a toggle.
    const btn = document.getElementById('sync');
    btn.addEventListener('click', () => {
      btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 140);
      console.info('[SKRiMPADxLIVEx] SYNC — beat+note timing re-aligned (one-shot).');
    });

    refreshEmpty();
  </script>
</body>
</html>
