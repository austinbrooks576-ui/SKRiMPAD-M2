<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>SKRiMPAD JP</title>
<meta name="theme-color" content="#07080C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ONE DEVICE, ONE SCREEN.
   This app has exactly one instrument in front of it, so it has exactly one
   layout: the grid, and a rail of the things you reach for while your other
   hand is on the pads. There is nothing to navigate, because there is nowhere
   else to be. */
:root{
  --bg:#07080C; --panel:#10131B; --line:rgba(255,255,255,.09);
  --txt:#EAF0F6; --dim:#7D8798; --acc:#4BE3C8; --rec:#FF3B5C; --warm:#FFB454;
  --fs-xs:clamp(9px,1.5vw,11px); --fs-sm:clamp(11px,1.8vw,13px);
  --fs-md:clamp(13px,2.2vw,16px); --fs-lg:clamp(17px,3vw,22px);
  --sp:clamp(6px,1.2vw,12px);
  --hit:44px;
  --e1:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.35);
  --e2:0 2px 6px rgba(0,0,0,.55),0 14px 40px rgba(0,0,0,.45);
  --lip:inset 0 1px 0 rgba(255,255,255,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:'Oswald','Arial Narrow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:var(--fs-md);letter-spacing:.02em;}
button,input,select{font-family:inherit;color:inherit;}
button{border:0;background:none;cursor:pointer;}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right))
          max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  gap:var(--sp);}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:var(--sp);min-height:34px;flex:0 0 auto;}
#brand{font-weight:600;font-size:var(--fs-sm);letter-spacing:.16em;color:var(--dim);}
#brand b{color:var(--acc);}
#link{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);
  color:var(--dim);background:none;padding:5px 9px;border:1px solid var(--line);border-radius:999px;
  min-height:26px;}
#link .dot{width:7px;height:7px;border-radius:50%;background:#54607A;flex:0 0 auto;}
#link.live .dot{background:var(--acc);box-shadow:0 0 8px var(--acc);}
#link.live{color:var(--txt);border-color:rgba(75,227,200,.4);}

/* ---------- the grid ---------- */
/* The grid sits at the BOTTOM of whatever room is left, not the middle. On a
   tall phone the grid can only be as wide as the screen, so being square leaves
   real space above it — and pads belong under your thumb, not floating in the
   middle of the glass with the transport a stretch away. */
#gridwrap{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;justify-content:center;}
#grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  gap:clamp(5px,1vw,12px);
  /* SQUARE AT EVERY SIZE. A pad grid that is not square does not match the
     thing under your hands, and the whole point of a dedicated app is that the
     screen and the hardware agree.
     Width is the constraint and height follows it — `height:100%` alongside
     aspect-ratio wins over the ratio, which on a tall phone stretched all
     sixteen pads into portrait rectangles while a square desktop window looked
     perfectly fine. The 300px is the two rails and the top bar. */
  width:min(100%,calc(100dvh - 300px),calc(100vh - 300px));
  max-width:100%;aspect-ratio:1;height:auto;margin:0 auto;}
.pad{position:relative;border-radius:clamp(8px,1.4vw,16px);border:1px solid rgba(255,255,255,.08);
  overflow:hidden;box-shadow:var(--e1),var(--lip);
  background:linear-gradient(160deg,hsl(var(--h) 62% 26%),hsl(var(--h) 58% 15%));
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(5px,1vw,10px);text-align:left;transition:transform .05s;}
.pad .n{font-size:var(--fs-xs);color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums;}
.pad .t{font-size:var(--fs-sm);font-weight:600;line-height:1.15;word-break:break-word;
  text-shadow:0 1px 3px rgba(0,0,0,.7);}
.pad .t.empty{color:rgba(255,255,255,.3);font-weight:400;}
/* The strike glow is a separate layer so lighting a pad never touches layout —
   an opacity change on a child cannot reflow anything. */
.pad i{position:absolute;inset:0;background:hsl(var(--h) 90% 62%);opacity:0;pointer-events:none;
  transition:opacity .18s ease-out;}
.pad.hit i{opacity:.55;transition:none;}
.pad.held{border-color:hsl(var(--h) 90% 65%);box-shadow:0 0 0 2px hsl(var(--h) 90% 60% / .5),var(--e1);}
.pad.latch{border-color:var(--warm);box-shadow:0 0 0 2px rgba(255,180,84,.55),var(--e1);}
.pad.loop::after{content:'';position:absolute;right:6px;top:6px;width:7px;height:7px;
  border-radius:50%;background:var(--rec);box-shadow:0 0 7px var(--rec);}
.pad.arm{animation:armpulse 1s ease-in-out infinite;}
@keyframes armpulse{0%,100%{box-shadow:0 0 0 2px rgba(75,227,200,.25),var(--e1);}
  50%{box-shadow:0 0 0 4px rgba(75,227,200,.75),var(--e1);}}
.pad:active{transform:scale(.985);}

/* ---------- rails ---------- */
.rail{display:flex;align-items:center;gap:6px;flex:0 0 auto;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:var(--hit);padding:0 11px;
  border:1px solid var(--line);border-radius:11px;background:var(--panel);
  font-size:var(--fs-sm);white-space:nowrap;box-shadow:var(--lip);}
.chip.sm{min-height:32px;padding:0 9px;font-size:var(--fs-xs);}
.chip.on{background:var(--acc);color:#04140F;border-color:var(--acc);font-weight:600;}
.chip.rec.on{background:var(--rec);border-color:var(--rec);color:#fff;}
.chip.warm.on{background:var(--warm);border-color:var(--warm);color:#241300;}
.chip:disabled{opacity:.4;}
.lab{font-size:var(--fs-xs);color:var(--dim);letter-spacing:.12em;margin-right:2px;}
/* Tempo and TAP are one chip with two targets: the number if you know it, the
   button if you do not. Two ways to say the same thing, neither hidden behind a
   gesture nobody would guess at. */
.chip.pair{padding:0 4px 0 2px;gap:0;}
.chip.pair #tap{min-height:30px;padding:0 8px;border-radius:8px;font-size:var(--fs-xs);
  color:var(--dim);border:1px solid transparent;}
.chip.pair #tap:hover{color:var(--txt);border-color:var(--line);}
#tempo{width:46px;min-height:30px;background:transparent;border:0;text-align:center;
  font-size:var(--fs-md);font-variant-numeric:tabular-nums;outline:none;
  -moz-appearance:textfield;}
#tempo::-webkit-outer-spin-button,#tempo::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
#loopbar{flex:1 1 90px;height:6px;min-width:70px;border-radius:99px;background:rgba(255,255,255,.08);
  overflow:hidden;}
#loopbar i{display:block;height:100%;width:0;background:var(--acc);}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,4,7,.72);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40;}
.scrim.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);
  width:min(560px,94vw);max-height:min(84vh,760px);background:var(--panel);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--e2);
  display:flex;flex-direction:column;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:50;}
.sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);}
.sheet h2{margin:0;font-size:var(--fs-sm);letter-spacing:.16em;color:var(--dim);font-weight:600;}
.sheet .body{overflow:auto;padding:12px 14px;-webkit-overflow-scrolling:touch;}
.x{margin-left:auto;min-width:34px;min-height:34px;border-radius:9px;border:1px solid var(--line);
  color:var(--dim);font-size:16px;line-height:1;}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.row:last-child{border-bottom:0;}
.row .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--fs-sm);}
.row .sub{font-size:var(--fs-xs);color:var(--dim);}
.dim{color:var(--dim);font-size:var(--fs-xs);line-height:1.5;}
#drop{margin:0 0 10px;padding:20px 10px;border:1px dashed var(--line);border-radius:12px;
  text-align:center;color:var(--dim);font-size:var(--fs-sm);cursor:pointer;}
#drop.hot{border-color:var(--acc);color:var(--acc);background:rgba(75,227,200,.07);}
#file{display:none;}
#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:rgba(16,19,27,.96);border:1px solid var(--line);
  border-radius:11px;padding:9px 14px;font-size:var(--fs-sm);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:80;max-width:92vw;text-align:center;box-shadow:var(--e2);}
#toast.on{opacity:1;}
.grp{margin:0 0 16px;}
.grp h3{margin:0 0 6px;font-size:var(--fs-xs);letter-spacing:.16em;color:var(--dim);font-weight:600;}
.opts{display:flex;flex-wrap:wrap;gap:6px;}
@media (max-width:430px){ .rail{gap:5px;} .chip{padding:0 9px;} }

/* ---------- the drop-down menus ----------
   menu.js was imported and wired to every pad, key and knob in this edition,
   and NONE of it was visible: the module builds `.menu` / `.mitem` elements and
   the stylesheet for them lives in ULTIMATE, which this edition never copied.
   So every right-click and every long-press was building a real, working menu
   as an unstyled div at the end of <body> — behind #app, at opacity 0, with no
   position. Wired, working, and invisible. */
.menu{position:fixed;z-index:70;min-width:min(230px,72vw);max-width:min(300px,86vw);
  max-height:min(70svh,520px);overflow-y:auto;overscroll-behavior:contain;
  background:rgba(11,14,20,.985);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--e2),var(--lip);padding:5px;
  opacity:0;transform:scale(.97);transform-origin:top left;
  transition:opacity .11s,transform .11s cubic-bezier(.2,.7,.3,1);}
.menu.open{opacity:1;transform:none;}
.mitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--txt);
  font-size:var(--fs-sm);letter-spacing:.06em;cursor:pointer;min-height:var(--hit);}
.mitem:hover:not(:disabled),.mitem:focus-visible{background:rgba(75,227,200,.12);color:var(--acc);}
.mitem:disabled{opacity:.35;cursor:default;}
.mitem.danger:hover{background:rgba(255,107,132,.14);color:#FF6B84;}
.mitem.on .ml::before{content:'\2713 ';color:var(--acc);}
.mitem.back{color:var(--dim);}
.mitem .ml{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mitem .mh{flex:none;font-size:var(--fs-xs);color:var(--dim);letter-spacing:.1em;}
.mitem .mx{flex:none;color:var(--dim);font-size:var(--fs-md);}
.mhead{font-size:var(--fs-xs);color:var(--dim);letter-spacing:.18em;padding:7px 10px 4px;}
.msep{border:0;border-top:1px solid var(--line);margin:4px 6px;}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span id="brand">SKRiMPAD <b>JP</b></span>
    <button id="link" aria-live="polite"><span class="dot"></span><span id="linktxt">looking for your JP mini…</span></button>
    <button class="chip sm" id="libbtn">SOUNDS</button>
    <button class="chip sm" id="setbtn" aria-label="Setup and help">⚙</button>
  </div>

  <div id="gridwrap"><div id="grid" role="group" aria-label="Sixteen pads"></div></div>

  <!-- ONE RAIL. This was three, holding fourteen controls, and a pad instrument
       does not have fourteen things you touch while playing. What is left is
       what a hand actually reaches for mid-phrase; everything else moved under
       the control it belongs to, or into SETUP if it is a thing you decide once
       and never think about again. Nothing was removed. -->
  <div class="rail">
    <button class="chip" id="bank" aria-label="Preset">1</button>
    <button class="chip" id="repeat">REPEAT</button>
    <span class="chip pair">
      <input id="tempo" type="number" min="20" max="300" value="100" aria-label="Tempo">
      <button id="tap">TAP</button>
    </span>
    <button class="chip rec" id="rec" aria-label="Record">●</button>
    <button class="chip" id="play" aria-label="Play or pause">▶</button>
    <button class="chip" id="stop" aria-label="Stop">■</button>
    <div id="loopbar"><i></i></div>
    <button class="chip sm" id="undo" aria-label="Undo">↶</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="lib" role="dialog" aria-modal="true" aria-label="Sounds">
  <header><h2>SOUNDS</h2><span class="sub" id="libcount"></span><button class="x" id="libx">✕</button></header>
  <div class="body">
    <div id="drop">DROP AUDIO OR A .ZIP PACK HERE<br><span class="dim">or tap to browse</span></div>
    <input type="file" id="file" multiple accept="audio/*,.zip,.wav,.mp3,.ogg,.flac,.m4a,.aif,.aiff">
    <div id="list"></div>
  </div>
</div>

<div class="sheet" id="setup" role="dialog" aria-modal="true" aria-label="Setup">
  <header><h2>SETUP</h2><button class="x" id="setx">✕</button></header>
  <div class="body" id="setupbody"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // ultimate/src/core/pitch.js
  var GRAIN = 0.09;
  var SHORT_GRAIN = 0.035;
  var SHORT_ENOUGH = 0.45;
  var MAX_SEMIS = 24;
  var MAX_GRAINS = 400;
  var needsShift = (semis) => Math.abs(semis || 0) > 0.01;
  var clampSemis = (n) => Math.max(-MAX_SEMIS, Math.min(MAX_SEMIS, n || 0));
  var grainFor = (dur) => dur <= SHORT_ENOUGH ? SHORT_GRAIN : GRAIN;
  function playPitched(ctx, buffer, when, semis, dest, opts = {}) {
    const n = clampSemis(semis);
    const dur = buffer.duration;
    if (!needsShift(n)) {
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(dest);
      src.start(when);
      return { stop: when + dur, duration: dur, grains: 1, srcs: [src] };
    }
    const rate = Math.pow(2, n / 12);
    const g = opts.grain || grainFor(dur);
    const hop = g / 2;
    const count = Math.min(MAX_GRAINS, Math.max(1, Math.ceil(dur / hop)));
    const srcs = [];
    for (let i = 0; i < count; i++) {
      const readAt = i * hop;
      if (readAt >= dur) break;
      const room = Math.max(0, dur - i * hop);
      const take = Math.min(Math.min(g, room) * rate, Math.max(0, dur - readAt));
      if (take <= 1e-3) break;
      const out = take / rate;
      const t0 = when + i * hop;
      const win = ctx.createGain();
      if (i === 0) win.gain.setValueAtTime(1, t0);
      else {
        win.gain.setValueAtTime(1e-4, t0);
        win.gain.linearRampToValueAtTime(1, t0 + out / 2);
      }
      win.gain.linearRampToValueAtTime(1e-4, t0 + out);
      win.connect(dest);
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.playbackRate.value = rate;
      src.connect(win);
      src.start(t0, readAt, take);
      src.stop(t0 + out + 0.01);
      srcs.push(src);
    }
    return { stop: when + dur, duration: dur, grains: srcs.length, srcs };
  }
  function createGrainStream(ctx, buffer, dest, opts = {}) {
    const dur = buffer.duration;
    const loop2 = !!opts.loop;
    const loopStart = Math.max(0, Math.min(dur, opts.loopStart || 0));
    const loopEnd = Math.max(loopStart + 0.01, Math.min(dur, opts.loopEnd == null ? dur : opts.loopEnd));
    const g = opts.grain || grainFor(dur);
    const hop = g / 2;
    const AHEAD = 0.25, TICK = 60;
    const offline = typeof ctx.startRendering === "function";
    const horizon = opts.horizon || 8;
    let semis = clampSemis(opts.semis);
    let detune = 0;
    const mods = [];
    let read = Math.max(0, Math.min(dur, opts.offset || 0));
    let nextAt = 0;
    let timer = 0, started = false, done = false, endAt = Infinity;
    const live = [];
    function reap(now) {
      for (let i = live.length - 1; i >= 0; i--) if (live[i].until < now - 0.05) live.splice(i, 1);
    }
    function one() {
      const rate = Math.pow(2, semis / 12);
      const limit = loop2 ? loopEnd : dur;
      const room = loop2 ? g : Math.max(0, dur - read);
      const take = Math.min(Math.min(g, room) * rate, Math.max(0, limit - read));
      if (take <= 1e-3) {
        done = true;
        return false;
      }
      const out = take / rate;
      const t0 = nextAt;
      if (t0 >= endAt) {
        done = true;
        return false;
      }
      const win = ctx.createGain();
      win.gain.setValueAtTime(1e-4, t0);
      win.gain.linearRampToValueAtTime(1, t0 + out / 2);
      win.gain.linearRampToValueAtTime(1e-4, t0 + out);
      win.connect(dest);
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.playbackRate.value = rate;
      if (src.detune) {
        src.detune.value = detune;
        mods.forEach((m) => {
          try {
            m.connect(src.detune);
          } catch (e) {
          }
        });
      }
      src.connect(win);
      src.start(t0, read, take);
      src.stop(t0 + out + 0.01);
      live.push({ src, win, until: t0 + out });
      read += hop;
      if (loop2 && read >= loopEnd - 1e-3) read = loopStart + (read - loopEnd);
      nextAt += hop;
      return true;
    }
    function fill() {
      if (done) return;
      const limit = offline ? horizon : ctx.currentTime + AHEAD;
      let guard = MAX_GRAINS;
      while (!done && nextAt < limit && guard-- > 0) if (!one()) break;
      if (done) clear();
    }
    function clear() {
      if (timer) {
        clearInterval(timer);
        timer = 0;
      }
    }
    return {
      get running() {
        return started && !done;
      },
      start(when) {
        if (started) return;
        started = true;
        nextAt = when;
        fill();
        if (!offline && !done) timer = setInterval(fill, TICK);
      },
      // Live pitch change. Grains already scheduled keep the old rate — they are
      // 90ms long, so the stream has fully followed within one grain, which is
      // faster than a hand can move a wheel.
      setSemis(n) {
        semis = clampSemis(n);
      },
      // Bend, in cents. Applied to the grains already in flight AND remembered
      // for the ones not yet made, or the pitch would snap back every 45ms.
      setDetune(cents) {
        detune = cents;
        const now = ctx.currentTime;
        reap(now);
        live.forEach((l) => {
          try {
            l.src.detune && l.src.detune.setTargetAtTime(cents, now, 6e-3);
          } catch (e) {
          }
        });
      },
      // Register an LFO (or any node) to be summed into every grain's detune —
      // this is how vibrato reaches a granular voice, since the "source" it would
      // normally attach to is replaced twenty times a second.
      mod(node) {
        if (!node) return;
        mods.push(node);
        live.forEach((l) => {
          try {
            l.src.detune && node.connect(l.src.detune);
          } catch (e) {
          }
        });
      },
      stop(when) {
        endAt = when;
        clear();
        done = true;
        live.forEach((l) => {
          try {
            l.src.stop(Math.min(l.until + 0.01, when + 0.02));
          } catch (e) {
          }
        });
      }
    };
  }

  // ultimate/src/core/engine.js
  var NUDGE = 128 * 3 / 44100;
  function createEngine({ sampleFor, context, onFail, preserveLength } = {}) {
    let ctx = null, master = null, comp = null, spaceIn = null, analyser = null;
    let fxA = null, fxB = null;
    const meters = new Float32Array(64);
    let ready = false;
    let dead = false;
    function init() {
      if (ready || dead) return ctx;
      try {
        if (context) ctx = typeof context === "function" ? context() : context;
        else {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) throw new Error("no AudioContext");
          ctx = new AC({ latencyHint: "interactive" });
        }
      } catch (e) {
        dead = true;
        ctx = null;
        onFail && onFail(e);
        return null;
      }
      master = ctx.createGain();
      master.gain.value = 0.55;
      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -6;
      comp.knee.value = 8;
      comp.ratio.value = 4;
      comp.attack.value = 4e-3;
      comp.release.value = 0.2;
      spaceIn = ctx.createGain();
      spaceIn.gain.value = 1;
      const dl = ctx.createDelay(1);
      dl.delayTime.value = 0.13;
      const fb = ctx.createGain();
      fb.gain.value = 0.42;
      const tone = ctx.createBiquadFilter();
      tone.type = "lowpass";
      tone.frequency.value = 3200;
      spaceIn.connect(dl);
      dl.connect(tone);
      tone.connect(fb);
      fb.connect(dl);
      tone.connect(master);
      const ceiling = ctx.createWaveShaper();
      const K = 1.25;
      ceiling.curve = makeCurve((x) => Math.tanh(x * K) / K);
      ceiling.oversample = "4x";
      analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.7;
      fxA = ctx.createGain();

      hint: id === "fixed" ? "full level \u2014 every hit at 127" : "",
      run: () => {
        S.curve = id;
        save();
        renderSetup();
      }
    })));
  }
  function setRep(patch) {
    Object.assign(S, patch);
    rep.set({
      on: S.repeat,
      q: RATES[S.rate].q,
      swing: S.swing,
      gate: S.gate,
      mode: S.arp,
      latch: S.latch
    });
    const b = $("#repeat");
    b.classList.toggle("on", S.repeat);
    b.classList.toggle("warm", S.latch);
    b.textContent = (S.arp === "off" ? "REPEAT" : ARP_MODES[S.arp].l.toUpperCase()) + " " + RATES[S.rate].label + (S.latch ? " \xB7" : "");
    b.title = "Tap to turn note repeat on. Hold for the rate, swing, latch and the arpeggiator.";
    save();
    paintPads();
  }
  function repeatMenu() {
    return [
      { head: "Note repeat" },
      {
        label: S.repeat ? "Turn it off" : "Turn it on",
        on: S.repeat,
        run: () => setRep({ repeat: !S.repeat })
      },
      {
        label: "Latch",
        hint: "keep going after you let go",
        on: S.latch,
        run: () => setRep({ latch: !S.latch })
      },
      { sep: 1 },
      { label: "Rate", hint: RATES[S.rate].label, items: () => RATES.map((r, i) => ({
        label: r.label,
        on: S.rate === i,
        run: () => setRep({ rate: i })
      })) },
      {
        label: "Swing",
        hint: S.swing ? Math.round(S.swing * 100) + "%" : "straight",
        items: () => [0, 0.15, 0.3, 0.45].map((v) => ({
          label: v ? Math.round(v * 100) + "%" : "straight",
          on: S.swing === v,
          run: () => setRep({ swing: v })
        }))
      },
      { label: "Arpeggiator", hint: ARP_MODES[S.arp].l, items: () => ARP_IDS.map((id) => ({
        label: ARP_MODES[id].l,
        on: S.arp === id,
        run: () => setRep({ arp: id, repeat: id === "off" ? S.repeat : true })
      })) }
    ];
  }
  $("#repeat").addEventListener("click", () => setRep({ repeat: !S.repeat }));
  $("#repeat").addEventListener("contextmenu", (ev) => {
    ev.preventDefault();
    openMenu({ x: ev.clientX, y: ev.clientY, items: repeatMenu(), title: "Note repeat" });
  });
  onLongPress($("#repeat"), 420, (ev, x, y) => openMenu({ x, y, items: repeatMenu(), title: "Note repeat" }));
  $("#rec").addEventListener("click", () => transport("rec"));
  $("#play").addEventListener("click", () => {
    const st = loop.info.state;
    if (st === "playing" || st === "overdub") loop.pause();
    else loop.play();
    paintTransport(loop.info);
  });
  $("#stop").addEventListener("click", () => transport("stop"));
  $("#undo").addEventListener("click", () => {
    loop.undo();
    paintPads();
    toast("undone");
  });
  function paintTransport(info) {
    const st = info.state;
    $("#rec").classList.toggle("on", st === "recording" || st === "armed" || st === "overdub");
    const playing = st === "playing" || st === "overdub";
    $("#play").classList.toggle("on", playing);
    $("#play").textContent = playing ? "\u2759\u2759" : "\u25B6";
    $("#undo").disabled = !info.canUndo;
    $("#loopbar").firstElementChild.style.width = Math.round(info.pos * 100) + "%";
  }
  function openSheet(id) {
    $("#scrim").classList.add("open");
    $(id).classList.add("open");
    const f = $(id).querySelector("button, [tabindex]");
    if (f) f.focus();
  }
  function closeSheets() {
    $("#scrim").classList.remove("open");
    document.querySelectorAll(".sheet").forEach((s) => s.classList.remove("open"));
  }
  $("#libbtn").addEventListener("click", () => {
    renderList();
    openSheet("#lib");
  });
  $("#libx").addEventListener("click", closeSheets);
  $("#setbtn").addEventListener("click", () => {
    renderSetup();
    openSheet("#setup");
  });
  $("#setx").addEventListener("click", closeSheets);
  $("#scrim").addEventListener("click", closeSheets);
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeMenu();
      closeSheets();
    }
  });
  function renderList() {
    const box = $("#list");
    const items = lib.items;
    $("#libcount").textContent = items.length ? items.length + " sounds" : "";
    if (!items.length) {
      box.innerHTML = '<div class="dim">Nothing here yet. Drop a folder of samples or a .zip pack onto the panel above \u2014 a pack unpacks itself and files everything by name.</div>';
      return;
    }
    box.innerHTML = items.map((it) => '<div class="row" data-id="' + esc(it.id) + '"><span class="nm">' + esc(it.name) + (it.from ? '<br><span class="sub">' + esc(it.from) + "</span>" : "") + '</span><button class="chip sm" data-put>PUT ON A PAD</button><button class="chip sm" data-del aria-label="Remove">\u2715</button></div>').join("");
  }
  $("#list").addEventListener("click", async (ev) => {
    const row = ev.target.closest(".row");
    if (!row) return;
    const id = row.dataset.id;
    const it = lib.find(id);
    if (ev.target.closest("[data-del]")) {
      await lib.remove(id);
      S.slots.forEach((p) => p.forEach((sl, i) => {
        if (sl && sl.id === id) p[i] = null;
      }));
      warm.delete(id);
      save();
      paintPads();
      renderList();
      return;
    }
    if (ev.target.closest("[data-put]")) {
      openMenu({
        x: ev.clientX,
        y: ev.clientY,
        title: "Which pad?",
        items: Array.from({ length: PADS }, (_, i) => ({
          label: "Pad " + padLabel(i),
          hint: slot(i) && slot(i).name ? slot(i).name : "",
          run: () => {
            assign(i, id, it && it.name);
            closeSheets();
          }
        }))
      });
    }
  });
  async function takeFiles(list) {
    const files = Array.from(list || []);
    if (!files.length) return;
    eng.init();
    let audio = 0, packs = 0;
    lib.batch(true);
    try {
      for (const f of files) {
        if (isZip(f)) {
          packs++;
          const ab = await f.arrayBuffer();
          try {
            const r = await importZip(ab, {
              packName: f.name.replace(/\.zip$/i, ""),
              addBuffer: (name, raw, origin) => lib.addRaw(name, raw, origin),
              onProgress: (n, total) => toast("unpacking " + n + " of " + total + "\u2026")
            });
            toast(r.ok + " sounds from " + f.name + (r.bad ? " \xB7 " + r.bad + " skipped" : "") + (r.stopped ? " \xB7 stopped early, pack too big for one go" : ""));
          } catch (err) {
            toast(String(err.message || err));
          }
        } else {
          const m = await lib.add(f);
          if (m) audio++;
        }
      }
    } finally {
      lib.batch(false);
    }
    if (audio) toast(audio + " sound" + (audio === 1 ? "" : "s") + " imported");
    if (!audio && !packs) toast("nothing there the app could read");
    renderList();
  }
  $("#drop").addEventListener("click", () => $("#file").click());
  $("#file").addEventListener("change", async (e) => {
    await takeFiles(e.target.files);
    e.target.value = "";
  });
  ["dragenter", "dragover"].forEach((n) => window.addEventListener(n, (e) => {
    e.preventDefault();
    $("#drop").classList.add("hot");
  }));
  window.addEventListener("dragleave", (e) => {
    if (!e.relatedTarget) $("#drop").classList.remove("hot");
  });
  window.addEventListener("drop", async (e) => {
    e.preventDefault();
    $("#drop").classList.remove("hot");
    const dt = e.dataTransfer;
    if (!dt) return;
    if (!$("#lib").classList.contains("open")) openSheet("#lib");
    await takeFiles(dt.files);
  });
  function renderSetup() {
    const d = io.diagnostics();
    const ins = io.listInputs();
    const jp = ins.filter((p) => identify(p.name).jp);
    $("#setupbody").innerHTML = '<div class="grp"><h3>YOUR JP MINI</h3><div class="dim">' + (jp.length ? esc(jp[0].name) + " \u2014 " + (dev.learned(portName || jp[0].name) ? "grid learned." : "the grid has not been taught yet. Every JP mini can be remapped in the vendor software, so the app learns your unit rather than assuming.") : ins.length ? esc(ins.length + " MIDI port(s) visible, none of them a JP mini: " + ins.map((p) => p.name).join(", ")) : "No MIDI port visible yet. Plug the USB-C cable in, or use CONNECT BLUETOOTH.") + '</div><div class="dim" style="margin-top:6px"><b>On Windows, Bluetooth MIDI never appears as a port.</b> Windows keeps it behind a newer interface that browsers and desktop apps do not use, so a unit paired perfectly in Windows settings is still invisible to every app that has not written its own Bluetooth stack. This one has \u2014 CONNECT BLUETOOTH opens the link itself, with no vendor driver and no control panel in the way.</div><div class="opts" style="margin-top:8px"><button class="chip sm" id="sweepbtn">TEACH THE GRID</button><button class="chip sm" id="btbtn">CONNECT BLUETOOTH</button><button class="chip sm" id="rescanbtn">RESCAN</button><button class="chip sm" id="resetgrid">FORGET THE GRID</button></div></div><div class="grp"><h3>HOW HARD THE PADS FEEL</h3><div class="opts"><button class="chip sm" id="curvebtn">' + esc((CURVES[S.curve] || CURVES.linear).l) + '</button></div><div class="dim" style="margin-top:6px">Four curves, the same four the unit offers. FULL is full level: every hit at 127, whatever you do.</div></div><div class="grp"><h3>DIAGNOSIS</h3><div class="dim">' + esc(d.mode) + (d.sysex ? " + sysex" : " \xB7 no sysex") + " \xB7 " + d.inputs + " in \xB7 " + d.bytes + " messages" + (d.webBluetooth ? " \xB7 web bluetooth" : " \xB7 no web bluetooth") + (d.liveNames && d.liveNames.length ? "<br>Sending: " + esc(d.liveNames.join(", ")) : "") + (d.silentNames && d.silentNames.length ? "<br>Silent: " + esc(d.silentNames.join(", ")) : "") + (d.lost ? "<br>Last to drop: " + esc(d.lost) : "") + "</div></div>" + HELP.map(([h, rows]) => '<div class="grp"><h3>' + esc(h) + "</h3>" + rows.map(([a, b2]) => '<div class="row"><span class="nm"><b>' + esc(a) + '</b><br><span class="sub">' + esc(b2) + "</span></span></div>").join("") + "</div>").join("");
    $("#curvebtn").addEventListener("click", (ev) => openMenu({ x: ev.clientX, y: ev.clientY, items: curveMenu(), title: "Velocity" }));
    $("#sweepbtn").addEventListener("click", () => {
      closeSheets();
      startSweep();
    });
    $("#rescanbtn").addEventListener("click", () => {
      io.rescan();
      setTimeout(renderSetup, 500);
    });
    $("#resetgrid").addEventListener("click", () => {
      dev.reset(portName, null);
      toast("grid forgotten");
      renderSetup();
    });
    $("#btbtn").addEventListener("click", async () => {
      try {
        const r = await io.connectBluetooth({ onStatus: (s) => {
          if (s && s.hint) toast(s.hint.slice(0, 80));
        } });
        toast("bluetooth: " + (r && r.mode));
      } catch (e) {
        toast("bluetooth: " + (e && e.message || e));
      }
      renderSetup();
    });
  }
  var HELP = [
    ["THE PADS", [
      ["Hit them", "On the controller or on screen. On screen, where you hit the pad is how hard it plays \u2014 the bottom is loud, the top is soft."],
      ["Hold one", "Opens everything you can do to that pad: put a sound on it, take it off, nudge its gain or pitch, clear it out of the loop. Right-click does the same on a desktop."],
      ["PRESET", 'The unit has eight and so does this; each is its own set of sixteen sounds. Tap the number to step forward \u2014 the same movement as the button on the unit \u2014 or hold it to jump straight to one. Turning the preset on the controller switches the app too, because Program Change already means "I have chosen something else".']
    ]],
    ["NOTE REPEAT", [
      ["REPEAT", "Tap it on, then hold a pad and it retriggers, exactly as the unit does. Hold a second pad and it becomes an arpeggio without you changing anything \u2014 note repeat and an arpeggiator are the same machine with one pad in it or several."],
      ["The button says the state", "It reads REPEAT 1/16, or UP 1/8 if the arpeggiator is on, with a dot when latch is. One glance tells you what holding a pad is about to do."],
      ["Hold REPEAT", "Everything about repeating is under it: the rate \u2014 the eight divisions the unit itself offers, 1/4 through 1/32T \u2014 swing, latch, and the arpeggiator. They all belong to the same feature, so they live in the same place."],
      ["LATCH", "Keeps a pad repeating after you let go. Hitting a latched pad again takes it out, so you can build and unbuild a pattern one pad at a time rather than having to clear the lot."],
      ["The arpeggiator", "Up, down, up-down, as played, random, or all at once. Up-down turns at the ends without playing the end note twice, which is the limp you hear in most of them."],
      ["TAP", "Tap the tempo. It takes the median of your last few taps rather than the average, so one late tap does not drag the tempo with it."]
    ]],
    ["THE LOOPER", [
      ["\u25CF  RECORD", "Arms it. The loop starts at your FIRST HIT, not when you pressed the button, so the gap between deciding and playing is not baked into the front of your loop. Press it again while playing to overdub."],
      ["\u25B6  \u25A0", "Play is also pause \u2014 it shows you what pressing it will do next. Stop goes back to the top. The controller\u2019s own transport buttons drive these if it sends MIDI realtime or MMC."],
      ["The length", "Decided by your first pass, rounded up to whole bars. A loop 3.8 bars long can never line up with anything."],
      ["UNDO", 'Steps back through overdubs. Holding a pad also offers "clear it from the loop", which removes just that pad\u2019s part.'],
      ["What it records", "The hits, not the audio. Change the sample under a pad and the part you played is now that sample; change the tempo and it follows."]
    ]],
    ["SOUNDS", [
      ["Drop anything", "Audio files, a folder of them, or a .zip pack \u2014 anywhere on the window, not just on the panel. A pack unpacks itself, and the vendor prefix, key and tempo are stripped off the names so you can find things."],
      ["PUT ON A PAD", "From the list. Or hold the pad and pick from there \u2014 same job from the other end."],
      ["Where it lives", "On your device, in the app\u2019s own storage. It survives a restart and works with no network."]
    ]],
    ["THE CONTROLLER", [
      ["TEACH THE GRID", "Hit the sixteen pads in order, starting at pad 1 (bottom left). Every JP mini can be remapped in the vendor software, so no fixed note table can be right for every unit \u2014 this learns yours, once, and remembers it against that unit\u2019s name."],
      ["CONNECT BLUETOOTH", "Pair the unit in your system Bluetooth settings first, then press this. On Android it hands over to the system MIDI service; on Windows and Mac the app opens the BLE-MIDI link itself. A unit already paired with this app is reopened on its own next time."],
      ["If it drops out", "Whatever it was holding is released rather than left ringing, any pedal it left down is lifted, and it reconnects on its own."],
      ["Velocity", "Four curves, the same four the unit offers, in SETUP \u2014 it is a thing you decide once about how your pads feel, not something to keep on screen. FULL is full level: every hit at 127, whatever you do."]
    ]]
  ];
  var toastT = 0;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove("on"), 2600);
  }
  var noteT = 0;
  function note(msg) {
    clearTimeout(noteT);
    noteT = setTimeout(() => toast(msg), 60);
  }
  buildGrid();
  $("#tempo").value = S.bpm;
  $("#bank").textContent = String(S.preset + 1);
  setRep({});
  paintTransport(loop.info);
  lib.boot().then(() => {
    renderList();
    warmUp();
  });
  io.start().catch(() => {
  });
  io.keepLooking();
  io.autoReconnect({ onStatus: (s) => {
    if (s && s.connected) toast("reconnected");
  } }).catch(() => {
  });
  paintLink();
  setInterval(() => paintTransport(loop.info), 120);
  var kick = () => {
    eng.init();
    eng.resume();
  };
  ["pointerdown", "keydown"].forEach((e) => window.addEventListener(e, kick, { once: true }));
  window.__jp = {
    get S() {
      return S;
    },
    eng,
    io,
    lib,
    dev,
    rep,
    loop,
    padDown,
    padUp,
    strike,
    setPreset,
    setRep,
    transport,
    assign,
    startSweep,
    startLearn,
    takeFiles,
    get learnPad() {
      return learnPad;
    },
    paintPads,
    renderSetup,
    HELP,
    curved
  };
})();

</script>
