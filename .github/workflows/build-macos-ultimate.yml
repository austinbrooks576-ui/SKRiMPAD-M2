name: Build macOS (ULTIMATE)

# Mirrors build-windows-ultimate.yml. Same bundle, same prep script, same
# guards — the only difference is the runner and the electron-builder target,
# because the thing being shipped is the same application.
#
# NOT SIGNED, and deliberately so. Signing a Mac app needs an Apple Developer
# account ($99/yr) and a Developer ID certificate that would have to live in
# this repo's secrets. There is neither. `identity: null` in the prep script
# makes electron-builder skip signing rather than fail the job, and the release
# notes tell people what Gatekeeper will say and what to do about it — which is
# right-click → Open, once. A build that quietly pretended to be signed would
# fail at the very end of a twenty-minute job instead.

on:
  push:
    branches: [claude/skrimpad-ultimate]
    paths:
      - 'ultimate/**'
      - 'electron/**'
      - 'scripts/prep-electron-release.js'
      - '.github/workflows/build-macos-ultimate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the ULTIMATE bundle
        run: node ultimate/tools/bundle.js

      - name: Stage the app
        run: |
          mkdir -p electron/app
          cp ultimate/dist/index.html electron/app/index.html

      # Electron loads this over file://, so a bundle that still points at
      # ./core/*.js produces a green build and a blank window.
      - name: Verify the bundle is self-contained
        run: |
          f=electron/app/index.html
          test -s "$f" || { echo "bundle is empty"; exit 1; }
          grep -q 'id="deck"' "$f" || { echo "bundle has no deck — wrong file?"; exit 1; }
          if grep -qE '<script[^>]+src="\./|<link[^>]+href="\./core' "$f"; then
            echo "bundle still references external files; it must run from file://"
            exit 1
          fi

      - name: Prep release version + update channel
        run: node scripts/prep-electron-release.js electron/package.json ultimate ${{ github.run_number }}

      # electron-builder renders the .icns from this PNG. If it is missing it
      # falls back to the stock Electron icon without failing, so the failure
      # mode is a shipped app wearing someone else's logo — check it directly.
      - name: Verify the macOS icon is present
        run: |
          f=ultimate/brand/icon-512.png
          test -f "$f" || { echo "icon-512.png missing — run ultimate/tools/icon.js"; exit 1; }
          node -e "
            const b = require('fs').readFileSync('$f');
            if (b.readUInt32BE(0) !== 0x89504e47) throw new Error('not a PNG');
            const w = b.readUInt32BE(16), h = b.readUInt32BE(20);
            // electron-builder requires at least 512x512 to build an .icns.
            if (w < 512 || h < 512) throw new Error('icon is ' + w + 'x' + h + ', need 512x512');
            console.log('icon-512.png ok — ' + w + 'x' + h);
          "

      - name: Install dependencies
        run: |
          cd electron
          npm install

      # Both architectures. An Intel Mac cannot run an arm64 build and an Apple
      # Silicon Mac runs an x64 build only through Rosetta, with the audio
      # thread paying for the translation — which is exactly the thread that
      # must not pay for anything.
      - name: Build macOS disk images
        run: |
          cd electron
          npm run build:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skrimpad-ultimate-${{ github.run_number }}-macos
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip

      # No latest-mac.yml in the release, on purpose. Squirrel.Mac refuses to
      # apply an update to an unsigned app, so publishing update metadata would
      # make every Mac copy download a few hundred megabytes in the background
      # and then fail. main.js disables the updater on darwin to match.
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ultimate-mac-v1.0.${{ github.run_number }}
          name: SKRiMPAD ULTIMATE macOS — Build ${{ github.run_number }}
          body: |
            SKRiMPAD **ULTIMATE** for macOS (v1.0.${{ github.run_number }})

            One continuous depth instead of screens. Scroll or ⌘-scroll to fly
            from the CONSTELLATION — the whole song at once — down through the
            DECK, a CELL, its VOICE, and finally the GRAIN, the signal itself.

            **Which file do I want?**

            - **`...-arm64.dmg`** — Apple Silicon (M1, M2, M3, M4). Any Mac sold
              since late 2020.
            - **`...-x64.dmg`** — Intel Macs.

            If you are not sure:  → About This Mac. "Chip" means arm64,
            "Processor" means x64.

            **First launch — please read.** These builds are **not signed by
            Apple**, because that requires a paid Apple Developer account.
            macOS will say *"SKRiMPAD ULTIMATE cannot be opened because the
            developer cannot be verified."* That is Gatekeeper doing its job on
            an unsigned app, not a warning about this one specifically. To open
            it:

            1. Drag the app to Applications.
            2. **Right-click** (or Control-click) it → **Open**.
            3. Click **Open** in the dialog.

            You only do this once. After that it launches normally.

            **No auto-update on macOS.** Unsigned apps cannot self-update, so
            the Mac build never nags you and never downloads anything in the
            background. Come back to this page for new builds.

            **Plug a controller in and play it.** Velocity, pitch bend, mod
            wheel, aftertouch, sustain and expression all just work, over USB or
            Bluetooth. Grant Bluetooth access when macOS asks, or wired MIDI
            will still be there.

            **On an iPad or iPhone?** There is no Mac app for those — but the
            whole studio runs in Safari and installs to your home screen.
            See the **Web app** release, or open the site and use
            **Share → Add to Home Screen**.

            **Requirements:** macOS 11 Big Sur or newer.
          files: |
            electron/dist/*.dmg
            electron/dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
