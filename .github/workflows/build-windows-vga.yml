name: Build Windows (VGA)

on:
  push:
    branches: [claude/skrimpad-vga]
    paths:
      - 'electron/**'
      - 'android/app/src/main/assets/index.html'
      - 'scripts/set-edition.js'
      - '.github/workflows/build-windows-vga.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy app to electron
        shell: bash
        run: |
          mkdir -p electron/app
          cp android/app/src/main/assets/index.html electron/app/index.html
          cp android/app/src/main/assets/layout.json electron/app/layout.json

      - name: Set VGA edition
        run: node scripts/set-edition.js electron/app/index.html vga

      - name: Prep release version + update channel
        run: node scripts/prep-electron-release.js electron/package.json vga ${{ github.run_number }}

      # RETRIED. This step pulls the Electron binary, and that download does
      # not go through npm — the package's own postinstall fetches a ~100MB zip
      # itself, so npm's fetch-retries never apply to the one request most
      # likely to fail. A build was lost to `RequestError: socket hang up` with
      # nothing wrong in the repo at all. Three attempts with a backoff turns a
      # transient network blip into a slower green build instead of a red one.
      - name: Install dependencies
        shell: bash
        run: |
          cd electron
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm install attempt $attempt failed; retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "npm install failed three times"
          exit 1

      - name: Build Windows installer
        run: |
          cd electron
          npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skrimpad-vga-setup-${{ github.run_number }}-windows
          path: electron/dist/*.exe

      # Ship installer + electron-updater metadata (latest-vga.yml + .blockmap)
      # on the VGA channel so it never cross-serves the other editions.
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vga-win-v1.0.${{ github.run_number }}
          name: SKRiMPAD VGA Windows — Setup ${{ github.run_number }}
          body: |
            SKRiMPAD VGA — **Video Game Audio edition** for Windows (v1.0.${{ github.run_number }})

            - **`SKRiMPAD M2 Setup 1.0.${{ github.run_number }}.exe`** — installs with shortcuts
            - **`SKRiMPAD M2 1.0.${{ github.run_number }}.exe`** — portable, runs from anywhere

            Original GB/GBC/GBA-style chiptune soundbytes in the library + a world
            of 40+ original named pixel characters that wander, dance and cheer to
            your music (👾 roster toggles each). Includes the full SKRiMPAD STUDIO
            DAW + plugin rack.

            Auto-update is built in, with a fail-safe roll-back. **Requirements:** Windows 10+ (64-bit)
          files: |
            electron/dist/*.exe
            electron/dist/latest*.yml
            electron/dist/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
