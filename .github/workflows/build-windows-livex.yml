name: Build Windows (LIVEx)

on:
  push:
    branches: [claude/skrimpad-livex]
    paths:
      - 'electron/**'
      - 'livex/**'
      - 'android/app/src/main/assets/index.html'
      - 'android/app/src/main/assets/layout.json'
      - '.github/workflows/build-windows-livex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build the REAL LIVEx app: bundle src/ (ES modules) into one self-contained
      # index.html — Electron can't `import` modules over file://. Previously this
      # copied SKRiMPAD M2's index.html, which shipped the wrong app entirely.
      - name: Bundle LIVEx app
        shell: bash
        run: |
          node livex/tools/bundle.js
          mkdir -p electron/app
          cp livex/dist/index.html electron/app/index.html
          grep -q 'SKRiMPAD x LIVE x' electron/app/index.html || { echo "::error::bundled app is not LIVEx"; exit 1; }

      - name: Stamp app version
        shell: bash
        run: |
          sed -i "s/window.SKRIMPAD_VERSION='[^']*';\/\*BUILD_VERSION\*\//window.SKRIMPAD_VERSION='1.0.${{ github.run_number }}';\/\*BUILD_VERSION\*\//" electron/app/index.html
          grep -o "SKRIMPAD_VERSION='[^']*'" electron/app/index.html | head -1

      - name: Prep release version + update channel
        run: node scripts/prep-electron-release.js electron/package.json livex ${{ github.run_number }}

      - name: Install dependencies
        run: |
          cd electron
          npm install

      - name: Build Windows installer
        run: |
          cd electron
          npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skrimpad-livex-setup-${{ github.run_number }}-windows
          path: electron/dist/*.exe

      # Ship installer + electron-updater metadata (latest-livex.yml + .blockmap) on
      # the LIVEx channel so it never cross-serves the consumer / SE / VGA editions.
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: livex-win-v1.0.${{ github.run_number }}
          name: SKRiMPAD LIVEx — Windows — Setup ${{ github.run_number }}
          body: |
            **SKRiMPAD LIVEx** for Windows (v1.0.${{ github.run_number }}) — plug in any
            controller and it draws itself.

            - **`SKRiMPAD LIVEx Setup 1.0.${{ github.run_number }}.exe`** — installs to Program Files with shortcuts
            - **`SKRiMPAD LIVEx 1.0.${{ github.run_number }}.exe`** — portable, runs from anywhere

            The moment a MIDI / BLE controller or gamepad connects, LIVEx identifies it
            (name + capability probe), **learns it** for instant recall next time, and
            renders a clean top-down **schematic** of exactly that hardware — keyboards
            scale (and window with octave paging on small screens), pad banks + both
            A/B shelves (KNOB-B / PAD-B), knobs, wheels, and the full printed key legend.
            Playing it **lights up the board**; every element is drop- and tap-able.
            Connects to and displays **all** attached controllers at once.

            Playing it **makes sound** — polyphonic synth on the keys, a synthesized
            drum kit on the pads, or your own samples: drop any WAV / MP3 / FLAC / OGG /
            AIFF / M4A (or a **.zip** pack) onto a pad or key from the library. Arm
            **● REC** and it captures a **loop** you can overdub; **Play / Stop**, a
            **metronome + BPM**, one-shot **SYNC** quantize, and **Export** the loop to a
            WAV. Displays and connects to **all** attached controllers at once.

            **Bluetooth MIDI is fixed** — on Windows it uses the KORG driver-bridged
            MIDI port instead of fighting it over GATT (a BLE device allows one GATT
            link). KORG note: open the KORG BLE-MIDI panel and press CONNECT so the
            port transmits. Web MIDI is auto-enabled at boot. Auto-update with fail-safe
            rollback is built in. **Requires:** Windows 10+ (64-bit).
          files: |
            electron/dist/*.exe
            electron/dist/latest*.yml
            electron/dist/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
