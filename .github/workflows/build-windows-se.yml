name: Build Windows (Special Edition)

on:
  push:
    branches: [claude/special-edition-samurai]
    paths:
      - 'electron/**'
      - 'android/app/src/main/assets/index.html'
      - 'android/app/src/main/assets/layout.json'
      - '.github/workflows/build-windows-se.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy app to electron
        shell: bash
        run: |
          mkdir -p electron/app
          cp android/app/src/main/assets/index.html electron/app/index.html
          cp android/app/src/main/assets/layout.json electron/app/layout.json

      - name: Prep release version + update channel
        run: node scripts/prep-electron-release.js electron/package.json se ${{ github.run_number }}

      - name: Install dependencies
        run: |
          cd electron
          npm install

      - name: Build Windows installer
        run: |
          cd electron
          npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skrimpad-se-setup-${{ github.run_number }}-windows
          path: electron/dist/*.exe

      # Ship installer + electron-updater metadata (latest-se.yml + .blockmap).
      # SE has its own channel so it never cross-serves consumer/VGA builds; the
      # .exe keeps electron-builder's name so it stays in sync with the yml.
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: se-win-v1.0.${{ github.run_number }}
          name: SKRiMPAD M2 — Special Edition Windows — Setup ${{ github.run_number }}
          body: |
            SKRiMPAD M2 — **Special Edition** (Samurai Champloo HUD) for Windows (v1.0.${{ github.run_number }})

            - **`SKRiMPAD M2 Setup 1.0.${{ github.run_number }}.exe`** — installs to Program Files with shortcuts
            - **`SKRiMPAD M2 1.0.${{ github.run_number }}.exe`** — portable, runs from anywhere

            A standalone themed studio — boots straight into the HUD. SIX themes
            behind the 🎨 palette: Samurai Champloo, Space Dust, Cyberpunk,
            Adeptus Mechanicus, Mushroom RGB, 80s Wizard Arcade — HUD AI console,
            floating BPM/volume pills, REVOLVE orbit (glass windows sweep behind
            the AI node), themed library + sample editor, katanas + dragon.

            Auto-update is built in, with a fail-safe roll-back. **Requirements:** Windows 10+ (64-bit)
          files: |
            electron/dist/*.exe
            electron/dist/latest*.yml
            electron/dist/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
