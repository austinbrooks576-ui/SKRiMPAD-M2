name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'android/app/src/main/assets/index.html'
      - 'scripts/set-edition.js'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy app to electron
        shell: bash
        run: |
          mkdir -p electron/app
          cp android/app/src/main/assets/index.html electron/app/index.html
          cp android/app/src/main/assets/layout.json electron/app/layout.json

      - name: Set consumer edition (hide Special Edition HUD)
        run: node scripts/set-edition.js electron/app/index.html consumer

      - name: Prep release version + update channel
        run: node scripts/prep-electron-release.js electron/package.json consumer ${{ github.run_number }}

      - name: Install dependencies
        run: |
          cd electron
          npm install

      - name: Build Windows installer
        run: |
          cd electron
          npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skrimpad-setup-${{ github.run_number }}-windows
          path: electron/dist/*.exe

      # Ship the installer AND the electron-updater metadata (latest.yml +
      # .blockmap) so the in-app auto-updater can pull future builds. Do NOT
      # rename the .exe — its name must match latest.yml or the updater 404s.
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: win-v1.0.${{ github.run_number }}
          name: SKRiMPAD M2 Windows — Setup ${{ github.run_number }}
          body: |
            SKRiMPAD M2 — Consumer Edition for Windows (v1.0.${{ github.run_number }})

            - **`SKRiMPAD M2 Setup 1.0.${{ github.run_number }}.exe`** — installs to Program Files with shortcuts
            - **`SKRiMPAD M2 1.0.${{ github.run_number }}.exe`** — portable, runs from anywhere

            Auto-update is built in — future versions install themselves (with a
            fail-safe roll-back if a build won't start). **Requirements:** Windows 10+ (64-bit)
          files: |
            electron/dist/*.exe
            electron/dist/latest*.yml
            electron/dist/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
