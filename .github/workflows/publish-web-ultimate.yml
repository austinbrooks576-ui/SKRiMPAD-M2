name: Publish Web App (ULTIMATE)

# THE iPAD ROUTE.
#
# An iPad cannot install a .dmg — that is a Mac binary — and it cannot install
# an .ipa without an Apple Developer account, a provisioning profile and either
# the App Store or a signed enterprise distribution. None of those exist here,
# and no amount of build configuration conjures them.
#
# What an iPad CAN install, with no account, no store and no cable, is a web
# app: open the site in Safari, Share → Add to Home Screen, and it gets a home
# screen icon, opens full-screen with no browser chrome, and — because of the
# service worker — runs with the network off afterwards. ULTIMATE fits that
# unusually well: it bundles to one self-contained HTML file and synthesises
# every sound it makes, so the entire studio is under a megabyte and there is
# nothing to stream.
#
# This job publishes that site to GitHub Pages and ALSO attaches it as a zip to
# a release, so the app is downloadable even if Pages is switched off.

on:
  push:
    branches: [claude/skrimpad-ultimate]
    paths:
      - 'ultimate/**'
      - '.github/workflows/publish-web-ultimate.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one in flight — a half-written
# Pages deployment is a broken site, which for an installed PWA means a broken
# app on someone's home screen.
concurrency:
  group: pages-ultimate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the ULTIMATE bundle
        run: node ultimate/tools/bundle.js

      # site.js copies the bundle + manifest + service worker + icons into
      # ultimate/site/, stamps the service worker's cache name with a hash of
      # this build, and refuses to produce a site whose manifest or worker
      # points at a file that is not there. Every one of those failures is
      # silent in a browser, so they are loud here.
      - name: Assemble the installable site
        run: node ultimate/tools/site.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skrimpad-ultimate-web-${{ github.run_number }}
          path: ultimate/site/

      - name: Package the site for download
        run: |
          cd ultimate/site
          zip -r ../../skrimpad-ultimate-web-${{ github.run_number }}.zip .

      # enablement stays FALSE on purpose. The action can switch Pages on by
      # itself, and doing so would publish this app at a public github.io
      # address — which is a decision about putting something on the open
      # internet, not a build step, so it is the repository owner's to make and
      # not a side effect of a workflow. Until it is switched on, everything
      # below still runs and the zip release below is the app.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ultimate/site

      # Said out loud, because a skipped step in a green run is invisible, and
      # "the iPad install link does not exist" would otherwise look like a
      # feature that was never built rather than a setting nobody has flipped.
      - name: Say why there is no link yet
        if: steps.pages.outcome != 'success'
        run: |
          echo "### No web address yet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GitHub Pages is not switched on for this repository, so the site was built and attached to a release but not published to a URL. An iPad installs from a URL, so until this is on there is nothing for Safari's Add to Home Screen to point at." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Settings → Pages → Build and deployment → Source: GitHub Actions.** Then re-run this workflow. Note that this publishes the app at a public \`github.io\` address." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The zip on the release below is the whole app either way." >> $GITHUB_STEP_SUMMARY

      # A release as well as Pages, for two reasons: it is the only copy if
      # Pages is not enabled on the repo, and it gives the desktop editions a
      # stable place to point at.
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ultimate-web-v1.0.${{ github.run_number }}
          name: SKRiMPAD ULTIMATE Web — Build ${{ github.run_number }}
          body: |
            SKRiMPAD **ULTIMATE** as an installable web app (v1.0.${{ github.run_number }}).

            The whole studio, under a megabyte, running offline once it has been
            opened once. This is **how you get it onto an iPad or iPhone** —
            Apple does not allow installing apps from anywhere but the App Store
            without a paid developer account, but a web app installs from Safari
            with no account at all.

            ### iPad / iPhone

            1. Open the site in **Safari** (it must be Safari — Chrome on iOS
               cannot add to the home screen).
            2. Tap **Share** (the box with the arrow).
            3. Tap **Add to Home Screen**.

            It now has its own icon, opens full-screen with no address bar, and
            works with the network off. Plug a MIDI controller into the USB-C
            port and it plays — on iPadOS, use Safari; Web MIDI arrived in
            Safari 16.4.

            ### Android

            Open the site in Chrome and take the **Install app** prompt, or
            ⋮ → **Add to Home screen**. (There is also a real APK on the
            ULTIMATE Android releases if you would rather have one.)

            ### Desktop

            Chrome or Edge show an install button in the address bar. Or just
            use the site — nothing is missing in a tab.

            ### Offline / no server

            `skrimpad-ultimate-web-${{ github.run_number }}.zip` below contains
            the whole app. Unzip it and open `index.html` in any browser and it
            runs — though opened as a local file it cannot register the service
            worker, so "install to home screen" needs the hosted address.

            **Everything you make stays on your device.** Nothing is uploaded,
            there is no account, and it works on a plane.
          files: |
            skrimpad-ultimate-web-${{ github.run_number }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Separate job because deploy-pages must run in a `github-pages` environment,
  # and it is allowed to fail without taking the release down with it: if Pages
  # has never been enabled on this repo the zip above is still published.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
